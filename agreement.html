<div class="shell">
  <header class="sign-brand" id="signBrand">
    <div class="sign-brand-rule" aria-hidden="true"></div>
    <div class="sign-brand-row">
      <div class="sign-brand-office">
        <img data-brand="logo" class="sign-brand-logo" alt="" hidden>
        <div class="sign-brand-text">
          <div class="sign-brand-name" data-brand="agency" hidden></div>
          <div class="sign-brand-meta" data-brand="meta" hidden></div>
        </div>
      </div>
      <a class="sign-brand-via" href="/" aria-label="שוק הנדל״ן - לדף הבית">
        <img src="assets/logo-shuknadlan.png" alt="שוק נדל״ן" width="40" height="48">
        <span>שוק נדל״ן</span>
      </a>
    </div>
  </header>

  <div class="state is-on" id="stateLoading">
    <div class="card msg-card"><div class="spin"></div><p>טוען את המסמך…</p></div>
  </div>

  <div class="state" id="stateError">
    <div class="card msg-card">
      <div class="sign-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fdecee" stroke="#6e1022" stroke-width="2"/><path d="M24 14v12" stroke="#6e1022" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="32" r="1.8" fill="#6e1022"/></svg></div>
      <h1 id="errTitle">המסמך לא נמצא</h1>
      <p id="errDetail"></p>
    </div>
  </div>

  <div class="state" id="stateDoc">
    <div class="card head">
      <h1 id="docTitle"></h1>
      <span class="badge" id="statusBadge"></span>
      <p class="meta" id="docMeta"></p>
      <div class="code" id="verifyCode"></div>
      <div class="actions">
        <button type="button" class="btn" id="pdfBtn">הורדה כ-PDF</button>
        <button type="button" class="btn btn-ghost" id="printBtn">הדפסה</button>
      </div>
    </div>
    <div class="card doc-wrap sign-sheet"><div class="agr-inner" id="docBody"></div></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://obookujgolazrwycsiyn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oq0dgmwKy83K7sDO3hoDMA_VpSnR5Fx';
const FN_URL = SUPABASE_URL + '/functions/v1/agreement-sign';

const token = new URLSearchParams(location.search).get('t') || '';
let docTitle = 'הסכם';
let viewAgent = null;
let viewCode = '';

function showState(id){
  ['stateLoading','stateError','stateDoc']
    .forEach(s => document.getElementById(s).classList.toggle('is-on', s === id));
}

function fail(title, detail){
  document.getElementById('errTitle').textContent = title;
  document.getElementById('errDetail').textContent = detail || '';
  showState('stateError');
}

async function init(){
  if (!token) return fail('הקישור אינו תקין', 'חסר מזהה בכתובת. פתחו את הקישור המלא מההודעה שקיבלתם.');

  let data = {};
  try {
    const res = await fetch(FN_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ action:'view', token }),
    });
    data = await res.json().catch(()=> ({}));
    if (!res.ok || !data.ok){
      if (data.error === 'cancelled') return fail('ההסכם בוטל', 'ההסכם הזה בוטל ואינו בתוקף.');
      return fail('המסמך לא נמצא', 'ייתכן שהקישור הועתק חלקית. בקשו מהסוכן/ת לשלוח אותו שוב.');
    }
  } catch(err){
    console.error(err);
    return fail('שגיאת רשת', 'נסו לרענן את העמוד בעוד רגע.');
  }

  const a = data.agreement;
  docTitle = a.title || 'הסכם';
  viewAgent = data.agent || null;
  viewCode = a.verify_code || '';
  if (window.AgreementDoc.paintBrand) window.AgreementDoc.paintBrand(document.getElementById('signBrand'), viewAgent);
  document.getElementById('docTitle').textContent = docTitle;

  const badge = document.getElementById('statusBadge');
  const signed = a.status === 'signed';
  badge.textContent = signed ? '✓ נחתם' : 'ממתין לחתימה';
  badge.classList.toggle('pending', !signed);

  const parts = [];
  if (data.agent && data.agent.name){
    parts.push('נערך על ידי ' + data.agent.name + (data.agent.agency ? ' · ' + data.agent.agency : ''));
  }
  if (signed && a.signed_at) parts.push('נחתם ב-' + new Date(a.signed_at).toLocaleString('he-IL'));
  document.getElementById('docMeta').textContent = parts.join(' · ');
  document.getElementById('verifyCode').textContent = 'קוד אימות המסמך: ' + (a.verify_code || '');

  /* ‏document_html נכתב בדפדפן של הסוכן/ת ונחסם לשינוי במסד — אין בו קלט
     של גולש/ת. תמונות החתימה נבדקות בנפרד ב-signatureBlockHtml. */
  document.getElementById('docBody').innerHTML =
    (a.document_html || '') + window.AgreementDoc.signatureBlockHtml(data.signers || []);

  showState('stateDoc');
}

document.getElementById('printBtn').addEventListener('click', ()=> window.print());

document.getElementById('pdfBtn').addEventListener('click', async (e)=>{
  const btn = e.currentTarget;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'מכין את הקובץ…';
  try {
    await window.AgreementDoc.downloadPdf(
      document.getElementById('docBody'),
      docTitle.replace(/[\\/:*?"<>|]/g, '-') + '.pdf',
      window.AgreementDoc.brandFrom(viewAgent, viewCode));
  } catch(err){
    console.error(err);
    btn.textContent = 'לא הצלחנו להפיק PDF - נסו שוב';
    setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 2600);
    return;
  }
  btn.textContent = original;
  btn.disabled = false;
});

init();
</script>
</body>
