<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נכס | שוק נדל״ן</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#1B1F26; --ink-soft:#565C63; --paper:#DEDCD6; --paper-raised:#F4F3F0;
    --line:#C5C3BC; --teal:#1C3A5E; --teal-dark:#122840; --teal-tint:#E0E7ED;
    --gold:#8B2332; --gold-dark:#6B1A26; --gold-tint:#F1DFE1; --brick:#6B1A26;
    --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --shadow-sm:0 2px 8px rgba(15,52,53,.08); --maxw:900px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55}
  h1,h2,.display{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--teal-dark);margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit;font-size:1rem}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}
  .card{background:var(--paper-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:.95rem}
  .btn-gold{background:var(--gold);color:#241505}
  .btn-gold:disabled{opacity:.5;cursor:not-allowed}
  .btn-block{width:100%}
  header.site{background:var(--paper-raised);border-bottom:1px solid var(--line);padding:14px 0}
  .header-inner{display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:8px}
  .logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--gold),var(--teal) 65%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Frank Ruhl Libre',serif;font-weight:900}
  .logo-word{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:1.1rem;color:var(--teal-dark)}
  .back-link{font-size:.85rem;font-weight:700;color:var(--teal)}

  #loadingState{padding:60px 18px;text-align:center;color:var(--ink-soft)}
  #notFoundState{display:none;padding:60px 18px;text-align:center}
  #propertyContent{display:none}

  .hero-media{height:280px;background-size:cover;background-position:center;position:relative}
  .promo-ribbon{position:absolute;top:14px;right:14px;background:var(--gold);color:#241505;font-size:.72rem;font-weight:800;padding:4px 11px;border-radius:6px}
  .gallery-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 0;max-width:1180px;margin:0 auto}
  .gallery-strip:empty{display:none}
  .gallery-strip button{padding:0;border:2px solid transparent;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;background:none;cursor:pointer;line-height:0}
  .gallery-strip button.active{border-color:var(--gold)}
  .gallery-strip img{width:84px;height:62px;object-fit:cover;display:block}
  .img-count{position:absolute;bottom:14px;right:14px;background:rgba(27,31,38,.7);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:6px}
  .content-grid{display:grid;grid-template-columns:1fr;gap:20px;padding:22px 0 40px}
  @media(min-width:760px){.content-grid{grid-template-columns:1.6fr 1fr;align-items:start}}

  .price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .price{font-family:'Frank Ruhl Libre',serif;font-size:2rem;color:var(--teal-dark)}
  .deal-pill{font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--teal-tint);color:var(--teal)}
  .title{font-size:1.15rem;margin-top:6px;color:var(--ink)}
  .meta-row{display:flex;gap:16px;margin-top:10px;color:var(--ink-soft);font-size:.88rem;flex-wrap:wrap}
  .meta-row span{display:flex;align-items:center;gap:5px}

  .section{margin-top:26px}
  .section h2{font-size:1.05rem;margin-bottom:10px}
  .agency-strip{display:flex;align-items:center;gap:12px;padding:14px;margin-top:26px}
  .agency-avatar{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Frank Ruhl Libre',serif;flex-shrink:0}
  .agency-name{font-weight:700;font-size:.92rem}
  .agency-sub{font-size:.78rem;color:var(--ink-soft)}

  #propMap{height:220px;border-radius:var(--radius-md);overflow:hidden;margin-top:26px}

  .sidebar .card{padding:20px;margin-bottom:16px}
  .inquiry-card h2{font-size:1.05rem;margin-bottom:4px}
  .inquiry-card p.sub{font-size:.8rem;color:var(--ink-soft);margin:0 0 14px}
  .field{margin-bottom:10px}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px}
  .field textarea{resize:vertical;min-height:70px}
  #inquiryFeedback{font-size:.8rem;margin-top:8px;text-align:center;min-height:1.2em}

  .calc-card h2{font-size:1.05rem;margin-bottom:14px}
  .calc-field{margin-bottom:10px}
  .calc-field label{font-size:.74rem;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:4px}
  .calc-field input{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 10px}
  .calc-result{background:var(--teal-tint);border-radius:var(--radius-sm);padding:12px;text-align:center;margin-top:10px}
  .calc-result .num{font-family:'Frank Ruhl Libre',serif;font-size:1.5rem;color:var(--teal-dark)}
  .calc-result .lbl{font-size:.72rem;color:var(--ink-soft)}
  .ltv-warn{color:var(--brick);font-size:.72rem;font-weight:700;margin-top:8px;text-align:center}

  .toast{position:fixed;bottom:20px;right:20px;left:20px;max-width:400px;margin:0 auto;background:var(--teal-dark);color:#fff;padding:14px 18px;border-radius:var(--radius-sm);font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:200}
</style>
</head>
<body>

<header class="site">
  <div class="wrap header-inner">
    <a href="index.html" class="logo"><span class="logo-mark">ש</span><span class="logo-word">שוק נדל״ן</span></a>
    <a href="index.html" class="back-link">← כל הנכסים</a>
  </div>
</header>

<div id="loadingState">טוען נכס…</div>

<div id="notFoundState" class="wrap">
  <h1 style="font-size:1.3rem">הנכס לא נמצא</h1>
  <p style="color:var(--ink-soft)">ייתכן שהמודעה הוסרה או שהקישור שגוי.</p>
  <a href="index.html" class="btn btn-gold" style="margin-top:16px">חזרה לדף הבית</a>
</div>

<div id="propertyContent">
  <div class="hero-media" id="heroMedia"></div>
  <div class="gallery-strip" id="galleryStrip"></div>
  <div class="wrap content-grid">
    <div class="main-col">
      <div class="price-row">
        <span class="price" id="propPrice">—</span>
        <span class="deal-pill" id="propDealPill">—</span>
      </div>
      <div class="title" id="propTitle">—</div>
      <div class="meta-row">
        <span id="propRooms">—</span>
        <span id="propType">—</span>
        <span id="propCity">—</span>
      </div>

      <div class="card agency-strip" id="agencyStrip" style="cursor:pointer">
        <div class="agency-avatar" id="agencyAvatar">·</div>
        <div>
          <div class="agency-name" id="agencyName">—</div>
          <div class="agency-sub" id="agentName">—</div>
        </div>
      </div>

      <div id="propMap"></div>
    </div>

    <div class="sidebar">
      <div class="card inquiry-card">
        <h2>מעוניינים בנכס?</h2>
        <p class="sub">השאירו פרטים והמתווך יחזור אליכם בהקדם</p>
        <form id="inquiryForm">
          <div class="field"><input type="text" id="inqName" placeholder="שם מלא" required></div>
          <div class="field"><input type="tel" id="inqPhone" placeholder="טלפון" required></div>
          <div class="field"><textarea id="inqMessage" placeholder="הודעה (לא חובה)"></textarea></div>
          <button type="submit" class="btn btn-gold btn-block" id="inquirySubmit">שליחת פנייה</button>
        </form>
        <div id="inquiryFeedback"></div>
      </div>

      <div class="card calc-card">
        <h2>מחשבון משכנתא לנכס זה</h2>
        <div class="calc-field"><label for="calcEquity">הון עצמי (₪)</label><input type="number" id="calcEquity" value="300000"></div>
        <div class="calc-field"><label for="calcRate">ריבית שנתית (%)</label><input type="number" id="calcRate" value="4.8" step="0.1"></div>
        <div class="calc-field"><label for="calcYears">שנות החזר</label><input type="number" id="calcYears" value="25"></div>
        <div class="calc-result">
          <div class="num" id="calcMonthly">—</div>
          <div class="lbl">החזר חודשי משוער</div>
        </div>
        <div class="ltv-warn" id="ltvWarn"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://obookujgolazrwycsiyn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oq0dgmwKy83K7sDO3hoDMA_VpSnR5Fx';
const INQUIRY_FUNCTION_URL = SUPABASE_URL + '/functions/v1/property-inquiry-intake';
const CARD_GRADIENTS = ['linear-gradient(155deg,#8B2332,#1C3A5E)','linear-gradient(155deg,#1C3A5E,#8B2332)','linear-gradient(155deg,#6B1A26,#1C3A5E)'];
const LTV_THRESHOLDS = { single:0.75 }; // מודול 2 §5.5

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.style.display='none', 3500);
}

function priceLabel(p){
  return p.deal_type === 'rent' ? ('₪' + Number(p.price).toLocaleString('he-IL') + '/חוד׳') : ('₪' + Number(p.price).toLocaleString('he-IL'));
}

function getPropertyIdFromUrl(){
  return new URLSearchParams(window.location.search).get('id');
}

/* ---------- Lightweight view logging (module 4 §2.5) — fire and forget, never blocks rendering ---------- */
function logPropertyView(propertyId){
  try{
    if (!window.supabase) return;
    let sessionId = sessionStorage.getItem('shuknadlan_session_id');
    if (!sessionId){
      sessionId = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem('shuknadlan_session_id', sessionId);
    }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.from('property_views').insert({ property_id: propertyId, visitor_session_id: sessionId })
      .then(({ error }) => { if (error) console.warn('view logging failed:', error); });
  } catch(e){ console.warn('view logging failed:', e); }
}

let currentProperty = null;

async function loadProperty(){
  const id = getPropertyIdFromUrl();
  if (!id){
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
    return;
  }
  try{
    if (!window.supabase) throw new Error('supabase-js לא נטען');
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb
      .from('properties')
      .select('*, agencies(name, slug)')
      .eq('id', id)
      .eq('status', 'active')
      .single();
    if (error || !data) throw error || new Error('not found');

    // agent_id -> agency_members_public בשאילתה נפרדת, מאותה סיבה שכבר תועדה
    // ב-index.html: embed חוצה-שם (properties -> agency_members_public) לא מובטח.
    if (data.agent_id){
      const { data: agentRow } = await sb.from('agency_members_public').select('display_name, slug').eq('id', data.agent_id).maybeSingle();
      data.agency_members = agentRow || null;
    }

    currentProperty = data;
    renderProperty(data);
    logPropertyView(id);
  } catch(e){
    console.warn('טעינת נכס נכשלה:', e);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
  }
}

/* גלריית תמונות (2.1): התמונה הראשית היא images[0], והרצועה מתחתיה מחליפה
   אותה. נכס בלי תמונות נשאר עם הגרדיאנט שהיה כאן קודם.                    */
function renderGallery(p){
  const hero = document.getElementById('heroMedia');
  const strip = document.getElementById('galleryStrip');
  strip.innerHTML = '';
  const images = Array.isArray(p.images) ? p.images.filter(Boolean) : [];

  if (!images.length){
    hero.style.background = CARD_GRADIENTS[0];
    return;
  }

  const show = (url)=>{
    hero.style.backgroundImage = `url('${url}')`;
    hero.style.backgroundSize = 'cover';
    hero.style.backgroundPosition = 'center';
  };
  show(images[0]);

  if (images.length > 1){
    const count = document.createElement('span');
    count.className = 'img-count';
    count.textContent = `1 / ${images.length}`;
    hero.appendChild(count);

    images.forEach((url, i)=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = i === 0 ? 'active' : '';
      btn.setAttribute('aria-label', `תמונה ${i+1} מתוך ${images.length}`);
      btn.innerHTML = `<img src="${url}" alt="" loading="lazy">`;
      btn.addEventListener('click', ()=>{
        show(url);
        count.textContent = `${i+1} / ${images.length}`;
        strip.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      });
      strip.appendChild(btn);
    });
  }
}

function renderProperty(p){
  document.title = p.title + ' | שוק נדל״ן';
  renderGallery(p);
  if (p.is_promoted){
    const ribbon = document.createElement('span');
    ribbon.className = 'promo-ribbon';
    ribbon.textContent = 'מקודם';
    document.getElementById('heroMedia').appendChild(ribbon);
  }
  document.getElementById('propPrice').textContent = priceLabel(p);
  document.getElementById('propDealPill').textContent = p.deal_type === 'rent' ? 'להשכרה' : 'למכירה';
  document.getElementById('propTitle').textContent = p.title;
  document.getElementById('propRooms').textContent = (p.rooms || '—') + ' חדרים';
  document.getElementById('propType').textContent = p.property_type;
  document.getElementById('propCity').textContent = p.city;
  document.getElementById('agencyName').textContent = p.agencies?.name || 'משרד תיווך';
  document.getElementById('agencyAvatar').textContent = (p.agencies?.name || '?')[0];
  document.getElementById('agentName').textContent = p.agency_members?.display_name ? 'סוכן: ' + p.agency_members.display_name : '';
  document.getElementById('agencyStrip').addEventListener('click', ()=>{
    if (p.agencies?.slug) window.location.href = 'agency.html?slug=' + p.agencies.slug;
  });

  if (p.lat && p.lng && window.L){
    try{
      const map = L.map('propMap', { scrollWheelZoom:false }).setView([p.lat, p.lng], 15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
      }).addTo(map);
      L.marker([p.lat, p.lng]).addTo(map);
    } catch(e){ console.warn('מפת הנכס לא נטענה:', e); }
  } else {
    document.getElementById('propMap').style.display = 'none';
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('propertyContent').style.display = 'block';

  updateCalculator();
}

/* ---------- Mortgage calculator, price pre-filled from this property ---------- */
function updateCalculator(){
  if (!currentProperty) return;
  const price = Number(currentProperty.price) || 0;
  const equity = parseFloat(document.getElementById('calcEquity').value) || 0;
  const annualRate = parseFloat(document.getElementById('calcRate').value) || 0;
  const years = parseFloat(document.getElementById('calcYears').value) || 1;

  const loan = Math.max(price - equity, 0);
  const monthlyRate = (annualRate/100)/12;
  const n = years*12;
  let monthly = 0;
  if (loan > 0 && monthlyRate > 0){
    monthly = loan * (monthlyRate*Math.pow(1+monthlyRate,n)) / (Math.pow(1+monthlyRate,n)-1);
  }
  document.getElementById('calcMonthly').textContent = monthly ? ('₪' + Math.round(monthly).toLocaleString('he-IL')) : '—';

  const ltv = price > 0 ? loan/price : 0;
  const warn = document.getElementById('ltvWarn');
  warn.textContent = (ltv > LTV_THRESHOLDS.single)
    ? `אחוז המימון הנדרש (${Math.round(ltv*100)}%) חורג מהתקרה המקובלת לדירה יחידה (75%)`
    : '';
}
['calcEquity','calcRate','calcYears'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateCalculator);
});

/* ---------- Inquiry form ---------- */
document.getElementById('inquiryForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if (!currentProperty){ showToast('הנכס עדיין נטען, נסו שוב בעוד רגע'); return; }
  const btn = document.getElementById('inquirySubmit');
  const feedback = document.getElementById('inquiryFeedback');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'שולח…'; feedback.textContent = '';
  try{
    const res = await fetch(INQUIRY_FUNCTION_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({
        property_id: currentProperty.id,
        name: document.getElementById('inqName').value,
        phone: document.getElementById('inqPhone').value,
        message: document.getElementById('inqMessage').value || null,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'שגיאה');
    feedback.style.color = 'var(--teal)';
    feedback.textContent = 'הפנייה נשלחה! המתווך יחזור אליכם בקרוב';
    document.getElementById('inquiryForm').reset();
  } catch(err){
    console.error(err);
    feedback.style.color = 'var(--brick)';
    feedback.textContent = 'שגיאה בשליחה — נסו שוב';
  } finally {
    setTimeout(()=>{ btn.disabled = false; btn.textContent = original; }, 400);
  }
});

loadProperty();
</script>
</body>
</html>
