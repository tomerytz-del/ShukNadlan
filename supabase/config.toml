# ---------------------------------------------------------------------------
# מערכתי — אימות עצמי בתוך הפונקציה (סוד cron, service role, או webhook)
#
# שלוש מהן (‏saved-search-notify, ‏property-marketing-publish,
# ‏classify-property-images) חולקות את supabase/functions/_shared/cron-auth.ts.
# הבדיקה שם היא fail-closed: אם ALERT_CRON_SECRET אינו מוגדר בסביבה,
# הפונקציה מחזירה 503 ולא רצה. הנוסח הקודם, `if (CRON_SECRET && ...)`,
# דילג על הבדיקה בדיוק במקרה הזה — והסוד לא היה מוגדר בפרודקשן, כך ששתי
# הפונקציות ה"מוגנות" ענו 200 לכל קורא.
# ---------------------------------------------------------------------------
[functions.whatsapp-webhook]
verify_jwt = false          # Meta שולחת בלי JWT; האימות הוא בטוקן של הוובהוק

[functions.saved-search-notify]
verify_jwt = false          # ‏pg_cron + x-alert-cron-secret

[functions.property-marketing-publish]
verify_jwt = false          # ‏pg_cron + x-alert-cron-secret / service role / מנהל פלטפורמה

[functions.classify-property-images]
verify_jwt = false          # קריאת cron/backfill; לא מקבלת קלט שמשפיע על מה שנכתב

# ‏verify_jwt=false כאן אינו "פתוח": ה-handler דורש את מפתח ה-service_role
# או את PLATFORM_MAIL_SECRET, כי שליחת מייל בשם הפלטפורמה למי שמבקש היא
# ממסר פתוח. ה-Gateway מושבת דווקא כדי שקוראים פנימיים (pg_net, cron)
# יוכלו לפנות אליה בלי JWT של משתמש/ת.
[functions.platform-mail]
verify_jwt = false          # אימות עצמי: service_role או x-platform-mail-secret

[functions.property-visualize]
verify_jwt = false          # הדמיה לפי דרישת גולש/ת — הזכאות נבדקת ב-DB

