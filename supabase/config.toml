# שהוא כדי לא לשנות התנהגות בפריסה הראשונה, אבל זו נקודה שכדאי לסגור:
# להוסיף בדיקת x-alert-cron-secret כמו ב-saved-search-notify.
[functions.news-ticker-crawler]
