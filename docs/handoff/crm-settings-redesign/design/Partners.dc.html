<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>משרדי שיתוף פעולה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&amp;family=Heebo:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#1F5BF0}a:hover{color:#1846C2}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9DB8FF;outline-offset:2px}
@media (max-width: 640px){[style*="padding: 40px 20px"]{padding-top:20px!important;padding-left:12px!important;padding-right:12px!important}[style*="padding: 24px 28px"]{padding:18px 16px!important}[style*="margin: 0 -20px"]{margin:0 -12px!important}h1{font-size:28px!important}h2{font-size:20px!important}}
</style>
</helmet>
<div dir="rtl" style="min-height: 100%; background: #F4F6FA; font-family: Heebo, system-ui, sans-serif; color: #0E1A33; padding: 40px 20px 0; box-sizing: border-box">
<div style="max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-direction: column; gap: 6px">
<a href="#" style="font-size: 13px; font-weight: 600; color: #5A6478; text-decoration: none">הזדמנויות ›</a>
<h1 style="margin: 0; font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: 36px; line-height: 1.15">משרדי שיתוף פעולה</h1>
<p style="margin: 0; font-size: 15px; color: #5A6478">עם מי מתחלקים בנכסים שפתחת לשיתוף פעולה.</p>
</header>

<section aria-label="מצב השיתוף" style="background: #0E1A33; color: #FFFFFF; border-radius: 20px; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Frank Ruhl Libre', serif; font-size: 44px; font-weight: 700; line-height: 1">{{count}}</span><span style="font-size: 16px; color: #B8C2D9">מתוך {{total}} משרדים</span></div>
<span style="flex: 1 1 280px; font-size: 15px; line-height: 1.5">{{heroText}}</span>
</section>

<section aria-labelledby="modeTitle" style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px">
<h2 id="modeTitle" style="margin: 0; font-family: 'Frank Ruhl Libre', serif; font-size: 22px; font-weight: 700">עם מי לשתף</h2>
<div role="radiogroup" aria-labelledby="modeTitle" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="{{m.style}}">
<span style="{{m.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 3px; text-align: right"><span style="font-size: 15px; font-weight: 700">{{m.label}}</span><span style="font-size: 13px; color: #5A6478; line-height: 1.45">{{m.hint}}</span></span>
</button>
</sc-for>
</div>

<sc-if value="{{custom}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #EEF1F6; padding-top: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div style="position: relative; flex: 1 1 260px">
<label for="oSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">חיפוש משרד</label>
<input id="oSearch" type="search" placeholder="חיפוש משרד" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 42px 0 14px; border-radius: 12px; border: 1px solid #D5DBE6; font-size: 15px; color: #0E1A33">
<span style="position: absolute; right: 14px; top: 13px; color: #5A6478"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
</div>
<button type="button" onClick="{{selectAll}}" style="min-height: 44px; padding: 0 10px; border: 0; background: none; font-size: 14px; font-weight: 700; color: #1F5BF0; cursor: pointer">סימון הכל</button>
<button type="button" onClick="{{clearAll}}" style="min-height: 44px; padding: 0 10px; border: 0; background: none; font-size: 14px; font-weight: 700; color: #5A6478; cursor: pointer">ניקוי</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px">
<sc-for list="{{offices}}" as="o" hint-placeholder-count="14">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}" style="{{o.style}}">
<span style="{{o.avatar}}">{{o.initial}}</span>
<span style="flex: 1; text-align: right; font-size: 15px; font-weight: 600; min-width: 0">{{o.name}}</span>
<span style="{{o.box}}"><sc-if value="{{o.on}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
</button>
</sc-for>
</div>
<button type="button" style="align-self: center; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #D5DBE6; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #0E1A33; cursor: pointer">עוד 18 משרדים</button>
</div>
</sc-if>
</section>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 16px; padding: 14px 18px; font-size: 14px; color: #3A4458; line-height: 1.55">
<span style="color: #1F5BF0; flex: none; margin-top: 2px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span>
<span>השינוי חל על נכסים שתפתח/י לשיתוף מעכשיו. נכס שכבר שותף מתעדכן בלחיצה על "עדכון הפצה" בשורת הנכס, ומשרד שהוסר מאבד אליו גישה.</span>
</div>

<div style="position: sticky; bottom: 0; margin: 0 -20px; padding: 14px 20px; background: rgba(255,255,255,0.96); border-top: 1px solid #E3E7EF; box-shadow: 0 -6px 20px rgba(14,26,51,0.06)">
<div style="max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span style="{{saveTextStyle}}">{{saveText}}</span>
<button type="button" onClick="{{save}}" style="{{saveStyle}}">שמירה</button>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.names = ['א.ב יזמות ושיווק נדל"ן', 'א.ב. נדל"ן', 'אביב נכסים', 'אביה גולדברג - תיווך נדל"ן', 'אדל נכסים - פתרונות נדל"ן', 'אושר נכסים', 'אושרי זכור פתרונות נדל"ן', 'בארי נכסים עפולה', 'דהן נדל"ן', 'הדירות של בן', 'טריו נכסים - פתרונות נדל"ן', 'יעד נדל"ן', 'מגדלים נדל"ן', 'מורן וייס תיווך'];
    this.state = { mode: 'custom', off: [], dirty: false, saved: false };
  }
  renderVals() {
    const s = this.state;
    const total = 32;
    const count = s.mode === 'all' ? total : total - s.off.length;
    const card = (on) => 'display: flex; align-items: flex-start; gap: 10px; min-height: 72px; padding: 12px 14px; border-radius: 14px; cursor: pointer; width: 100%; color: #0E1A33; ' + (on ? 'border: 2px solid #1F5BF0; background: #EAF0FF' : 'border: 1px solid #D5DBE6; background: #FFFFFF');
    const dot = (on) => 'width: 20px; height: 20px; border-radius: 50%; flex: none; box-sizing: border-box; margin-top: 1px; ' + (on ? 'border: 6px solid #1F5BF0; background: #FFFFFF' : 'border: 2px solid #A7B0C2; background: #FFFFFF');
    const mdefs = [
      ['all', 'כל המשרדים במערכת', 'כולל משרדים שיצטרפו בעתיד. מומלץ כדי להגיע להכי הרבה קונים.'],
      ['custom', 'רק משרדים שבחרתי', 'משרד חדש שיצטרף לא יקבל את הנכסים עד שתסמנו אותו.']
    ];
    const modes = mdefs.map(([id, label, hint]) => ({ label, hint, checked: s.mode === id ? 'true' : 'false', style: card(s.mode === id), dot: dot(s.mode === id), pick: () => this.setState({ mode: id, dirty: true }) }));
    const offices = this.names.map((name, i) => {
      const on = !s.off.includes(i);
      return {
        name, on, initial: name.charAt(0), pressed: on ? 'true' : 'false',
        toggle: () => this.setState({ off: on ? s.off.concat(i) : s.off.filter((x) => x !== i), dirty: true }),
        style: 'display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; border-radius: 14px; cursor: pointer; width: 100%; color: #0E1A33; ' + (on ? 'border: 1.5px solid #C9D6F7; background: #FAFBFE' : 'border: 1px solid #E3E7EF; background: #FFFFFF; opacity: 0.7'),
        avatar: 'width: 36px; height: 36px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; ' + (on ? 'background: #1C3A5E; color: #FFFFFF' : 'background: #E3E7EF; color: #5A6478'),
        box: 'width: 24px; height: 24px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-sizing: border-box; ' + (on ? 'background: #1F5BF0' : 'border: 2px solid #A7B0C2; background: #FFFFFF')
      };
    });
    return {
      count, total, modes, offices, custom: s.mode === 'custom',
      heroText: s.mode === 'all' ? 'כל נכס שתפתח/י לשיתוף יגיע לכל משרדי התיווך במערכת, גם לחדשים.' : (count === total ? 'כרגע מסומנים כל המשרדים. משרד חדש שיצטרף לא יסומן אוטומטית.' : 'נכסים שתפתח/י לשיתוף יגיעו רק למשרדים המסומנים.'),
      selectAll: () => this.setState({ off: [], dirty: true }),
      clearAll: () => this.setState({ off: this.names.map((n, i) => i), dirty: true }),
      saveText: s.dirty ? 'יש שינויים שלא נשמרו' : (s.saved ? 'נשמר' : 'הרשימה שמורה'),
      saveTextStyle: s.dirty ? 'font-size: 14px; font-weight: 700; color: #9A3412' : 'font-size: 14px; color: #5A6478',
      saveStyle: 'min-height: 48px; padding: 0 28px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 700; ' + (s.dirty ? 'background: #1F5BF0; color: #FFFFFF; cursor: pointer' : 'background: #E3E7EF; color: #5A6478; cursor: default'),
      save: () => { if (s.dirty) this.setState({ dirty: false, saved: true }); }
    };
  }
}
</script>
</body>
</html>
