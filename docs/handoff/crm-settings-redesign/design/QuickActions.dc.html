<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פעולות מהירות</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&amp;family=Heebo:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#1F5BF0}a:hover{color:#1846C2}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #9DB8FF;outline-offset:2px}
@media (max-width: 640px){[style*="padding: 40px 20px"]{padding-top:20px!important;padding-left:12px!important;padding-right:12px!important}.qa{min-height:44px!important;padding:0 12px!important;font-size:14px!important}.qa-row{flex-wrap:nowrap!important;overflow-x:auto!important}}
</style>
</helmet>
<div dir="rtl" style="min-height: 100%; background: #F4F6FA; font-family: Heebo, system-ui, sans-serif; color: #0E1A33; padding: 40px 20px 48px; box-sizing: border-box">
<div style="max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<section aria-labelledby="waitTitle" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="waitTitle" style="margin: 0; font-size: 18px; font-weight: 700">מחכה לך</h2>
<span style="font-size: 13px; color: #5A6478">מה שהצטבר מאז הכניסה האחרונה</span>
</div>
<div class="qa-row" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{waiting}}" as="w" hint-placeholder-count="4">
<a href="{{w.href}}" style="{{w.style}}"><span style="{{w.numStyle}}">{{w.n}}</span><span style="display: flex; flex-direction: column; gap: 1px; text-align: right"><span style="font-size: 14px; font-weight: 700">{{w.label}}</span><span style="font-size: 12px; color: #5A6478">{{w.hint}}</span></span></a>
</sc-for>
</div>
</section>

<section aria-labelledby="qaTitle" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="qaTitle" style="margin: 0; font-size: 18px; font-weight: 700">פעולות מהירות</h2>
<button type="button" aria-expanded="{{editStr}}" onClick="{{toggleEdit}}" style="min-height: 36px; padding: 0 6px; border: 0; background: none; font-size: 13px; font-weight: 700; color: #1F5BF0; cursor: pointer">{{editLabel}}</button>
</div>
<div class="qa-row" style="display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 2px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="6">
<button type="button" class="qa" style="flex: none; min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #E3E7EF; background: #FFFFFF; color: #0E1A33; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #EAF0FF; color: #1F5BF0; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"></path></svg></span>{{a.label}}</button>
</sc-for>
</div>
<sc-if value="{{edit}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #5A6478">בחר/י עד 6 פעולות. הסדר מתעדכן גם לבד, לפי מה שהכי שימושי לך.</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{pool}}" as="p" hint-placeholder-count="9">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.toggle}}" style="{{p.style}}">{{p.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
</section>

<a href="Wallet.dc.html" style="text-decoration: none; color: #0E1A33; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; background: #FFFFFF; border: 1px solid #E3E7EF; border-radius: 14px; padding: 12px 16px; font-size: 14px">
<span>בארנק <strong>₪61</strong></span><span style="color: #5A6478">·</span><span>לידי קונה/שוכר: <strong>ללא הגבלה במסלול</strong></span><span style="margin-right: auto; font-weight: 700; color: #1F5BF0">טעינה</span>
</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { edit: false, picked: ['sign', 'wa', 'meet', 'cma', 'boost', 'deals'] };
  }
  renderVals() {
    const s = this.state;
    const ICON = {
      sign: 'M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z',
      wa: 'M7.9 20A9 9 0 1 0 4 16.1L2 22Z',
      meet: 'M3 4h18v18H3zM16 2v4M8 2v4M3 10h18M12 14v4M10 16h4',
      cma: 'M3 3v18h18M7 15l4-4 3 3 5-6',
      boost: 'M12 19V5M5 12l7-7 7 7',
      deals: 'M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6',
      call: 'M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 2 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z',
      plan: 'M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3zM9 3v15M15 6v15',
      review: 'M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.8 5.8 21.1l1.4-7L2 9.3l7-.8z'
    };
    const all = [['sign', 'החתמת לקוח'], ['wa', 'שליחת נכס בוואטסאפ'], ['meet', 'קביעת פגישה או סיור'], ['cma', 'דוח CMA לבעלים'], ['boost', 'הקפצת נכס'], ['deals', 'עסקאות באזור'], ['call', 'רישום שיחה'], ['plan', 'מידע תכנוני'], ['review', 'בקשת ביקורת מלקוח']];
    const actions = s.picked.map((id) => ({ label: all.find((a) => a[0] === id)[1], icon: ICON[id] }));
    const full = s.picked.length >= 6;
    const pool = all.map(([id, label]) => {
      const on = s.picked.includes(id);
      return { label, pressed: on ? 'true' : 'false',
        toggle: () => { if (on) this.setState({ picked: s.picked.filter((x) => x !== id) }); else if (!full) this.setState({ picked: s.picked.concat(id) }); },
        style: 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; cursor: pointer; ' + (on ? 'border: 1.5px solid #1F5BF0; background: #EAF0FF; color: #1846C2; font-weight: 700' : (full ? 'border: 1px dashed #D5DBE6; background: #FFFFFF; color: #A7B0C2; font-weight: 500; cursor: not-allowed' : 'border: 1px solid #D5DBE6; background: #FFFFFF; color: #3A4458; font-weight: 600')) };
    });
    const wdefs = [
      ['5', 'לידים חדשים', '1 ליד בעלים דחוף', 'Leads.dc.html', true],
      ['7', 'משימות באיחור', 'ביומן של היום', 'Agenda.dc.html', true],
      ['60', 'התאמות חכמות', 'ל-[N] לקוחות', 'Matches.dc.html', false],
      ['1', 'ליד בחנות', '₪50', 'LeadStore.dc.html', false]
    ];
    const waiting = wdefs.map(([n, label, hint, href, hot]) => ({ n, label, hint, href,
      style: 'text-decoration: none; color: #0E1A33; flex: none; display: inline-flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 16px 8px 12px; border-radius: 16px; background: #FFFFFF; ' + (hot ? 'border: 1.5px solid #F3C9B3' : 'border: 1px solid #E3E7EF'),
      numStyle: 'min-width: 40px; height: 40px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: \x27Frank Ruhl Libre\x27, serif; font-size: 20px; font-weight: 700; ' + (hot ? 'background: #C2410C; color: #FFFFFF' : 'background: #0E1A33; color: #FFFFFF') }));
    return {
      waiting, actions, pool, edit: s.edit, editStr: s.edit ? 'true' : 'false',
      toggleEdit: () => this.setState({ edit: !s.edit }), editLabel: s.edit ? 'סיום' : 'התאמה אישית'
    };
  }
}
</script>
</body>
</html>
