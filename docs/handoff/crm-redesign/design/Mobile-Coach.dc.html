<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>CRM נייד — מאמן AI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&amp;family=Rubik:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5BF0}a:hover{color:#1846C2}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F6FA; font-family: Assistant, sans-serif; color: #0E1A33">
<header style="display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px">
<a href="Main.dc.html" aria-label="חזרה" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E7EF; background: #FFFFFF; color: #0E1A33; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>
<h1 style="flex: 1; margin: 0; font-family: Rubik, sans-serif; font-size: 20px; font-weight: 600">המאמן שלי</h1>
</header>

<sc-if value="{{isMgr}}" hint-placeholder-val="{{ false }}">
<div role="tablist" aria-label="למי המאמן" style="margin: 0 16px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; background: #E3E7EF; border-radius: 12px; padding: 3px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button role="tab" onClick="{{t.pick}}" style="height: 38px; border-radius: 9px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-family: Assistant, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</sc-if>

<div style="padding: 0 16px">
<dc-import name="CoachCard" role="{{coachRole}}" compact="{{ true }}" hint-size="358px,640px"></dc-import>
</div>
<a href="#" style="display: block; margin: 10px 16px 0; text-align: center; font-size: 14px; font-weight: 700; text-decoration: none">עוד צעד אחד והיסטוריית הטיפים ←</a>

<div style="position: absolute; bottom: 0; right: 0; left: 0">
<dc-import name="BottomNav" active="home" hint-size="390px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["agent","team","office"],"default":"agent"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { mine: true }; }
renderVals() {
const role = this.props.role ?? 'agent';
const isMgr = role !== 'agent';
const mine = this.state.mine;
const tab = (label, on, v) => ({ label, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0E1A33' : '#5A6478', pick: () => this.setState({ mine: v }) });
return {
isMgr,
tabs: [tab('אני כסוכן', mine, true), tab(role === 'team' ? 'הצוות שלי' : 'המשרד שלי', !mine, false)],
coachRole: isMgr && !mine ? role : 'agent'
};
}
}
</script>
</body>
</html>
