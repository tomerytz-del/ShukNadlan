<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { scope: 'all' }; }
renderVals() {
const list = [['all','הכל · 6'],['clients','לקוחות'],['props','נכסים'],['leads','לידים'],['deals','הסכמים'],['help','עזרה']];
const s = this.state.scope;
return {
chips: list.map(([id, label]) => ({
label,
bg: s === id ? '#0E1A33' : '#FFFFFF',
fg: s === id ? '#FFFFFF' : '#0E1A33',
border: s === id ? '#0E1A33' : '#D3D9E4',
pick: () => this.setState({ scope: id })
}))
};
}
}
</script>
