<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סוכן | שוק נדל״ן</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700;800&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/quality-badge.js"></script>
<style>
  :root{
    --ink:#1B1F26; --ink-soft:#565C63; --paper:#DEDCD6; --paper-raised:#F4F3F0;
    --line:#C5C3BC; --hair:#E4E2DC; --teal:#1C3A5E; --teal-dark:#122840; --teal-tint:#E0E7ED;
    --gold:#8B2332; --gold-dark:#6B1A26; --gold-tint:#F1DFE1; --brick:#6B1A26;
    --wa:#22C55E; --wa-dark:#16A34A;
    --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --shadow-sm:0 2px 8px rgba(15,52,53,.08);
    --shadow-card:0 10px 30px rgba(0,0,0,.06); --maxw:900px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55}
  h1,h2,.display{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--teal-dark);margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none}
  input,textarea{font-family:inherit;font-size:1rem}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}
  .card{background:var(--paper-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;font-size:.95rem}
  .btn-gold{background:var(--gold);color:#241505}
  .btn-block{width:100%}
  header.site{background:var(--paper-raised);border-bottom:1px solid var(--line);padding:14px 0}
  .header-inner{display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px;min-width:0}
  .logo-img{height:46px;width:46px;display:block;flex:0 0 auto;border-radius:50%}
  .logo-word{
    font-family:'Rubik','Heebo',sans-serif;font-weight:500;color:var(--teal-dark);
    font-size:.82rem;line-height:1.3;letter-spacing:-.012em;min-width:0;text-align:center;
  }
  .logo-word span{color:var(--gold-dark);font-weight:700}
  @media(min-width:900px){
    .logo-img{height:54px;width:54px}
    .logo-word{font-size:.95rem;white-space:nowrap}
  }
  .back-link{font-size:.85rem;font-weight:700;color:var(--teal)}

  #loadingState,#notFoundState{padding:60px 18px;text-align:center;color:var(--ink-soft)}
  #notFoundState{display:none}
  #agentContent{display:none}

  /* ====== ראש הדף ======
     כרטיס אחד לבן שמרכז את כל מה שהגולש/ת צריך/ה כדי להחליט אם לפנות: תמונה,
     שם, תגיות ושני כפתורי יצירת קשר. תמונת הנושא נשארת רצועה נפרדת מאחוריו
     ומוצגת רק כשהסוכן/ת העלה/תה אחת. */
  .profile-cover{height:170px;border-radius:0 0 var(--radius-lg) var(--radius-lg);background-size:cover;background-position:center;border:1px solid var(--line);border-top:none;display:none}
  @media(min-width:760px){.profile-cover{height:230px}}

  .hero-card{
    background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow-card);
    border-radius:18px;padding:20px;margin:26px 0 0;
  }
  /* עם תמונת נושא הכרטיס עולה עליה ומחבר בין השניים במקום לרחף מתחתיה */
  .hero-card.has-cover{margin-top:-46px;position:relative;z-index:1}
  @media(min-width:760px){.hero-card{padding:26px 28px;border-radius:20px}}

  .hero-top{display:flex;align-items:flex-start;gap:16px}
  @media(max-width:520px){.hero-top{gap:13px}}

  /* התמונה עם תג הזמינות בפינה — מסגרת בצבע המותג כדי שהיא תיקרא כדמות
     ולא כתמונה בטופס. ה-min-width נותן לתג רוחב לשבת בו מבלי לפרוץ את
     הכרטיס: התג רחב מהתמונה, וזה העמוד היחיד שבו הוא מופיע. */
  .avatar-wrap{position:relative;flex:0 0 auto;display:flex;justify-content:center;min-width:124px}
  @media(max-width:520px){.avatar-wrap{min-width:100px}}
  .profile-avatar{
    width:104px;height:104px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;
    font-family:'Frank Ruhl Libre',serif;font-size:2.2rem;overflow:hidden;
    border:3px solid #fff;box-shadow:0 0 0 2px var(--teal),0 8px 22px rgba(18,40,64,.2);
  }
  @media(max-width:520px){.profile-avatar{width:78px;height:78px;font-size:1.7rem}}
  .profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  /* תג הזמינות — מוצג רק כשיש טלפון שאפשר באמת להתקשר אליו */
  .avail-tag{
    position:absolute;bottom:-6px;inset-inline-start:50%;transform:translateX(50%);
    display:none;align-items:center;gap:5px;white-space:nowrap;
    background:var(--wa);color:#fff;font-size:.63rem;font-weight:800;
    padding:3px 9px;border-radius:999px;border:2px solid #fff;box-shadow:0 3px 10px rgba(34,197,94,.35);
  }
  @media(max-width:520px){.avail-tag{font-size:.6rem;padding:3px 8px}}
  .avail-tag.is-on{display:inline-flex}
  .avail-tag.is-off{background:var(--teal);box-shadow:0 3px 10px rgba(18,40,64,.28)}
  .avail-tag i{width:6px;height:6px;border-radius:50%;background:#fff;flex:none}

  .hero-text{min-width:0;flex:1 1 auto}
  .profile-name{font-size:1.5rem;line-height:1.2}
  @media(max-width:520px){.profile-name{font-size:1.22rem}}
  .profile-agency{font-size:.85rem;color:var(--ink-soft);margin-top:4px}

  /* תגיות הכישורים — ותק, התמחויות, הסמכות ורישיון. כל תגית מגיעה משדה
     נפרד בפרופיל, ומה שלא מולא פשוט לא מופיע. */
  .pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .pill-row:empty{display:none}
  .pill{
    display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;
    padding:5px 11px;border-radius:999px;line-height:1.45;
    background:var(--teal-tint);color:var(--teal-dark);border:1px solid rgba(28,58,94,.1);
  }
  .pill.pill-gold{background:var(--gold-tint);color:var(--gold-dark);border-color:rgba(139,35,50,.12)}
  .pill svg{width:13px;height:13px;flex:none}

  .profile-bio{font-size:.88rem;color:var(--ink-soft);max-width:62ch;margin:12px 0 0;white-space:pre-wrap}
  .profile-bio:empty{display:none}

  /* תו האיכות יושב בקצה השני של ראש הכרטיס. במסך צר הכיתוב לצדו יורד והתו
     מוקטן, כדי לא לדחוס את השם. */
  .profile-badge{flex:0 0 auto}
  @media(max-width:560px){
    .profile-badge .qb-badge img{width:46px!important;height:46px!important}
    .profile-badge .qb-label{display:none}
  }

  /* דירוג — מוצג רק כשיש ביקורות מפורסמות שגובות אותו. סוכן/ת ללא ביקורות
     לא מקבל/ת "0 כוכבים" אלא פשוט לא מוצג/ת עם דירוג בכלל. */
  .profile-rating{display:none;align-items:center;gap:7px;margin-top:6px;font-size:.85rem}
  .profile-rating .stars{color:var(--gold);letter-spacing:1px;direction:ltr}
  .profile-rating .score{font-weight:700}
  .profile-rating .count{color:var(--ink-soft);font-size:.78rem}

  /* ====== כפתורי יצירת הקשר בראש הכרטיס ====== */
  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
  .hero-actions:empty{display:none}
  /* בלי טלפון נשארת פעולה אחת, והיא לוקחת את כל הרוחב במקום חצי כרטיס ריק */
  .hero-actions.single{grid-template-columns:1fr}
  @media(min-width:760px){
    .hero-actions{grid-template-columns:auto auto;justify-content:start}
    .hero-actions.single{grid-template-columns:auto}
  }
  /* כפתור שאינו וואטסאפ לא צריך לגרור איתו את ההילה הירוקה של .btn-wa */
  .btn-alt{background:linear-gradient(120deg,var(--gold-dark),var(--gold))!important;box-shadow:0 6px 16px rgba(139,35,50,.26)!important}
  .btn-wa,.btn-call{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 20px;border-radius:14px;font-weight:800;font-size:.92rem;
    white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease;
  }
  @media(max-width:420px){.hero-actions .btn-wa,.hero-actions .btn-call{padding-inline:12px;font-size:.86rem;gap:6px}}
  .btn-wa{background:linear-gradient(120deg,var(--wa-dark),var(--wa));color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.28)}
  .btn-wa:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(34,197,94,.34)}
  .btn-wa svg{width:19px;height:19px;fill:#fff;flex:none}
  .btn-call{background:var(--teal-tint);color:var(--teal-dark);border:1px solid rgba(28,58,94,.12)}
  .btn-call:hover{background:#D3DEE8}
  .btn-call svg{width:18px;height:18px;flex:none}

  /* ====== שורת המדדים ======
     שלושה נתונים שנשענים על מה שבאמת קיים במסד: מספר הנכסים הפעילים, אזור
     הפעילות ותו האיכות (או הדירוג, למי שאין לו/ה תו). */
  .stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stats-strip:empty{display:none}
  @media(max-width:520px){.stats-strip{gap:7px}}
  .stat{
    background:#fff;border:1px solid var(--hair);border-radius:14px;
    padding:13px 10px;text-align:center;box-shadow:0 2px 10px rgba(18,40,64,.04);
  }
  .stat .v{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:1.15rem;color:var(--teal-dark);line-height:1.2}
  .stat .v img{width:30px;height:30px;border-radius:50%;display:block;margin:0 auto}
  .stat .k{font-size:.7rem;color:var(--ink-soft);margin-top:4px;line-height:1.35}
  @media(max-width:520px){.stat{padding:11px 6px}.stat .v{font-size:.98rem}.stat .k{font-size:.64rem}}

  /* ====== צ׳יפים לסינון הנכסים ====== */
  .filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .filter-row:empty{display:none}
  .fchip{
    flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:.78rem;font-weight:700;
    background:#fff;color:var(--ink-soft);border:1px solid var(--hair);white-space:nowrap;
    transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .fchip:hover{border-color:var(--teal-tint);color:var(--teal-dark)}
  .fchip[aria-pressed="true"]{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark)}
  .fchip .n{opacity:.65;font-weight:600;margin-inline-start:3px}

  #reviewsSection{display:none}
  .review-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px}
  .review-item .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .review-item .who{font-weight:700;font-size:.85rem}
  .review-item .stars{color:var(--gold);letter-spacing:1px;direction:ltr;font-size:.9rem}
  .review-item .body{font-size:.86rem;color:var(--ink-soft);margin-top:6px;white-space:pre-wrap}
  .review-note{font-size:.72rem;color:var(--ink-soft);margin-top:2px}

  .content-grid{display:grid;grid-template-columns:1fr;gap:20px;padding-bottom:40px}
  @media(min-width:760px){.content-grid{grid-template-columns:1.6fr 1fr;align-items:start}}
  /* ‏min-width של פריט ב-grid הוא auto כברירת מחדל, ולכן שורת הצ׳יפים הגוללת
     הייתה מותחת את העמודה לרוחב התוכן שלה ומגלגלת את כל הדף לצדדים */
  .content-grid>*{min-width:0}
  .section h2{font-size:1.05rem;margin-bottom:12px}
  .prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .prop-card{
    background:#fff;border:1px solid var(--hair);border-radius:16px;overflow:hidden;cursor:pointer;
    box-shadow:0 2px 10px rgba(18,40,64,.05);transition:transform .16s ease,box-shadow .16s ease;
  }
  .prop-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(18,40,64,.12)}
  .prop-card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .prop-card .thumb{height:132px;position:relative;background-size:cover;background-position:center}
  @media(min-width:760px){.prop-card .thumb{height:150px}}
  /* נכס שהתמונות שלו עוד לא הועלו: לוגו המשרד + הודעה שהן בדרך, במקום
     מלבן צבעוני שנקרא כמו תמונה שבורה */
  .thumb-fallback{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;padding:8px;text-align:center;
    background:
      linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.36) 55%,rgba(255,255,255,.56)),
      url('assets/property-placeholder.jpg') center/cover no-repeat,
      linear-gradient(160deg,#F4F3F0 0%,#E0E7ED 100%);
  }
  .thumb-fallback .tf-logo{
    width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:#fff;
    border:1px solid var(--line);object-fit:contain;padding:3px;
    box-shadow:0 4px 14px rgba(18,40,64,.18);
  }
  .thumb-fallback .tf-initial{
    display:flex;align-items:center;justify-content:center;padding:0;border-color:transparent;
    background:linear-gradient(155deg,#8B2332,#1C3A5E 65%);color:#fff;
    font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1rem;line-height:1;
  }
  .thumb-fallback .tf-agency{
    font-size:.68rem;font-weight:700;color:var(--teal-dark);line-height:1.25;
    max-width:100%;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .thumb-fallback .tf-note{font-size:.62rem;color:var(--ink-soft);line-height:1.25}
  /* תגיות צפות מעל התמונה: הסטטוס בפינה אחת, שמירה למועדפים בשנייה. */
  .thumb-badges{position:absolute;top:8px;inset-inline-end:8px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:2}
  .tbadge{
    font-size:.66rem;font-weight:800;padding:4px 9px;border-radius:999px;line-height:1.4;
    background:rgba(255,255,255,.94);color:var(--teal-dark);box-shadow:0 2px 8px rgba(18,40,64,.16);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .tbadge.rent{background:rgba(28,58,94,.94);color:#fff}
  .tbadge.sale{background:rgba(255,255,255,.94);color:var(--teal-dark)}
  .tbadge.excl{background:linear-gradient(120deg,var(--gold-dark),var(--gold));color:#fff}
  .fav-btn{
    position:absolute;top:8px;inset-inline-start:8px;z-index:2;
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(18,40,64,.16);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:transform .14s ease;
  }
  .fav-btn:hover{transform:scale(1.08)}
  .fav-btn svg{width:17px;height:17px;fill:none;stroke:var(--teal-dark);stroke-width:2}
  .fav-btn[aria-pressed="true"] svg{fill:var(--gold);stroke:var(--gold)}

  .prop-card .body{padding:11px 12px 12px}
  .prop-card .price{font-weight:700;color:var(--teal-dark);font-size:1.05rem;letter-spacing:-.3px;line-height:1.25}
  .prop-card .price .per{font-size:.72rem;font-weight:600;color:var(--ink-soft);letter-spacing:0}
  @media(max-width:520px){
    .prop-card .price{font-size:.95rem}
    .prop-card .price .per{font-size:.66rem}
  }
  .prop-card .ptitle{
    font-size:.78rem;font-weight:700;color:var(--ink);margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* מפרט הנכס כשורת אייקונים אחת במקום טקסט מופרד בנקודות */
  .spec-row{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px}
  .spec{display:inline-flex;align-items:center;gap:4px;font-size:.71rem;color:var(--ink-soft);font-weight:600}
  .spec svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .inquiry-card{padding:20px}
  .field{margin-bottom:10px}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px}
  .field textarea{resize:vertical;min-height:70px}
  #inquiryFeedback{font-size:.8rem;margin-top:8px;text-align:center;min-height:1.2em}
  .empty-state{padding:24px;text-align:center;color:var(--ink-soft);font-size:.85rem}

  /* ====== סרגל תחתון דביק (מובייל) ======
     נשאר על המסך לאורך כל הגלילה ברשימת הנכסים, כדי שהדרך לסוכן/ת לא תלויה
     בכמה גללו. בדסקטופ הוא לא קיים — שם הכפתורים בראש הכרטיס וטופס הפנייה
     נראים בו־זמנית ממילא. */
  .sticky-bar{
    position:fixed;inset-inline:0;bottom:0;z-index:220;display:none;align-items:center;gap:9px;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--hair);box-shadow:0 -6px 22px rgba(18,40,64,.12);
  }
  body.has-sticky-bar .sticky-bar{display:flex}
  @media(min-width:760px){body.has-sticky-bar .sticky-bar{display:none}}
  body.has-sticky-bar{padding-bottom:76px}
  @media(min-width:760px){body.has-sticky-bar{padding-bottom:0}}
  .sb-text{min-width:0;flex:1 1 auto;font-size:.74rem;font-weight:700;color:var(--teal-dark);line-height:1.3}
  .sticky-bar .btn-wa{flex:0 0 auto;padding:11px 15px;font-size:.85rem;border-radius:12px;white-space:nowrap}
  .sticky-bar .btn-call{flex:0 0 auto;width:44px;padding:11px 0;border-radius:12px}
  .sticky-bar .btn-call span{display:none}
  /* ‏display:inline-flex של הכפתורים גובר על ‎[hidden]‎ של הדפדפן, ואז כפתור
     שאמור להיות מוסתר מופיע בכל זאת — כאן זה היה הכפתור שגולל לטופס, לצד
     כפתור הוואטסאפ שכבר קיים. */
  .sticky-bar [hidden]{display:none}

  @media(prefers-reduced-motion:reduce){
    .prop-card,.btn-wa,.fav-btn,.fchip{transition:none}
    .prop-card:hover,.btn-wa:hover,.fav-btn:hover{transform:none}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap header-inner">
    <a href="index.html" class="logo" aria-label="שוק הנדל״ן של עפולה והסביבה — לדף הבית">

/* התמונה הראשית של הנכס; בלי תמונות מוצג ממלא מקום עם לוגו המשרד */
function thumbStyle(p){
  const img = p.images && p.images[0];

}

const NO_PHOTOS_NOTE = 'תמונות של הנכס יעלו בקרוב';
const SITE_LOGO = 'assets/logo-shuknadlan.png';

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

/* המשרד של הסוכן/ת נטען יחד עם הפרופיל, ומספק את הלוגו והשם שמופיעים על
   אריח של נכס שהתמונות שלו עוד לא הועלו. */
function thumbFallback(p){
  if (p && p.images && p.images[0]) return '';

  const name = (agency && agency.name) || '';
  const logo = (agency && agency.logo_url) || (name ? '' : SITE_LOGO);

  return `<div class="thumb-fallback">
      ${mark}

}

/* תגיות הכישורים בראש הכרטיס. כל תגית נשענת על שדה שהסוכן/ת מילא/ה ב-CRM —
   מה שלא מולא לא מומצא כאן, וגם לא מוצג. */
function buildPills(agent){
  const pills = [];
  if (agent.years_experience > 0){
    pills.push({ icon:'clock', text: agent.years_experience + '+ שנות ניסיון' });
  }
  (agent.specialties || []).slice(0, 4).forEach(s => {
    if (s && String(s).trim()) pills.push({ icon:'star', text: String(s).trim() });
  });
  if (agent.license_number){
    pills.push({ icon:'id', text: 'רישיון תיווך ' + agent.license_number });
  }
  if (agent.credentials){
    pills.push({ icon:'cap', text: agent.credentials, tone:'gold' });
  }
  document.getElementById('profilePills').innerHTML = pills.map(p =>
    `<span class="pill${p.tone === 'gold' ? ' pill-gold' : ''}">${PILL_ICON[p.icon] || ''}${escapeHtml(p.text)}</span>`
  ).join('');
}

/* תג הזמינות על התמונה. הוא נדלק רק כשיש מספר טלפון — הבטחה שאי אפשר לממש
   גרועה מהיעדר הבטחה — ומנוסח לפי השעה: "זמין לשיחה עכשיו" בשעות שבהן סביר
   להרים טלפון, ו"מגיבים בהודעה" מחוצה להן. */
function renderAvailability(agent){
  if (!agent.phone_e164) return;
  const tag = document.getElementById('availTag');
  const hour = new Date().getHours();
  const open = hour >= 8 && hour < 21;
  document.getElementById('availText').textContent = open ? 'זמין לשיחה עכשיו' : 'מגיבים בהודעה';
  tag.classList.add('is-on');
  if (!open) tag.classList.add('is-off');
}

/* שני כפתורי יצירת הקשר בראש הכרטיס והסרגל התחתון במובייל — אותו זוג פעולות
   בשני המקומות, כי זו אותה החלטה שהגולש/ת מקבל/ת בשני רגעים שונים בגלילה.
   ‏phone_e164 מגיע מהמסד כספרות בלבד בפורמט 972521112222 — בדיוק מה שגם
   wa.me וגם tel: מצפים לו, ולכן אין כאן נרמול בצד הלקוח. */
function renderContactActions(agent){
  document.body.classList.add('has-sticky-bar');
  const first = (agent.display_name || '').split(' ')[0];
  document.getElementById('sbText').textContent =
    first ? `רוצים להתייעץ עם ${first} לגבי נכס?` : 'רוצים להתייעץ לגבי נכס?';

  const phone = agent.phone_e164;
  if (!phone){
    // בלי טלפון נשארת דרך אחת אחת ליצור קשר — טופס הפנייה הישירה
    const formBtn = document.getElementById('sbFormBtn');
    formBtn.hidden = false;
    formBtn.addEventListener('click', focusInquiryForm);
    const actions = document.getElementById('heroActions');
    actions.classList.add('single');
    actions.innerHTML = `<button type="button" class="btn-wa btn-alt" id="heroFormBtn">השארת פרטים לסוכן/ת</button>`;
    document.getElementById('heroFormBtn').addEventListener('click', focusInquiryForm);
    return;
  }

  const text = [
    'היי' + (agent.display_name ? ' ' + agent.display_name : '') + ',',
    'הגעתי לדף שלך בשוק הנדל״ן של עפולה והסביבה ואשמח להתייעץ לגבי נכס.',
    window.location.href,
  ].join('\n');
  const waHref = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
  const telHref = 'tel:+' + phone;
  const waAria = agent.display_name ? 'שליחת הודעת וואטסאפ ל' + agent.display_name : 'שליחת הודעת וואטסאפ לסוכן/ת';
  const waSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.6 14.2c-.2.7-1.2 1.3-1.9 1.4-.5.1-1.2.1-1.9-.1a13 13 0 0 1-5.6-4.6c-.6-.9-1-1.9-1-2.8 0-1 .5-1.7 1-2 .2-.2.4-.3.6-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2 0 .4-.1.5l-.4.5c-.1.2-.3.3-.1.6.5.9 1.1 1.6 2 2.2.3.2.5.2.7 0l.7-.8c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.2.4.4.1.2.1.7-.1 1.4Z"></path></svg>';
  const callSvg = `<svg viewBox="0 0 24 24" ${SVG_STROKE} aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2Z"/></svg>`;

  document.getElementById('heroActions').innerHTML = `
    <a class="btn-wa" href="${escapeHtml(waHref)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(waAria)}">${waSvg} וואטסאפ מהיר</a>
    <a class="btn-call" href="${escapeHtml(telHref)}" aria-label="חיוג ל${escapeHtml(agent.display_name || 'סוכן/ת')}">${callSvg} שיחה ישירה</a>`;

  const sbWa = document.getElementById('sbWaBtn');
  sbWa.href = waHref;
  sbWa.setAttribute('aria-label', waAria);

  sbCall.href = telHref;
  sbCall.hidden = false;
}

function focusInquiryForm(){
  document.querySelector('.inquiry-card').scrollIntoView({ behavior:'smooth', block:'center' });
  setTimeout(()=> document.getElementById('inqName').focus(), 420);
}

/* ראש הפרופיל — התמונות והפרטים שהסוכן/ת מעדכן/ת ב-CRM ("עדכון פרטי הסוכן/ת").
   כשאין תמונת נושא הרצועה לא מוצגת בכלל, וכשאין תמונת סוכן/ת נשארת האות הראשונה. */
function renderProfileHeader(agent){
  const cover = document.getElementById('profileCover');
  if (agent.cover_url){
    cover.style.backgroundImage = `url("${agent.cover_url}")`;
    cover.style.display = 'block';
    document.getElementById('heroCard').classList.add('has-cover');
  }

  const avatar = document.getElementById('profileAvatar');
  if (agent.photo_url){
    const img = document.createElement('img');
    img.src = agent.photo_url;
    img.alt = agent.display_name || '';
    avatar.textContent = '';
    avatar.appendChild(img);
  } else {
    avatar.textContent = (agent.display_name||'?')[0];
  }

  document.getElementById('profileName').textContent = agent.display_name;
  document.getElementById('profileAgency').textContent = agent.agencies?.name || '';
  document.getElementById('profileBio').textContent = agent.bio || 'סוכן/ת נדל״ן פעיל/ה באזור עפולה והעמק.';

  buildPills(agent);
  renderAvailability(agent);
  renderContactActions(agent);

  // תו האיכות מוצג רק למי שאישר/ה את הקוד האתי והתו שלו/ה בתוקף. הבוליאני
  // ‏has_ethics_badge מחושב ב-view עצמו, כדי שהתנאי לא ישוכפל בין הדפים.
  if (agent.has_ethics_badge && window.QualityBadge){
    QualityBadge.mount('profileBadge', { size:'lg', label:true, subject: agent.display_name });
  }
}

/* ====== שורת המדדים ======
   שלושה נתונים בלבד, וכולם נשענים על מה שבאמת יושב במסד: כמה נכסים פעילים
   יש בפועל, איפה הסוכן/ת פועל/ת (מהשדה שהוא/היא מילא/ה, ואם לא — מהעיר
   השכיחה בין הנכסים עצמם) ותו האיכות. אין כאן מספרים מומצאים, ומדד שאין לו
   נתון פשוט לא נכנס לשורה. */
function renderStats(agent, props){
  const items = [];
  const count = props.length;
  if (count){
    items.push({ v: String(count), k: count === 1 ? 'נכס פעיל' : 'נכסים פעילים' });
  }

  const area = agent.service_area || mostCommonCity(props);
  if (area) items.push({ v: area, k: 'אזור התמחות' });

  if (agent.has_ethics_badge){
    items.push({ v: `<img src="assets/badge-ethics.png" alt="" width="384" height="384">`, k: 'עומד בתו האיכות של שוק הנדל״ן', raw:true });
  }

  const strip = document.getElementById('statsStrip');
  // פחות משני מדדים זו לא שורה אלא פריט בודד שנראה כמו טעות
  if (items.length < 2){ strip.innerHTML = ''; return; }
  strip.style.gridTemplateColumns = `repeat(${items.length},1fr)`;
  strip.innerHTML = items.map(i =>
    `<div class="stat"><div class="v">${i.raw ? i.v : escapeHtml(i.v)}</div><div class="k">${escapeHtml(i.k)}</div></div>`
  ).join('');
}

function mostCommonCity(props){
  const tally = {};
  props.forEach(p => { if (p.city) tally[p.city] = (tally[p.city] || 0) + 1; });
  const cities = Object.keys(tally);
  if (!cities.length) return '';
  return cities.sort((a,b) => tally[b] - tally[a])[0];
}

async function loadAgentProfile(){
  const slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug || !window.supabase){
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  try{
    // שם המשרד נטען בשאילתה נפרדת ולא ב-embed: מאז ש-property_shares מחזיקה שני
    // מפתחות זרים ל-agencies, PostgREST מחזיר PGRST201 (HTTP 300) על embed
    // מ-agency_members ל-agencies במקום את השורה.
    let query = sb.from('agency_members_public').select('id, display_name, bio, photo_url, cover_url, license_number, slug, agency_id, has_ethics_badge, phone_e164, years_experience, specialties, credentials, service_area');
    // slug יכול להיות ה-slug הקריא או ה-id הגולמי (fallback), לפי מה שנשלח מ-agency.html
    const isUuid = /^[0-9a-f-]{36}$/i.test(slug);
    query = isUuid ? query.eq('id', slug) : query.eq('slug', slug);
    const { data: agent, error } = await query.single();
    if (error || !agent) throw error || new Error('not found');

    if (agent.agency_id){
      const { data: agency } = await sb.from('agencies').select('name, slug, logo_url').eq('id', agent.agency_id).maybeSingle();
      agent.agencies = agency || null;
    }

    currentAgentProfile = agent;
    document.title = agent.display_name + ' | שוק נדל״ן';
    renderProfileHeader(agent);
    document.getElementById('agentFirstName').textContent = (agent.display_name||'').split(' ')[0] || 'הסוכן';

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('agentContent').style.display = 'block';

    loadAgentProperties(sb, agent);
    loadAgentReviews(sb, agent.id);
  } catch(e){
    console.warn('טעינת פרופיל סוכן נכשלה:', e);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
  }
}

/* ====== נכסים שמורים ======
   שמירה מקומית בלבד (localStorage): אין כאן חשבון משתמש, והלב נועד לסמן
   נכסים בזמן שעוברים על הרשימה. מצב פרטי או אחסון חסום לא אמורים להפיל את
   הדף, ולכן כל גישה עטופה. */
const FAV_KEY = 'shuk_favorites';
function readFavorites(){
  try{
    const raw = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    return Array.isArray(raw) ? raw : [];
  }catch(e){ return []; }
}
function toggleFavorite(id){
  const favs = readFavorites();
  const i = favs.indexOf(id);
  if (i === -1) favs.push(id); else favs.splice(i, 1);
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }catch(e){ /* מצב פרטי/חסום */ }
  return i === -1;
}

/* ====== סינון מהיר ======
   הקטגוריות נגזרות מהנכסים שבאמת קיימים אצל הסוכן/ת — צ׳יפ ריק לא מוצג, כדי
   שלחיצה תמיד תחזיר תוצאות. "מגרשים" יוצא מ-property_type ולא מקטגוריה, כי
   מגרש הוא סוג נכס בתוך שתי הקטגוריות. */
const PROP_FILTERS = [
  { key:'all',         label:'הכל',           match:()=> true },
  { key:'sale',        label:'למכירה',        match:p => p.deal_type === 'sale' },
  { key:'rent',        label:'להשכרה',        match:p => p.deal_type === 'rent' },
  { key:'commercial',  label:'מסחרי',         match:p => p.category === 'commercial' },
  { key:'land',        label:'מגרשים',        match:p => isLand(p) },
  { key:'residential', label:'דירות ובתים',   match:p => p.category === 'residential' && !isLand(p) },
];
function isLand(p){ return /מגרש|קרקע|נחל/.test(p.property_type || ''); }

let allProps = [];
let activeFilter = 'all';

async function loadAgentProperties(sb, agent){
  const el = document.getElementById('agentProps');
  const { data: props } = await sb.from('properties')
    .select('id, title, price, deal_type, rooms, size_sqm, floor, property_type, category, city, features, images')
    .eq('agent_id', agent.id).eq('status', 'active').order('created_at', { ascending:false });

  allProps = props || [];
  renderStats(agent, allProps);

  if (allProps.length === 0){
    el.innerHTML = '<div class="empty-state">אין כרגע נכסים פעילים לסוכן זה.</div>';
    return;
  }
  renderFilterChips();
  renderPropertyCards();
}

function renderFilterChips(){
  const row = document.getElementById('propFilters');
  // צ׳יפ שמחזיר בדיוק את כל הנכסים הוא שכפול של "הכל" ולא סינון, ולכן יורד.
  // אחריו, פחות משלושה צ׳יפים זו שורה שלא מציעה בחירה אמיתית — ואז אין שורה.
  const total = allProps.length;
  const available = PROP_FILTERS
    .map(f => ({ ...f, count: allProps.filter(f.match).length }))
    .filter(f => f.key === 'all' ? true : (f.count > 0 && f.count < total));
  if (available.length < 3){ row.innerHTML = ''; return; }

  row.innerHTML = available.map(f =>
    `<button type="button" class="fchip" data-filter="${f.key}" aria-pressed="${f.key === activeFilter}">${escapeHtml(f.label)}<span class="n">(${f.count})</span></button>`
  ).join('');
  row.querySelectorAll('.fchip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeFilter = chip.dataset.filter;
      row.querySelectorAll('.fchip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
      renderPropertyCards();
    });
  });
}

/* שורת מפרט קצרה מתוך מה שקיים בנכס עצמו: שטח, חדרים, קומה וחניה. שדה ריק
   לא הופך ל-"—" אלא פשוט לא מופיע, כדי שהשורה תישאר קריאה. */
function specRow(p){
  const specs = [];
  if (p.size_sqm) specs.push([SPEC_ICON.area, Number(p.size_sqm).toLocaleString('he-IL') + ' מ״ר']);
  if (p.rooms) specs.push([SPEC_ICON.door, p.rooms + ' חדרים']);
  if (p.floor != null && p.floor !== '') specs.push([SPEC_ICON.floor, 'קומה ' + p.floor]);
  if ((p.features || []).includes('parking')) specs.push([SPEC_ICON.car, 'חניה']);
  if (!specs.length && p.property_type) specs.push(['', p.property_type]);
  return `<div class="spec-row">${specs.map(([icon, text]) =>
    `<span class="spec">${icon}${escapeHtml(text)}</span>`).join('')}</div>`;
}

/* תגיות הסטטוס מעל התמונה: בלעדיות קודמת לסוג העסקה, כי היא הנתון שמבדל
   את הנכס משאר הרשימה. */
function statusBadges(p){
  const badges = [];
  if ((p.features || []).includes('exclusive')) badges.push(['excl', 'בלעדי']);
  badges.push(p.deal_type === 'rent' ? ['rent', 'להשכרה'] : ['sale', 'למכירה']);
  return `<div class="thumb-badges">${badges.map(([cls, text]) =>
    `<span class="tbadge ${cls}">${text}</span>`).join('')}</div>`;
}

function priceBlock(p){
  const value = '₪' + Number(p.price).toLocaleString('he-IL');
  return p.deal_type === 'rent'
    ? `${value} <span class="per">/ חודש</span>`
    : value;
}

function renderPropertyCards(){
  const el = document.getElementById('agentProps');
  const filter = PROP_FILTERS.find(f => f.key === activeFilter) || PROP_FILTERS[0];
  const list = allProps.filter(filter.match);
  const favs = readFavorites();

  if (!list.length){ el.innerHTML = '<div class="empty-state">אין נכסים בקטגוריה הזו.</div>'; return; }

  el.innerHTML = '';
  list.forEach(p=>{
    const card = document.createElement('article');
    card.className = 'prop-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'link');
    const saved = favs.includes(p.id);
    card.innerHTML = `
      <div class="thumb"${thumbStyle(p)}>
        ${thumbFallback(p)}
        ${statusBadges(p)}
        <button type="button" class="fav-btn" aria-pressed="${saved}" aria-label="שמירת הנכס למועדפים">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.5-4.6-7.5-9.6a4.2 4.2 0 0 1 7.5-2.6 4.2 4.2 0 0 1 7.5 2.6c0 5-7.5 9.6-7.5 9.6Z"/></svg>
        </button>
      </div>
      <div class="body">
        <div class="price">${priceBlock(p)}</div>
        <div class="ptitle">${escapeHtml(p.title || p.property_type || '')}</div>
        ${specRow(p)}
      </div>`;

    const open = ()=> window.location.href = 'property.html?id=' + p.id;
    card.addEventListener('click', open);
    card.addEventListener('keydown', e=>{
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
    // הלב יושב בתוך הכרטיס הלחיץ, ולכן חייב לעצור את ההתפשטות — אחרת שמירה
    // הייתה גם מנווטת לעמוד הנכס
    const fav = card.querySelector('.fav-btn');
    fav.addEventListener('click', e=>{
      e.stopPropagation();
      fav.setAttribute('aria-pressed', String(toggleFavorite(p.id)));
    });
    el.appendChild(card);
  });
}

function starRow(rating){
  const n = Math.round(Number(rating) || 0);
  return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
}

/* חוות הדעת והדירוג.
   ‏RLS על reviews חושף ל-anon אך ורק שורות status='published', כך שביקורת
   שממתינה לאישור המשרד או שנדחתה לא תגיע לכאן גם אם נבקש אותה.
   הממוצע מחושב מאותן שורות עצמן ולא מ-bayesian_rating — כדי שהמספר שמוצג
   יהיה בדיוק מה שהביקורות שמתחתיו אומרות. */
async function loadAgentReviews(sb, agentId){
  const listEl = document.getElementById('agentReviews');
  const section = document.getElementById('reviewsSection');
  const { data: reviews, error } = await sb
    .from('reviews')
    .select('rating, text, reviewer_display_name, created_at')
    .eq('agent_id', agentId)
    .eq('status', 'published')
    .order('created_at', { ascending:false });

  if (error || !reviews || reviews.length === 0) return;  // בלי ביקורות — האזור פשוט לא קיים

  const avg = reviews.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / reviews.length;
  const countLabel = reviews.length === 1 ? 'ביקורת אחת' : reviews.length + ' ביקורות';

  document.getElementById('profileStars').textContent = starRow(avg);
  document.getElementById('profileScore').textContent = avg.toFixed(1).replace(/\.0$/, '');
  document.getElementById('profileReviewCount').textContent = '· ' + countLabel;
  document.getElementById('profileRating').style.display = 'flex';

  listEl.innerHTML = '';
  reviews.forEach(r=>{
    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <div class="head">
        <span class="who">${escapeHtml(r.reviewer_display_name || 'לקוח/ה מאומת/ת')}</span>
        <span class="stars" aria-label="${r.rating} מתוך 5">${starRow(r.rating)}</span>
      </div>
      ${r.text ? `<div class="body">${escapeHtml(r.text)}</div>` : ''}`;
    listEl.appendChild(item);
  });
  section.style.display = 'block';
}

document.getElementById('inquiryForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if (!currentAgentProfile){ return; }
  const btn = document.getElementById('inquirySubmit');
  const feedback = document.getElementById('inquiryFeedback');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'שולח…'; feedback.textContent = '';
  try{
    const res = await fetch(INQUIRY_FUNCTION_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization':'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({
        agent_id: currentAgentProfile.id,
        name: document.getElementById('inqName').value,
        phone: document.getElementById('inqPhone').value,
        message: document.getElementById('inqMessage').value || null,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'שגיאה');
    feedback.style.color = 'var(--teal)';
    feedback.textContent = 'הפנייה נשלחה בהצלחה!';
    document.getElementById('inquiryForm').reset();
  } catch(err){
    console.error(err);
    feedback.style.color = 'var(--brick)';
    feedback.textContent = 'שגיאה בשליחה — נסו שוב';
  } finally {
    setTimeout(()=>{ btn.disabled = false; btn.textContent = original; }, 400);
  }
});

loadAgentProfile();
</script>
