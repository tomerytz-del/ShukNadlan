<style>
  :root{
    --ink:#0d1b3d; --ink-soft:#4a5578; --paper:#f4f7fe; --raised:#ffffff;
    --line:#e3e8f4; --blue:#0e2a6b; --blue-tint:#eaf0fb;
    --ok:#1e7a4c; --ok-tint:#e5f5ec; --bad:#b3261e; --bad-tint:#fdecea; --warn-tint:#fff6e0;
    --radius:16px; --shadow:0 2px 10px rgba(18,40,64,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55}
  h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--blue);margin:0;font-size:1.3rem;line-height:1.3}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .shell{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
  .agent{display:flex;gap:12px;align-items:center}
  .agent img{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;background:var(--blue-tint);border:3px solid var(--blue)}
  .agent-name{font-weight:800;font-size:1.05rem}
  .agent-sub{color:var(--ink-soft);font-size:.85rem}
  .when{font-size:1.15rem;font-weight:700;margin:12px 0 2px}
  .where{color:var(--ink-soft)}
  .status{border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;font-size:.95rem}
  .status.ok{background:var(--ok-tint);color:var(--ok)}
  .status.bad{background:var(--bad-tint);color:var(--bad)}
  .status.warn{background:var(--warn-tint);color:#7a5a00}
  .sec-title{font-weight:700;margin:0 0 10px;font-size:1rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 12px;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;text-align:center;min-height:46px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-soft{background:var(--blue-tint);color:var(--blue)}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-bad{background:var(--bad-tint);color:var(--bad)}
  .btn[disabled]{opacity:.55;cursor:default}
  .full{grid-column:1 / -1}
  .note{color:var(--ink-soft);font-size:.82rem;margin:10px 0 0}
  .state{text-align:center;color:var(--ink-soft)}
  .foot{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:18px}
  .foot a{color:inherit}
</style>
</head>
