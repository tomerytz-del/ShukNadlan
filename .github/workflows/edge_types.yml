name: טיפוסים ב-Edge Functions

# ‏`supabase functions deploy` אינה בודקת טיפוסים - היא מאגדת ופורסת. שדה
# ש-`select` לא טען או `null` שלא נבדק עוברים עד הפרודקשן, ושם הם נראים
# כמו "הבוט לא ענה".
#
# הבדיקה היא **מחגר**: ‏`scripts/edge_types_baseline.json` רושם כמה שגיאות
# יש היום בכל פונקציה, פונקציה שאינה שם חייבת אפס, ועלייה נכשלת. הפירוט
# וההסבר למה לא "אפס שגיאות" - בראש `scripts/check_edge_types.py`.
#
# ‏`paths` על `pull_request` מותר כאן, בניגוד ל-`function_grants.yml`: זו
# אינה בדיקה נדרשת בהגנת הענף. מי שיהפוך אותה לנדרשת מסיר את הפילטר,
# מאותה סיבה שכתובה שם.

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "scripts/check_edge_types.py"
      - "scripts/edge_types_baseline.json"
      - "scripts/catalog_link_test.ts"
      - "scripts/cost_mail_test.ts"
      - "scripts/prompt_cache_test.ts"
      - "scripts/gabriela_showings_test.ts"
      - "scripts/gabriela_quick_wins_test.ts"
      - "scripts/gabriela_notif_digest_test.ts"
      - "scripts/office_coach_test.ts"
      - "scripts/meta_lead_alert_test.ts"
      - "scripts/lead_dedupe_test.ts"
      - "scripts/paused_launch_test.ts"
      - "scripts/lead_source_test.ts"
      - "scripts/ops_question_test.ts"
      - ".github/workflows/edge_types.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "scripts/check_edge_types.py"
      - "scripts/edge_types_baseline.json"
      - "scripts/catalog_link_test.ts"
      - "scripts/cost_mail_test.ts"
      - "scripts/prompt_cache_test.ts"
      - "scripts/gabriela_showings_test.ts"
      - "scripts/gabriela_quick_wins_test.ts"
      - "scripts/gabriela_notif_digest_test.ts"
      - "scripts/office_coach_test.ts"
      - "scripts/meta_lead_alert_test.ts"
      - "scripts/lead_dedupe_test.ts"
      - "scripts/paused_launch_test.ts"
      - "scripts/lead_source_test.ts"
      - "scripts/ops_question_test.ts"
      - ".github/workflows/edge_types.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: טיפוסים ב-Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ‏**הגרסה נעולה, וזה חלק מהבדיקה.** מספר השגיאות תלוי בגרסת
      # TypeScript שבתוך Deno; גרסה אחרת מזיזה את הרף בלי שורת קוד אחת
      # שהשתנתה. מי שמעדכן כאן מריץ `--update` באותו PR.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: בדיקת טיפוסים מול הרף
        run: python3 scripts/check_edge_types.py

      # ‏קישור לפריט בקטלוג וואטסאפ (‏whatsapp-webhook/catalog-link.ts). הדף
      # מדומה - wa.me אינו זמין מ-CI - בצורה של הדף האמיתי.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: קישור לקטלוג וואטסאפ
        run: node --experimental-strip-types scripts/catalog_link_test.ts

      # ‏קבלות ל-+costs (‏whatsapp-webhook/cost-mail.ts): העברה של הסוכן של
      # תומר ("מקור:", הקבלה ב-HTML), ומה שאינו הוצאה (‏docs/platform-costs.md).
      - name: קליטת קבלות לעלויות
        run: node --experimental-strip-types scripts/cost_mail_test.ts

      # נקודות השבירה של המטמון בשני הבוטים: עד ארבע לבקשה, היסטוריה שנשלחת
      # זהה בין תורים, וגזימה במדרגות (‏docs/platform-costs.md, "המטמון של גבריאלה")
      - name: המטמון של גבריאלה
        run: node --experimental-strip-types scripts/prompt_cache_test.ts

      # סיורי מיניסייט: התאמת שם מתמלול, הקשר תשובה, והמיגרציה שסוגרת
      # כל בקשת תיאום שאינה סופית (בלי עדכון שורות).
      - name: סיורי מיניסייט של גבריאלה
        run: node --experimental-strip-types scripts/gabriela_showings_test.ts

      # כתיב סלחני, קישור CRM, כשל מודל, ומרווח שליחה (בלי קריאה ל-Meta).
      - name: ניצחונות מהירים של גבריאלה
        run: node --experimental-strip-types scripts/gabriela_quick_wins_test.ts

      - name: תקציר התראות של גבריאלה
        run: node --experimental-strip-types scripts/gabriela_notif_digest_test.ts

      # ‏שלושת המאמנים (סוכן/ת, צוות, משרד): מה שיוצא למודל הוא אגרגטים
      # בלבד, ומה שנשמר הוא עד 3 צעדים בלי מקף ארוך, עם כפתור רק מהרשימה
      # הסגורה (‏docs/coaches.md).
      - name: מאמני ה-AI - מה יוצא למודל ומה נשמר
        run: node --experimental-strip-types scripts/office_coach_test.ts

      # התראת וואטסאפ על ליד מטופס מטא: פרמטר תבנית בשורה אחת, נפילה
      # לתבנית ההתראות, ודילוג על ליד ישן או על סוג שאינו ברשימה.
      - name: התראת ליד ממטא
        run: node --experimental-strip-types scripts/meta_lead_alert_test.ts

      # אידמפוטנטיות של טופס מטא וכפילות לפי טלפון. בלי מסד ובלי רשת.
      - name: כפילות ליד ממטא ומהרשתות
        run: node --experimental-strip-types scripts/lead_dedupe_test.ts

      # חבילת ההשקה המושהית: אין סטטוס ACTIVE, HOUSING רק על דיור, תקרת
      # תקציב עם גוגל, והרצה שנייה לא שולחת. בלי קריאה למטא.
      - name: השקה מושהית במטא
        run: node --experimental-strip-types scripts/paused_launch_test.ts

      # שאלה תפעולית לסוכן/ת: service_role בלבד, מסלול חינם, חלון 24 שעות,
      # אידמפוטנטיות, ולחיצה על ops_q שלא מגיעה למודל. בלי Meta.
      - name: שאלה תפעולית בוואטסאפ
        run: node --experimental-strip-types scripts/ops_question_test.ts

      # מקורות הליד שהאתר שולח (‏swipe, ‏photo_request...) מוכרים ב-KNOWN_SOURCES,
      # ומה שאינו מוכר נופל לברירת המחדל של הקורא.
      - name: מקורות ליד
        run: node --experimental-strip-types scripts/lead_source_test.ts
