name: הסוכן התפעולי - הבדיקות שנבדקות בעצמן

# ‏`ops_agent.yml` רץ כל שש שעות מול הפרודקשן ודורש סוד, ולכן הוא אינו
# רץ על PR. זה משאיר פינה: שינוי ב-probe נכנס בלי שאיש הריץ אותו, ומתגלה
# רק בסריקה הבאה - או לא מתגלה כלל, אם ה-probe אמור לשתוק ממילא.
#
# הבדיקה כאן היא פייתון טהור על קלט מסונתז: בלי רשת, בלי מסד ובלי סוד,
# ולכן היא בטוחה להריץ גם על PR מ-fork.

on:
  pull_request:
    paths:
      - "ops_agent/**"
      - "scripts/ops_stand_in_pin_test.py"
      - "scripts/ops_market_gate_test.py"
      - "scripts/ops_market_data_test.py"
      - "scripts/ops_deal_sync_test.py"
      - "scripts/ops_agency_no_city_test.py"
      - "scripts/ops_make_scenario_test.py"
      - "scripts/ops_workflow_health_test.py"
      - "scripts/ops_probe_codes_test.py"
      - "scripts/ops_anon_rpc_test.py"
      - "scripts/ops_live_queue_test.py"
      - "scripts/ops_ads_test.py"
      - "scripts/check_markets.py"
      - "assets/markets.js"
      - ".github/workflows/ops_agent_test.yml"
  push:
    branches: [main]
    paths:
      - "ops_agent/**"
      - "scripts/ops_stand_in_pin_test.py"
      - "scripts/ops_market_gate_test.py"
      - "scripts/ops_market_data_test.py"
      - "scripts/ops_deal_sync_test.py"
      - "scripts/ops_agency_no_city_test.py"
      - "scripts/ops_make_scenario_test.py"
      - "scripts/ops_workflow_health_test.py"
      - "scripts/ops_probe_codes_test.py"
      - "scripts/ops_anon_rpc_test.py"
      - "scripts/ops_live_queue_test.py"
      - "scripts/ops_ads_test.py"
      - "scripts/check_markets.py"
      - "assets/markets.js"
      - ".github/workflows/ops_agent_test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ‏ה-probe אינו נוגע במסד כאן - `_Db` מחזיר שורה קבועה - ולכן אין
      # צורך ב-psycopg2 ואין התקנת תלויות.
      - name: ‏listings_stand_in_pin מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_stand_in_pin_test.py

      # ‏סף השווקים: שוק חי מתחת לסף, שוק סגור שכבר עבר אותו, ונכסים בלי
      # שוק. ה-probe קורא את assets/markets.js דרך המפרש של check_markets.py.
      - name: ‏market_below_gate / market_ready מדווחות בדיוק מתי שצריך
        run: python3 scripts/ops_market_gate_test.py

      # ‏הנתונים של כל שוק: עיר עם מעט עסקאות, עסקאות ישנות, עסקאות בלי
      # פין, שכונות בלי גבול ושמות שכונה שלא הותאמו - על המספרים של 26.9.2026.
      - name: ‏_market_data מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_market_data_test.py

      # ‏מחזור העדכון של העסקאות: הסוכן בדפדפן ואין לו תזמון בשרת, והממצא
      # הוא המקום היחיד שבו מחזור שנעצר נראה (‏docs/settlement-deals.md).
      - name: מחזור עדכון העסקאות
        run: python3 scripts/ops_deal_sync_test.py

      # ‏משרד בלי עיר: חמשת המשרדים מעפולה של 27.9.2026, ושקט כשלכולם יש עיר.
      - name: ‏agency_no_city מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_agency_no_city_test.py

      # ‏תרחיש Make כבוי: חמור כשהערוץ דלוק, שקט כשהוא כבוי, ושורות התור
      # שהשרת סימן - גם בלי טוקן. על המקרה של 27.9.2026.
      - name: ‏_make_scenarios מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_make_scenario_test.py

      # ‏בריאות ה-workflows: כישלון שתוקן אינו "נכשל", ו-workflow חודשי
      # אינו "שותק" שלושה ימים אחרי הרצה. על המקרה של 27.9.2026.
      - name: ‏workflow_failing / workflow_silent מדווחות בדיוק מתי שצריך
        run: python3 scripts/ops_workflow_health_test.py

      # ‏כל קוד ש-probe מייצרת מכוסה ב-PROBE_CODES (אחרת אינו נסגר לעולם),
      # ונושא עברי אינו מאבד את המפתח. על שני הממצאים של 28.9.2026.
      - name: ‏כל ממצא נסגר, ולכל ממצא מפתח משלו
        run: python3 scripts/ops_probe_codes_test.py

      # ‏פונקציות פומביות מוצהרות (PUBLIC_RPC): משתיקות רק קריאה, וכל שם קיים.
      - name: ‏anon_secdef מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_anon_rpc_test.py

      # ‏חיבור קר אינו "תגובה איטית", ושורת תור שיש לה ממצא משלה אינה נספרת
      # פעמיים. על שני הממצאים של 28.9.2026.
      - name: ‏slow_ttfb / queue_blocked מודדות את מה שהן טוענות
        run: python3 scripts/ops_live_queue_test.py

      # ‏קונסולת השיווק (probes/ads.py): טוקן פג נמדד על הקריאה האחרונה,
      # וקמפיין תנועה שמעולם לא הביא לידים אינו "קמפיין בלי לידים".
      - name: ‏ads_* מדווחות בדיוק מתי שצריך, ונסגרות
        run: python3 scripts/ops_ads_test.py
