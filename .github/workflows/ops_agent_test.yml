name: הסוכן התפעולי - הבדיקות שנבדקות בעצמן

# ‏`ops_agent.yml` רץ כל שש שעות מול הפרודקשן ודורש סוד, ולכן הוא אינו
# רץ על PR. זה משאיר פינה: שינוי ב-probe נכנס בלי שאיש הריץ אותו, ומתגלה
# רק בסריקה הבאה - או לא מתגלה כלל, אם ה-probe אמור לשתוק ממילא.
#
# הבדיקה כאן היא פייתון טהור על קלט מסונתז: בלי רשת, בלי מסד ובלי סוד,
# ולכן היא בטוחה להריץ גם על PR מ-fork.

on:
  pull_request:
    paths:
      - "ops_agent/**"
      - "scripts/ops_stand_in_pin_test.py"
      - "scripts/ops_market_gate_test.py"
      - "scripts/ops_market_data_test.py"
      - "scripts/check_markets.py"
      - "assets/markets.js"
      - ".github/workflows/ops_agent_test.yml"
  push:
    branches: [main]
    paths:
      - "ops_agent/**"
      - "scripts/ops_stand_in_pin_test.py"
      - "scripts/ops_market_gate_test.py"
      - "scripts/ops_market_data_test.py"
      - "scripts/check_markets.py"
      - "assets/markets.js"
      - ".github/workflows/ops_agent_test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ‏ה-probe אינו נוגע במסד כאן - `_Db` מחזיר שורה קבועה - ולכן אין
      # צורך ב-psycopg2 ואין התקנת תלויות.
      - name: ‏listings_stand_in_pin מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_stand_in_pin_test.py

      # ‏סף השווקים: שוק חי מתחת לסף, שוק סגור שכבר עבר אותו, ונכסים בלי
      # שוק. ה-probe קורא את assets/markets.js דרך המפרש של check_markets.py.
      - name: ‏market_below_gate / market_ready מדווחות בדיוק מתי שצריך
        run: python3 scripts/ops_market_gate_test.py

      # ‏הנתונים של כל שוק: עיר עם מעט עסקאות, עסקאות ישנות, עסקאות בלי
      # פין, שכונות בלי גבול ושמות שכונה שלא הותאמו - על המספרים של 26.9.2026.
      - name: ‏_market_data מדווחת בדיוק מתי שצריך
        run: python3 scripts/ops_market_data_test.py
