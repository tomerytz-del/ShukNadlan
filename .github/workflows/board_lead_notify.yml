name: התראת מודעת לוח

# מודעת מדלן/יד2: בלי טלפון בגוף, עם action_url. date_known בלי חותמת
# אינו נשאר רק באתר. פייסבוק נשאר עם משפט התגובה בפוסט.

on:
  pull_request:
    paths:
      - "supabase/migrations/20271115120000_board_lead_notify_button.sql"
      - "scripts/board_lead_notify_test.py"
      - "docs/scraped-leads.md"
      - ".github/workflows/board_lead_notify.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271115120000_board_lead_notify_button.sql"
      - "scripts/board_lead_notify_test.py"
      - "docs/scraped-leads.md"
      - ".github/workflows/board_lead_notify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Postgres מקומי
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          cluster="$(sudo pg_lsclusters --no-header | awk 'NR==1 {print $1, $2}')"
          sudo pg_ctlcluster $cluster start || true
          sudo -u postgres createuser --superuser "$USER" || true

      - name: בדיקת התראת מודעת לוח
        run: python3 scripts/board_lead_notify_test.py
