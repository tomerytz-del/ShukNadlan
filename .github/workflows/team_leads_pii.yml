name: בלי טלפונים למנהל/ת צוות

# ‏team_leads() מוסרת לידים למנהל/ת צוות, ובלי טלפון ובלי ההודעה החופשית -
# החלטה של תומר (docs/team-dashboard.md). עמודה שנוספת לה היא דליפה שקטה:
# המיגרציה עוברת והדאשבורד עובד. הבדיקה קוראת קבצים בלבד.

on:
  pull_request:
    paths:
      - "supabase/migrations/*.sql"
      - "scripts/check_team_leads_pii.py"
      - ".github/workflows/team_leads_pii.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*.sql"
      - "scripts/check_team_leads_pii.py"
      - ".github/workflows/team_leads_pii.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: בדיקת team_leads
        run: python3 scripts/check_team_leads_pii.py
