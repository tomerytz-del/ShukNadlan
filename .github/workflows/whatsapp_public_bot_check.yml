name: וואטסאפ — התנועה הציבורית, פעם בחודש

# עד 10.11.2026 שני הבוטים חלקו מספר אחד, והבדיקה הזו ענתה על "האם הגיע
# הזמן למספר שני" - ופתחה Issue כשהסף נחצה (1,000 הודעות בשבוע, או תקלה
# חוצת-ענפים). המספר השני קיים (docs/whatsapp-public-bot.md, "שני מספרים"),
# ולכן ההחלטה שהסף שירת כבר התקבלה: הבדיקה נשארת כסיכום חודשי של התנועה
# הציבורית, בלי סף ובלי Issue.
#
# "תקלה חוצת-ענפים" (תשובה בלי agent_id למספר של סוכן/ת) הוסרה: מאז הפיצול
# סוכן/ת שכותב/ת למספר הציבורי מקבל/ת את הבוט הציבורי בכוונה, ואין ביומן
# את המספר שההודעה הגיעה אליו - בלעדיו המדד מודד דבר אחר ממה שהכותרת
# שלו טוענת (CLAUDE.md, "מדידה: לבדוק את היחידה לפני שמכווננים את הסף").
#
# קריאה בלבד. select אחד, אפס כתיבה — גם לא DDL (זה כלל ב-CLAUDE.md).

on:
  schedule:
    # ה-1 בכל חודש ב-06:00 UTC ‏(09:00 בקיץ, 08:00 בחורף)
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ספירת התנועה הציבורית
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::הסוד SUPABASE_DB_URL ריק או לא מוגדר. זהו אותו סוד שמשמש את supabase_migrations.yml. פירוט: docs/supabase-migrations.md"
            exit 1
          fi

          # ‏agent_id is null בהודעה נכנסת = הודעה ממי שאינו סוכן/ת. בענף של
          # הסוכנים העמודה מתמלאת מיד אחרי הזיהוי, ולכן ההפרדה נקייה.
          # הספירה תקפה גם כשהבוט כבוי: אז היא מודדת ביקוש ולא עומס.
          ROW=$(psql "$SUPABASE_DB_URL" -X -t -A -F '|' -v ON_ERROR_STOP=1 -c "
            select count(*) filter (where created_at > now() - interval '7 days'),
                   count(*) filter (where created_at > now() - interval '30 days'),
                   count(distinct wa_phone)
                     filter (where created_at > now() - interval '30 days')
              from public.whatsapp_messages
             where direction = 'in'
               and agent_id is null;")

          WEEK=$(echo "$ROW" | cut -d'|' -f1)
          MONTH=$(echo "$ROW" | cut -d'|' -f2)
          PEOPLE=$(echo "$ROW" | cut -d'|' -f3)

          {
            echo "### תנועה ציבורית בוואטסאפ"
            echo ""
            echo "| מדד | ערך |"
            echo "|---|---|"
            echo "| הודעות נכנסות בשבוע | $WEEK |"
            echo "| הודעות נכנסות בחודש | $MONTH |"
            echo "| אנשים שונים בחודש | $PEOPLE |"
            echo ""
            echo "מ-10.11.2026 יש מספר שני לבוט הציבורי; הסיכום להקשר בלבד, בלי סף ובלי Issue."
          } >> "$GITHUB_STEP_SUMMARY"
