name: id כפול בדף

# ‏getElementById מחזיר את הראשון בסדר המסמך, בלי שגיאה. שני אלמנטים עם
# ‏id="leadsList" ב-crm.html (קונסולת השיווק לפני "הלידים שלי") שלחו את
# הלידים של כל הסוכנים לפאנל מוסתר - הכותרת והמונים הופיעו והרשימה ריקה.
# הבדיקה קוראת קבצים בלבד, בלי רשת ובלי סודות.

on:
  pull_request:
    paths:
      - "*.html"
      - "scripts/check_duplicate_ids.py"
      - ".github/workflows/duplicate-ids.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/check_duplicate_ids.py"
      - ".github/workflows/duplicate-ids.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: id כפול
        run: python3 scripts/check_duplicate_ids.py
