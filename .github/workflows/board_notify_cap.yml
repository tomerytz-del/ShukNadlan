name: תקרת דחיפה לפי מקור

# מדלן ויד2 לא חולקים תקרת התראות יומית. חמש מודעות של מקור אחד
# לא משאירות את המקור השני רק באתר, והשורה השישית של אותו מקור כן.

on:
  pull_request:
    paths:
      - "supabase/migrations/20271130150000_board_source_notify_caps.sql"
      - "supabase/migrations/20271121160000_board_cross_source_duplicate.sql"
      - "supabase/functions/listing-inventory-intake/index.ts"
      - "scripts/board_notify_cap_test.py"
      - ".github/workflows/board_notify_cap.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271130150000_board_source_notify_caps.sql"
      - "supabase/migrations/20271121160000_board_cross_source_duplicate.sql"
      - "supabase/functions/listing-inventory-intake/index.ts"
      - "scripts/board_notify_cap_test.py"
      - ".github/workflows/board_notify_cap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Postgres מקומי
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          cluster="$(sudo pg_lsclusters --no-header | awk 'NR==1 {print $1, $2}')"
          sudo pg_ctlcluster $cluster start || true
          sudo -u postgres createuser --superuser "$USER" || true

      - name: בדיקת התקרה לפי מקור
        run: python3 scripts/board_notify_cap_test.py
