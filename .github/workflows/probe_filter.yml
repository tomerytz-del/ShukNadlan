name: אבחון סינון מילות המפתח

# ‏Workflow זמני לאבחון בלבד — לא כותב כלום, רק קורא פידים ומדפיס למה כל
# פריט עבר או נפסל. סביבת הפיתוח של Claude חסומה ל-news.google.com ו-runner
# של Actions לא, ולכן זה המקום היחיד שאפשר למדוד בו במקום לנחש.
#
# למחוק אחרי שהסינון כוונן.
on:
  push:
    branches:
      - claude/new-session-84a62f
    paths:
      - scripts/probe_filter.py
      - .github/workflows/probe_filter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: אבחון הסינון
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/probe_filter.py --scope afula \
          --feed 'https://news.google.com/rss/search?q=%D7%A2%D7%A4%D7%95%D7%9C%D7%94%20%28%D7%A0%D7%93%D7%9C%22%D7%9F%20OR%20%D7%93%D7%99%D7%95%D7%A8%20OR%20%D7%93%D7%99%D7%A8%D7%95%D7%AA%20OR%20%D7%A9%D7%9B%D7%95%D7%A0%D7%94%20OR%20%D7%94%D7%AA%D7%97%D7%93%D7%A9%D7%95%D7%AA%20OR%20%D7%AA%D7%91%22%D7%A2%29%20when%3A14d&hl=iw&gl=IL&ceid=IL:he' \
          --feed 'https://news.google.com/rss/search?q=%22%D7%A0%D7%93%D7%9C%22%D7%9F%20%D7%91%D7%A2%D7%A4%D7%95%D7%9C%D7%94%22%20OR%20%22%D7%93%D7%99%D7%A8%D7%95%D7%AA%20%D7%91%D7%A2%D7%A4%D7%95%D7%9C%D7%94%22%20OR%20%22%D7%9E%D7%97%D7%99%D7%A8%D7%99%20%D7%94%D7%93%D7%99%D7%A8%D7%95%D7%AA%20%D7%91%D7%A2%D7%A4%D7%95%D7%9C%D7%94%22%20OR%20%22%D7%94%D7%AA%D7%97%D7%93%D7%A9%D7%95%D7%AA%20%D7%A2%D7%99%D7%A8%D7%95%D7%A0%D7%99%D7%AA%20%D7%91%D7%A2%D7%A4%D7%95%D7%9C%D7%94%22%20when%3A30d&hl=iw&gl=IL&ceid=IL:he' \
          --feed 'https://news.google.com/rss/search?q=intitle%3A%D7%A2%D7%A4%D7%95%D7%9C%D7%94%20%28%D7%93%D7%99%D7%A8%D7%95%D7%AA%20OR%20%22%D7%A0%D7%93%D7%9C%22%D7%9F%22%20OR%20%D7%93%D7%99%D7%95%D7%A8%20OR%20%D7%AA%D7%91%22%D7%A2%29%20when%3A30d&hl=iw&gl=IL&ceid=IL:he' \
          --feed 'https://news.google.com/rss/search?q=%28site%3Aglobes.co.il%20OR%20site%3Acalcalist.co.il%20OR%20site%3Athemarker.com%20OR%20site%3Aynet.co.il%20OR%20site%3Abizportal.co.il%20OR%20site%3Amadlan.co.il%29%20%D7%A2%D7%A4%D7%95%D7%9C%D7%94%20when%3A30d&hl=iw&gl=IL&ceid=IL:he'

