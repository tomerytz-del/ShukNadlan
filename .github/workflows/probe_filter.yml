name: אבחון סינון מילות המפתח

# ‏Workflow זמני לאבחון בלבד — לא כותב כלום, רק קורא פידים ומדפיס למה כל
# פריט עבר או נפסל. סביבת הפיתוח של Claude חסומה ל-news.google.com ו-runner
# של Actions לא, ולכן זה המקום היחיד שאפשר למדוד בו במקום לנחש.
#
# למחוק אחרי שהסינון כוונן.
on:
  push:
    branches:
      - claude/new-session-84a62f
    paths:
      - scripts/probe_filter.py
      - .github/workflows/probe_filter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: אבחון הסינון
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/probe_filter.py --scope afula
