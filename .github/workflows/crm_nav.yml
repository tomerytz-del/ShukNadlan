name: כל קטגוריה ב-CRM נגישה מהניווט

# ‏מסך שאי אפשר להגיע אליו הוא מסך שלא קיים, וזה כשל שקט לחלוטין: הדף
# נטען, האקורדיון תקין, אין שגיאה בקונסול, ומי שיודע/ת איפה הקוד תמיד
# "מוצא/ת" אותו. מה שאין הוא הדרך להגיע.
#
# זה קרה: מסך "ייבוא עסקאות רשמיות" נבנה, נפרס, ועבד — ולא היה רשום
# ב-NAV_GROUPS. מנהל/ת הפלטפורמה חיפש/ה אותו ולא מצא/ה.
#
# הבדיקה קוראת קבצים בלבד: בלי רשת ובלי סודות.

on:
  pull_request:
    paths:
      - "crm.html"
      - "assets/crm.js"
      - "scripts/check_crm_nav.py"
      - ".github/workflows/crm_nav.yml"
  push:
    branches: [main]
    paths:
      - "crm.html"
      - "assets/crm.js"
      - "scripts/check_crm_nav.py"
      - ".github/workflows/crm_nav.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: בדיקת ניווט
        run: python3 scripts/check_crm_nav.py
