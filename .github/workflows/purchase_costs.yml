name: עלויות רכישה - מדרגות מס במקום אחד

# מחשבון הרכישה בדף הבית ובדף הנכס מחשבים "כמה מזומן צריך" מאותו קובץ
# (assets/purchase-costs.js). הבדיקה מחזיקה את החישוב מול ערכים שחושבו ביד, ואוסרת
# עותק של מדרגות המס בקובץ אחר: מחשבון שני עם עותק משלו נשאר עם מדרגות ישנות בשקט.

on:
  pull_request:
    paths:
      - "assets/purchase-costs.js"
      - "assets/home.js"
      - "assets/property.js"
      - "index.html"
      - "property.html"
      - "scripts/purchase_costs_test.cjs"
      - ".github/workflows/purchase_costs.yml"
  push:
    branches: [main]
    paths:
      - "assets/purchase-costs.js"
      - "assets/home.js"
      - "assets/property.js"
      - "index.html"
      - "property.html"
      - "scripts/purchase_costs_test.cjs"
      - ".github/workflows/purchase_costs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: מדרגות מס הרכישה והחישוב
        run: node scripts/purchase_costs_test.cjs
