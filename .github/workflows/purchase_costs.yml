name: עלויות רכישה - מדרגות מס במקום אחד

# מחשבון הרכישה בדף הבית ובדף הנכס מחשבים "כמה מזומן צריך" מאותו קובץ
# (assets/purchase-costs.js). הבדיקה מחזיקה את החישוב מול ערכים שחושבו ביד, ואוסרת
# עותק של מדרגות המס בקובץ אחר: מחשבון שני עם עותק משלו נשאר עם מדרגות ישנות בשקט.

# בלי paths בכוונה: הבדיקה אוסרת עותק של המדרגות בכל קובץ, ו-PR שמוסיף עותק כזה בקובץ חדש
# (פונקציית Edge, דף) לא נוגע באף אחד מקובצי המחשבונים. כמו בדיקות המיגרציות - רצה על כל PR,
# וזולה (בלי התקנה).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: מדרגות מס הרכישה והחישוב
        run: node scripts/purchase_costs_test.cjs
