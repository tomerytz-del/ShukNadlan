name: הרשאות פונקציות במיגרציות

# ‏Supabase מגדירה הרשאות ברירת מחדל לסכימה public שמעניקות EXECUTE ל-anon
# על כל פונקציה חדשה, כהרשאה **ישירה** ולא דרך PUBLIC. לכן הכתיבה
# המתבקשת —
#
#     revoke all on function public.f(text) from public;
#     grant execute on function public.f(text) to authenticated, service_role;
#
# נראית כמו צמצום ל-authenticated ואינה: השורה הראשונה אינה נוגעת בהרשאה
# הישירה של anon, והשנייה מוסיפה ואינה מחליפה. ‏PostgREST חושף כל פונקציה
# ב-/rest/v1/rpc/<שם>, ומפתח ה-anon גלוי בקוד המקור של כל דף.
#
# למה זה מצדיק workflow משלו:
#
#   • ‏זה קרה כאן פעמיים. ‏20261112090000 סגרה חמש פונקציות כתיבה, שאחת
#     מהן אפשרה להוריד כל מנוי/ה משלם/ת ל-free בשתי בקשות HTTP בלי
#     התחברות. ואז `city_id_from_address` נכתבה חודש אחרי — עם אותה שורת
#     revoke בדיוק — ונשארה פתוחה.
#   • הטעות שקטה לחלוטין: המיגרציה עוברת, הסכימה נכונה, הפונקציה עובדת.
#     אין מה שיתלונן. הסוכן התפעולי מגלה את זה אחרי הפריסה.
#   • ההצהרה בקוד אומרת דבר אחד וה-proacl אומר אחר, ולכן קריאת הקוד
#     לבדה אינה מגלה את הפער.
#
# הבדיקה קוראת קבצים בלבד: בלי רשת, בלי סודות, ובלי חיבור למסד.

# ‏**אין `paths` על `pull_request`, וזה בכוונה** - מאותה סיבה שב-
# ‏`migration_versions.yml`: בדיקה שנועדה להיות required status check
# חייבת לרוץ בכל PR. בדיקה נדרשת שמדולגת נשארת
# ‏"Expected - waiting for status", וה-PR אינו ניתן למיזוג לנצח.
#
# ‏ב-`push` ל-main הפילטר נשאר, כי שם היא אינה בדיקה נדרשת.
#
# המחיר של הרצה תמידית הוא כ-5 שניות: הסקריפט קורא את קובצי המיגרציה
# ומריץ regex, בלי רשת, בלי סודות ובלי חיבור למסד.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*.sql"
      - "scripts/check_function_grants.py"
      - "scripts/check_table_grants.py"
      - "scripts/check_table_grants_test.py"
      - "scripts/check_leads_masked_invoker.py"
      - "scripts/check_leads_masked_invoker_test.py"
      - "scripts/check_baseline_view_grants.py"
      - "scripts/check_baseline_view_grants_test.py"
      - "schema.sql"
      - ".github/workflows/function_grants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # ‏**הגנת הענף מחפשת את שם ה-job ולא את שם ה-workflow.** בלי השורה
    # הזו הבדיקה מופיעה כ-`check`, וכך קוראים לה רוב ה-workflows בריפו -
    # כלומר אי אפשר לדרוש אותה לבדה.
    name: הרשאות פונקציות
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # הפלט מצביע על הקובץ, על השורה ועל שורת ה-revoke שחסרה.
      - name: בדיקת הרשאות פונקציות
        run: python3 scripts/check_function_grants.py

      # ‏ומאותה משפחה, בכיוון ההפוך: מ-30.10.2026 Supabase אינה מעניקה
      # הרשאות לטבלה חדשה ב-public, ולכן טבלה או view חדשים חייבים grant
      # או revoke מפורש ל-anon, ל-authenticated ול-service_role. באותו job
      # ולא ב-workflow חדש, כדי שהבדיקה הנדרשת הקיימת תכסה גם אותה.
      # הבדיקה העצמית קודם: היום אין אף טבלה אחרי הסף, ולכן ההרצה על
      # הריפו עוברת גם כשה-regex שבור.
      - name: בדיקה עצמית - הרשאות טבלאות
        run: python3 scripts/check_table_grants_test.py

      - name: בדיקת הרשאות טבלאות חדשות
        run: python3 scripts/check_table_grants.py

      # ‏create or replace על leads_masked בלי security_invoker מאפס את
      # האפשרות. ה-view רץ כבעלים, עוקף RLS, ומפתח ה-anon קורא כל ליד.
      # הבדיקה העצמית קודם, מאותה סיבה כמו הרשאות הטבלאות.
      - name: בדיקה עצמית - security_invoker על leads_masked
        run: python3 scripts/check_leads_masked_invoker_test.py

      - name: leads_masked עם security_invoker
        run: python3 scripts/check_leads_masked_invoker.py

      # ‏create or replace על market_city_names בלי security_invoker מאפס
      # את האפשרות, ו-grant של כתיבה על שלושת ה-views (או revoke של
      # agent_share_fit מ-authenticated) מחזיר חור שכבר נסגר בפרודקשן.
      # הבדיקה העצמית קודם, מאותה סיבה כמו leads_masked.
      - name: בדיקה עצמית - סגירת baseline_urgent_fixes
        run: python3 scripts/check_baseline_view_grants_test.py

      - name: סגירת baseline_urgent_fixes נשארת
        run: python3 scripts/check_baseline_view_grants.py
