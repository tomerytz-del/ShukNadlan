name: מנוע מבזקי נדל"ן

# תזמון: כל שעתיים (cron של GitHub פועל לפי UTC), וגם הרצה ידנית מלשונית
# Actions. שעתיים ולא חצי שעה כמו מנוע הלידים — פידי חדשות מתעדכנים בקצב
# איטי בהרבה מקבוצת פייסבוק, והרצה תכופה יותר רק שורפת דקות Actions
# ובקשות ל-Claude על אותן כותרות.
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "הרצת יבש — לנתח בלי לשמור ל-Supabase"
        type: boolean
        default: false
      no_claude:
        description: "בלי Claude — כותרות הפיד כמו שהן (בדיקה בחינם)"
        type: boolean
        default: false
      limit:
        description: "מקסימום ידיעות חדשות בהרצה (ריק = ברירת המחדל)"
        type: string
        default: ""

# הרצה אחת בכל רגע נתון: שתי הרצות חופפות היו מנתחות את אותן ידיעות פעמיים.
concurrency:
  group: news-ticker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      - name: הרצת מנוע המבזקים
        env:
          # אותם סודות של מנוע הלידים — אין צורך בחדשים.
          # ‏ANTHROPIC_API_KEY אופציונלי כאן: בלעדיו המנוע רץ בניסוח היוריסטי.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # אופציונלי — מוגדרים כ-Repository Variables, לא כסודות
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          NEWS_FEED_URLS: ${{ vars.NEWS_FEED_URLS }}
          MAX_NEW_NEWS_PER_RUN: ${{ vars.MAX_NEW_NEWS_PER_RUN }}
          MIN_NEWS_SCORE_TO_PUBLISH: ${{ vars.MIN_NEWS_SCORE_TO_PUBLISH }}
          NEWS_MAX_AGE_DAYS: ${{ vars.NEWS_MAX_AGE_DAYS }}
          # קלטי ההרצה הידנית מועברים כמשתני סביבה ולא משורשרים לתוך הפקודה,
          # כדי שערך זדוני בשדה הטקסט לא יורץ כשל shell
          DRY_RUN: ${{ inputs.dry_run }}
          NO_CLAUDE: ${{ inputs.no_claude }}
          RUN_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          if [ "$NO_CLAUDE" = "true" ]; then ARGS="$ARGS --no-claude"; fi
          if [ -n "$RUN_LIMIT" ]; then ARGS="$ARGS --limit $RUN_LIMIT"; fi
          python news_scraper.py $ARGS
