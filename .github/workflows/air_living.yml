name: כיווני אוויר ושטח סלון

on:
  pull_request:
    paths:
      - "supabase/migrations/20271031140000_air_living.sql"
      - "supabase/functions/_shared/air-living.ts"
      - "assets/crm.js"
      - "assets/property.js"
      - "assets/property-import-core.js"
      - "crm.html"
      - "scripts/air_living_test.ts"
      - "scripts/saved_search_public_test.ts"
      - "supabase/functions/_shared/saved-search-public.ts"
      - "supabase/functions/saved-search-intake/index.ts"
      - "supabase/migrations/20271031160000_photo_air_followups.sql"
      - ".github/workflows/air_living.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271031140000_air_living.sql"
      - "supabase/functions/_shared/air-living.ts"
      - "assets/crm.js"
      - "assets/property.js"
      - "assets/property-import-core.js"
      - "crm.html"
      - "scripts/air_living_test.ts"
      - "scripts/saved_search_public_test.ts"
      - "supabase/functions/_shared/saved-search-public.ts"
      - "supabase/functions/saved-search-intake/index.ts"
      - "supabase/migrations/20271031160000_photo_air_followups.sql"
      - ".github/workflows/air_living.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: כיווני אוויר ושטח סלון
        run: |
          node --experimental-strip-types scripts/air_living_test.ts
          node --experimental-strip-types scripts/saved_search_public_test.ts
