name: דפי הצטרפות - תואמים למחולל

# דפי ההצטרפות (join-*.html) נוצרים מתבנית אחת ב-scripts/build_join_pages.py ונשמרים
# בריפו כדפים סטטיים, כדי שהסורק ומנועי AI יראו את התוכן בלי להריץ JS. עריכה ביד של
# אחד מהם מתפצלת מהשאר בשקט, והפוטר המשותף מתעדכן רק בהרצה מחדש. הבדיקה נכשלת כשהקבצים
# אינם מה שהמחולל מייצר. בלי paths בכוונה: בדיקה נדרשת שמדולגת חוסמת מיזוג, והיא זולה.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: דפי ההצטרפות תואמים למחולל
        run: python3 scripts/build_join_pages.py --check
