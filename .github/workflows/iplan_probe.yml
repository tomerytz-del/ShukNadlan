name: בדיקת XPlan של מינהל התכנון

# לפני שבונים על שירות XPlan (‏ags.iplan.gov.il) - ייעודי קרקע ותוכניות לכל
# הארץ, בלי GovMap: האם הוא עונה ל-GitHub ומה חוזר לנקודה. קריאה בלבד - בלי
# מסד ובלי סודות. ‏scripts/iplan_probe.py, ‏docs/parcels-open.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install "requests>=2.34.2,<3" "pyshp>=2.3,<4"

      - name: בדיקה
        run: python3 scripts/iplan_probe.py --zip

      # ‏Edge Functions רצות ב-Deno, ש-TLS שלו (rustls) אינו מציע צפנים ישנים
      # בכלל. אם זה נכשל כאן, הבוט לא יוכל לשאול את XPlan בזמן אמת.
      - name: Deno מול XPlan
        if: always()
        continue-on-error: true
        run: |
          npm i -g deno@2.5.6 >/dev/null
          deno eval 'const r = await fetch("https://ags.iplan.gov.il/arcgisiplan/rest/services/PlanningPublic/Xplan_6991/MapServer?f=json"); console.log(r.status, (await r.text()).slice(0, 300));'

      # ‏הממסר עצמו (‏netlify/functions/xplan.mjs) מול XPlan, ב-Node - לפני שהוא
      # עולה ל-Netlify. דפנה 4 עפולה: צריך לחזור "מגורים" מהמתאר הכוללנית.
      #
      # ‏**מידע ולא שער**, כמו שלב ה-Deno: XPlan עונה לפעמים אחרי יותר מ-9 השניות
      # של הממסר (‏22.10.2026: עפולה 502 timeout, ראשון לציון 200 באותה ריצה),
      # והבוט כבר לא קורא לממסר (הסקיל planning-page). ריצה אדומה כאן נספרה
      # בסוכן התפעולי כ-workflow_failing חמור על שירות חיצוני איטי. התוצאה
      # בלוג, ושם קוראים אותה.
      - name: הממסר מול XPlan
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module -e '
            process.env.XPLAN_RELAY_TOKEN = "probe";
            const m = await import("./netlify/functions/xplan.mjs");
            for (const [name, q] of [["דפנה 4 עפולה", "lat=32.614662&lng=35.294593"], ["ראשון לציון", "lat=31.9642&lng=34.8044"]]) {
              const r = await m.default(new Request("https://shuknadlan.co.il/.netlify/functions/xplan?" + q, { headers: { "x-relay-token": "probe" } }));
              const body = await r.text();
              console.log(name, r.status, body.length, body.slice(0, 1200));
              if (r.status !== 200) process.exitCode = 1;
            }'
