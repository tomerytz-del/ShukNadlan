name: נרמול עסקאות רשמיות

# ‏deals_engine/normalize.py מכריע את השאלה היחידה שחשובה במנוע העסקאות
# הרשמיות: האם רשומה פגומה נדחית או מנוחשת. עסקה שנכנסת למאגר נושאת
# ‏price_basis='official' — היא המספר שדוח ה-CMA סומך עליו יותר מכל אחר,
# ומספר שנוחש מזהם בדיוק אותו.
#
# הבדיקה קוראת קבצים ומריצה פונקציות טהורות — בלי רשת ובלי סודות.

on:
  pull_request:
    paths:
      - "deals_engine/**"
      - "deals_scraper.py"
      - "scripts/check_deals_normalize.py"
      - ".github/workflows/deals_normalize.yml"
  push:
    branches: [main]
    paths:
      - "deals_engine/**"
      - "deals_scraper.py"
      - "scripts/check_deals_normalize.py"
      - ".github/workflows/deals_normalize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: בדיקת הנרמול
        run: python3 scripts/check_deals_normalize.py
