name: החלת מיגרציות על Postgres

# db push ל-main הוא הריצה הראשונה שרואה את הקובץ על שרת אמיתי
# (supabase_migrations.yml רץ רק ב-push, והיבש הוא ידני). שגיאת התחביר
# ב-normalize(..., 'NFKC') עברה כך עד הפרודקשן.
#
# כאן, ב-PR, הסכימה הציבורית משוחזרת בלי שורות (pg_dump --schema-only)
# על Postgres 17, ורצות רק מיגרציות שה-version שלהן אינו רשום בפרודקשן.
# אין כתיבה לפרודקשן.
#
# אין paths על pull_request בכוונה: אם הבדיקה תהפוך ל-required, דילוג
# משאיר אותה ממתינה וחוסם מיזוג. בלי מיגרציות חדשות מול הפרודקשן היא
# יוצאת מיד אחרי ספירת הגרסאות. ב-push ל-main הפילטר נשאר.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/apply_pending_migrations.py"
      - ".github/workflows/migration_apply.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: החלת מיגרציות על Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: לקוח Postgres ודרייבר
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python3 -m pip install --user 'psycopg[binary]==3.3.6'

      # בלי הסוד. הלקסר, וש-\\! דרך psycopg אינו מריץ כלום.
      - name: בדיקה עצמית
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: python3 scripts/apply_pending_migrations.py --self-test

      # רק קריאה מהפרודקשן. ה-SQL של המיגרציות לא רץ בשלב הזה.
      - name: משיכת סכימה
        id: fetch
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'true' || 'false' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/apply_pending_migrations.py --fetch

      # בלי SUPABASE_DB_URL. גם אם מיגרציה מכילה \!, אין לה את הסוד ב-environ.
      - name: החלה מקומית
        if: steps.fetch.outputs.apply == 'true'
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: python3 scripts/apply_pending_migrations.py --apply-local
