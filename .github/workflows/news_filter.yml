name: סינון המבזקים

# ‏scripts/news_filter_test.py בודק את סינון מילות המפתח של מנוע המבזקים
# (‏news_engine/relevance.py) - החלק שמכווננים בו הכי הרבה. הוא היה קיים
# ועבר, אבל אף workflow לא הריץ אותו, ולכן מילה שנוספה ל-REALTY_TERMS ושברה
# סיווג קיים התגלתה רק כשמבזק שגוי עלה לאתר. בלי רשת ובלי סודות; התלות
# היחידה היא pydantic (‏news_engine/models.py), באותו טווח גרסאות כמו
# ב-requirements.txt.

on:
  pull_request:
    paths:
      - "news_engine/**"
      - "scripts/news_filter_test.py"
      - ".github/workflows/news_filter.yml"
  push:
    branches: [main]
    paths:
      - "news_engine/**"
      - "scripts/news_filter_test.py"
      - ".github/workflows/news_filter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: התקנת pydantic
        run: pip install "pydantic>=2.9,<3"

      - name: בדיקת הסינון
        run: python3 scripts/news_filter_test.py
