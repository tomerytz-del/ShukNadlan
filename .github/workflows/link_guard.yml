name: קישור פגישה לכרטיס בגבריאלה

on:
  pull_request:
    paths:
      - "supabase/functions/whatsapp-webhook/link-guard.ts"
      - "supabase/functions/whatsapp-webhook/agent.ts"
      - "scripts/link_guard_test.ts"
      - ".github/workflows/link_guard.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/whatsapp-webhook/link-guard.ts"
      - "supabase/functions/whatsapp-webhook/agent.ts"
      - "scripts/link_guard_test.ts"
      - ".github/workflows/link_guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: קישור פגישה לכרטיס בגבריאלה
        run: node --experimental-strip-types scripts/link_guard_test.ts
