name: הרצת מיגרציות ל-Supabase

# ‏Netlify מפרסם את ה-HTML תוך שניות מהמיזוג ל-main, אבל שום דבר לא הריץ את
# המיגרציות שנכנסו באותו מיזוג. שלוש פעמים ברצף זה שבר את הפרודקשן באותה
# צורה בדיוק: הקוד ביקש עמודה (‏years_experience, ‏photo_position), ‏PostgREST
# החזיר "עמודה לא קיימת" על השאילתה כולה, והדף נפל — עד שמישהו הריץ ידנית.
#
# ה-workflow הזה סוגר את הפער: כל מיזוג ל-main שנוגע ב-supabase/migrations
# מריץ supabase db push מול המסד, כך שהסכימה והקוד עולים לאוויר יחד.
#
# ‏db push מריץ רק מיגרציות שה-version שלהן (המספר בתחילת שם הקובץ) עדיין לא
# רשום ב-supabase_migrations.schema_migrations, ולכן הוא בטוח להרצה חוזרת:
# ריצה בלי מיגרציות חדשות פשוט לא עושה כלום.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase_migrations.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "הרצת יבש — להציג מה היה רץ בלי לגעת במסד"
        type: boolean
        default: false

# מיזוג נוסף בזמן שהרצה קודמת עוד פועלת ימתין ולא ירוץ במקביל: שתי הרצות
# ‏db push בו-זמנית על אותו מסד הן בדיוק הדרך לקבל מיגרציה חצי-מורצת.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      # שני קבצי מיגרציה עם אותו מספר בתחילת השם הם תקלה שקטה: ‏version הוא
      # מפתח ראשי בטבלת ההיסטוריה, ולכן אחרי שהראשון נרשם השני ייחשב כמורץ
      # ולא ירוץ לעולם. עדיף להיכשל כאן, לפני שהמסד מושפע.
      - name: בדיקת כפילות בגרסאות המיגרציה
        run: |
          DUPES=$(ls supabase/migrations | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::נמצאו קבצי מיגרציה שחולקים אותו version:"
            echo "$DUPES"
            exit 1
          fi
          echo "כל הגרסאות ייחודיות ($(ls supabase/migrations | wc -l) קבצים)."

      - name: התקנת Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ‏SUPABASE_DB_URL ריק הוא מצב שקורה — סוד שלא הוגדר, שהוגדר כ-variable
      # במקום כ-secret, או שנמחק. בלעדיו ה-CLI לא נכשל על "חסר סוד" אלא נופל
      # לברירת המחדל שלו, מסד מקומי, ומחזיר:
      #
      #   failed to connect to `host=/var/run/postgresql user=runner` (ENOENT)
      #
      # ‏16 ההרצות הראשונות של ה-workflow הזה נכשלו כך, ואיש לא זיהה את הסיבה
      # מהשגיאה: היא נראית כמו תקלת רשת ולא כמו סוד חסר. בינתיים כל מיזוג
      # פרסם HTML שנשען על סכימה שלא עודכנה.
      #
      # ההרצה שאחריה (#24) נכשלה אחרת, ובאופן מטעה עוד יותר:
      #
      #   failed to parse connection string: postgresql://postgres.xxx:[REDACTED]@...:5432/postgres
      #
      # המחרוזת בהודעה נראית תקינה לחלוטין — כי התו ששבר אותה בלתי־נראה.
      # מחרוזת שהועתקה דרך עורך טקסט עשירה בעברית נושאת סימן כיווניות
      # (‏U+200F/U+200E) בתחילתה. ‏pgx בודק שהמחרוזת *מתחילה* ב-postgresql://,
      # וכל תו לפני כן — גם ברוחב אפס — מפיל אותה לניתוח כ-DSN ומכשיל אותו.
      # שוחזר מקומית: RLM/LRM/ZWSP מוביל מפילים, ואחרי הסרתם אותה מחרוזת
      # בדיוק נפרסת ומתחברת.
      #
      # לכן השלב הזה מנקה לפני שהוא בודק, ומדווח בדיוק מה הוסר.
      - name: ודא שהסוד SUPABASE_DB_URL מוגדר ותקין
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL_RAW" ]; then
            echo "::error::הסוד SUPABASE_DB_URL ריק או לא מוגדר. הגדירו אותו ב-Settings → Secrets and variables → Actions → New repository secret (לא Variable), עם מחרוזת החיבור מ-Supabase → Project Settings → Database → Connection string → URI, פורט 5432. פירוט: docs/supabase-migrations.md"
            exit 1
          fi

          # ‏LC_ALL=C כדי ש-sed יעבוד ברמת בתים ולא ינסה לפרש UTF-8. הסדר:
          # תווי בקרה, סימני כיווניות ורוחב-אפס, NBSP לרווח, גזירת רווחים,
          # ולבסוף מרכאות עוטפות (הדבקה עם גרשיים גם היא מפילה את הניתוח).
          CLEAN=$(printf '%s' "$SUPABASE_DB_URL_RAW" | LC_ALL=C tr -d '\000-\037\177' | LC_ALL=C sed -E \
            -e 's/\xef\xbb\xbf//g' \
            -e 's/\xe2\x80[\x8b-\x8f]//g' \
            -e 's/\xe2\x80[\xaa-\xae]//g' \
            -e 's/\xe2\x81[\xa6-\xa9]//g' \
            -e 's/\xc2\xa0/ /g' \
            -e 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            -e 's/^"(.*)"$/\1/; s/^'"'"'(.*)'"'"'$/\1/')

          # הערך המנוקה אינו הסוד הרשום, ולכן GitHub לא ימסך אותו מעצמו —
          # הוא מכיל את סיסמת המסד. מיסוך מפורש לפני כל שימוש בו.
          echo "::add-mask::$CLEAN"

          if [ "$CLEAN" != "$SUPABASE_DB_URL_RAW" ]; then
            echo "::warning::הסוד SUPABASE_DB_URL הכיל תווים נסתרים או עוטפים שהוסרו לפני השימוש (${#SUPABASE_DB_URL_RAW} תווים לפני, ${#CLEAN} אחרי). הסיבה הנפוצה: העתקה דרך מסמך בעברית שמוסיף סימן כיווניות. שווה לעדכן את הסוד עצמו."
          fi

          # ההודעה כאן מזהה *מה* הודבק ולא רק שזה שגוי. בלי זה המשתמש/ת מקבל/ת
          # "לא מתחיל ב-postgresql://" ונשאר/ת לנחש בין טוקן, פקודת psql ומחרוזת
          # קטועה — שלושה מצבים שנראים זהים בלוג, כי הערך ממוסך.
          # אף אחת מההודעות אינה חושפת את תוכן הסוד: רק את סוג הדבר שזוהה.
          case "$CLEAN" in
            postgresql://*|postgres://*)
              ;;
            sbp_*)
              echo "::error::ב-SUPABASE_DB_URL הודבק טוקן גישה של Supabase (מתחיל ב-sbp_) ולא מחרוזת חיבור. זהו הערך של הסוד השני, SUPABASE_ACCESS_TOKEN, והוא משמש רק לפריסת Edge Functions. ל-SUPABASE_DB_URL צריך את המחרוזת מ-Supabase → Connect → Direct connection / Session pooler → URI, שמתחילה ב-postgresql:// ומכילה את סיסמת המסד. פירוט: docs/supabase-migrations.md"
              exit 1
              ;;
            psql*)
              echo "::error::ב-SUPABASE_DB_URL הודבקה פקודת psql שלמה ולא המחרוזת עצמה. יש להסיר את המילה psql ואת הגרשיים, ולהשאיר רק את מה שמתחיל ב-postgresql://. פירוט: docs/supabase-migrations.md"
              exit 1
              ;;
            *postgresql://*|*postgres://*)
              echo "::error::ב-SUPABASE_DB_URL יש טקסט *לפני* המחרוזת. ‏pgx דורש שהערך יתחיל ב-postgresql:// בדיוק. יש למחוק כל מה שקודם לו. פירוט: docs/supabase-migrations.md"
              exit 1
              ;;
            *)
              echo "::error::הסוד SUPABASE_DB_URL אינו מחרוזת חיבור: הוא אינו מכיל postgresql:// כלל (אורך: ${#CLEAN} תווים). ודאו שהודבקה המחרוזת המלאה מ-Supabase → Connect → Direct connection / Session pooler → URI — לא הסיסמה לבדה, לא ה-project ref ולא מפתח API. פירוט: docs/supabase-migrations.md"
              exit 1
              ;;
          esac

          case "$CLEAN" in
            *:6543/*)
              echo "::error::הסוד מצביע על פורט 6543 (Transaction pooler). ל-DDL צריך את Session pooler בפורט 5432 — ‏6543 לא תומך ב-advisory locks ומיגרציות ייכשלו בו."
              exit 1
              ;;
          esac

          # ------------------------------------------------------------------
          # תווים בסיסמה שחייבים קידוד אחוזים.
          #
          # זו הייתה התקלה בהרצה #26, והיא לא נראית בלוג: הודעת השגיאה של
          # ה-CLI מסתירה את הסיסמה מאחורי [REDACTED], ולכן התו ששובר את
          # הניתוח מוסתר יחד איתה והמחרוזת נראית תקינה לחלוטין.
          #
          # נבדק מול אותה גרסת CLI, תו-תו: מבין כל תווי ASCII המודפסים,
          # **רק ארבעה** מפילים את הניתוח כשהם בסיסמה — % # ? / — כי כל אחד
          # מהם מסיים את אזור הסיסמה מבחינת מנתח ה-URL (escape, fragment,
          # query, path). כל השאר — כולל רווח, סוגריים, גרשיים, עברית
          # ותווים מוטעמים — עוברים בשלום.
          #
          # רצף %XX תקין מוסר לפני הבדיקה, כדי שסיסמה שכבר מקודדת כראוי לא
          # תיפסל בטעות.
          #
          # אזור הסיסמה: מה-":" הראשון שאחרי "//" עד ה-"@" האחרון. הוא לעולם
          # לא מודפס — רק שמות התווים הבעייתיים.
          # ------------------------------------------------------------------
          AFTER_SCHEME=${CLEAN#*://}
          USERINFO=${AFTER_SCHEME%@*}
          PW=${USERINFO#*:}
          PW_PLAIN=$(printf '%s' "$PW" | LC_ALL=C sed -E 's/%[0-9A-Fa-f]{2}//g')

          BAD=""
          case "$PW_PLAIN" in *"%"*) BAD="$BAD  %  →  %25" ;; esac
          case "$PW_PLAIN" in *"#"*) BAD="$BAD  #  →  %23" ;; esac
          case "$PW_PLAIN" in *"?"*) BAD="$BAD  ?  →  %3F" ;; esac
          case "$PW_PLAIN" in *"/"*) BAD="$BAD  /  →  %2F" ;; esac

          if [ -n "$BAD" ]; then
            echo "::error::סיסמת המסד שבתוך SUPABASE_DB_URL מכילה תווים שמנתח ה-URL אינו מרשה בלי קידוד, ולכן החיבור נכשל ב-'failed to parse connection string'. התווים שנמצאו והקידוד שלהם:$BAD . אפשר להחליף אותם ידנית במחרוזת, או — פשוט יותר — לאפס את סיסמת המסד לאותיות וספרות בלבד ב-Supabase → Project Settings → Database → Reset database password. פירוט: docs/supabase-migrations.md"
            exit 1
          fi

          # השלבים הבאים קוראים את הערך המנוקה מכאן, ולא מהסוד הגולמי.
          {
            echo "SUPABASE_DB_URL<<EOF_DBURL"
            echo "$CLEAN"
            echo "EOF_DBURL"
          } >> "$GITHUB_ENV"

          echo "הסוד תקין (${#CLEAN} תווים, פורט 5432)."

      # מצב ההיסטוריה לפני הנגיעה במסד — כדי שיהיה ברור בלוג מה בדיוק חסר
      # ומה עומד לרוץ, גם כשהשלב הבא נכשל.
      #
      # אין כאן env: SUPABASE_DB_URL בכוונה — הגדרה כזו הייתה דורסת את הערך
      # המנוקה שנכתב ל-GITHUB_ENV ומחזירה את התו הנסתר.
      - name: מצב המיגרציות לפני ההרצה
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      # ------------------------------------------------------------------
      # רשומה במסד בלי קובץ מקומי — החסימה שהפילה את הרצה #37.
      #
      # ‏db push מסרב לרוץ כשההיסטוריה מכילה version שאין לו קובץ בריפו:
      #
      #   Remote migration versions not found in local migrations directory.
      #
      # בפעם הראשונה (2.9) המקור היה 100 רשומות מתקופת ההרצה הידנית, והן
      # נוקו פעם אחת. הפעם המקור היה **חדש**: המיגרציה news_story_key הוחלה
      # על המסד דרך כלי MCP בזמן פיתוח PR ‎#137, וכלי כזה רושם את ההחלה תחת
      # חותמת רגע ההרצה (‏20260902221109) ולא תחת ה-version שבשם הקובץ
      # (‏20260919090000). אותה מיגרציה בדיוק, שני versions — ומיד אחרי
      # המיזוג כל צינור המיגרציות ננעל.
      #
      # זה יקרה שוב: כל כלי שמחיל DDL ישירות רושם חותמת זמן משלו, וכלל
      # "אין להריץ ידנית" הוא כלל אנושי. לכן ה-workflow מיישר בעצמו — אבל
      # רק במקרה שבו היישור בטוח באמת:
      #
      #   • לרשומה יש name, ובריפו יש קובץ בשם *_<name>.sql — כלומר אותה
      #     מיגרציה נמצאת אצלנו תחת version אחר. מוחקים את הרשומה, ‏db push
      #     מריץ את הקובץ המקומי (אידמפוטנטי לפי כלל 2 במסמך, ולכן לא משנה
      #     כלום בסכימה) ורושם אותו תחת ה-version הנכון.
      #
      #   • אין name, או שאין קובץ תואם — אין דרך לדעת מה הרשומה הזאת עשתה.
      #     נכשלים, ומדפיסים את ה-DDL שלה כדי שההחלטה תהיה מבוססת.
      #
      # המחיקה נוגעת **רק בטבלת הרישום**. הסכימה — עמודות, אינדקסים, views,
      # policies — אינה משתנה, לא כאן ולא ב-migration repair.
      #
      # לפני כל מחיקה מודפס ל-summary ה-insert שמחזיר את הרשומה כלשונה,
      # ‏statements כלולים, באותו פורמט של docs/migration-history-archive-*.sql.
      # ------------------------------------------------------------------
      - name: יישור רשומות שאין להן קובץ מקומי
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # ‏psql מותקן על ubuntu-latest. ההתקנה היא רשת ביטחון לשינוי בתמונה.
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

          # ‏-A ללא עימוד, -t בלי כותרות, -F מפריד; שם מיגרציה לא מכיל "|".
          # ‏ON_ERROR_STOP כדי שכשל בשאילתה יפיל את השלב ולא יחזיר פלט ריק
          # שייראה כמו "ההיסטוריה תקינה".
          REMOTE=$(psql "$SUPABASE_DB_URL" -Atq -F '|' -v ON_ERROR_STOP=1 \
            -c "select version, coalesce(name, '') from supabase_migrations.schema_migrations order by version")

          # ‏nullglob כדי שדפוס בלי התאמה יחזיר רשימה ריקה ולא את עצמו.
          shopt -s nullglob

          SAFE=""
          UNKNOWN=""
          while IFS='|' read -r VERSION NAME; do
            if [ -z "$VERSION" ]; then continue; fi

            SELF=(supabase/migrations/"$VERSION"_*.sql)
            if [ ${#SELF[@]} -gt 0 ]; then continue; fi   # יש קובץ תואם — תקין

            TWIN=()
            if [ -n "$NAME" ]; then
              TWIN=(supabase/migrations/*_"$NAME".sql)
            fi

            if [ ${#TWIN[@]} -gt 0 ]; then
              echo "רשומה $VERSION (${NAME}) היא אותה מיגרציה כמו ${TWIN[0]} תחת version אחר."
              SAFE="$SAFE $VERSION"
            else
              UNKNOWN="$UNKNOWN $VERSION"
            fi
          done <<< "$REMOTE"

          shopt -u nullglob

          if [ -n "$UNKNOWN" ]; then
            for VERSION in $UNKNOWN; do
              echo "--- ה-DDL של הרשומה $VERSION ---"
              psql "$SUPABASE_DB_URL" -Atq \
                -c "select coalesce(array_to_string(statements, E'\n'), '(אין statements שמורים)') from supabase_migrations.schema_migrations where version = '$VERSION'"
            done
            echo "::error::בהיסטוריית המסד יש רשומות בלי קובץ מקומי מתאים, ואין דרך אוטומטית לדעת מה הן עשו:$UNKNOWN . ‏db push יסרב לרוץ עד שיוכרע מה הן. ה-DDL של כל אחת מודפס למעלה. אם היא מיגרציה שהוחלה מחוץ לצינור — להוסיף לריפו קובץ אידמפוטנטי מקביל ואז להריץ 'supabase migration repair --status reverted <version>'. פירוט: docs/supabase-migrations.md"
            exit 1
          fi

          if [ -z "$SAFE" ]; then
            echo "כל רשומה בהיסטוריה מותאמת לקובץ בריפו."
            exit 0
          fi

          {
            echo "### רשומות שנמחקו מהיסטוריית המיגרציות"
            echo
            echo "אותה מיגרציה נרשמה תחת version של רגע ההחלה. ה-insert הבא מחזיר אותה:"
            echo
            echo '```sql'
            for VERSION in $SAFE; do
              psql "$SUPABASE_DB_URL" -Atq -v ON_ERROR_STOP=1 -c "
                select format(
                  E'insert into supabase_migrations.schema_migrations (version, name, statements) values (\n  %L,\n  %L,\n  array[%s]\n);',
                  version,
                  name,
                  coalesce((select string_agg(quote_literal(s), E',\n  ') from unnest(statements) s), '')
                )
                from supabase_migrations.schema_migrations where version = '$VERSION'"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::הרצה יבשה — הרשומות$SAFE היו נמחקות מההיסטוריה (הסכימה לא הייתה משתנה)."
            exit 0
          fi

          for VERSION in $SAFE; do
            supabase migration repair --status reverted "$VERSION" --db-url "$SUPABASE_DB_URL"
          done
          echo "::warning::נמחקו מהיסטוריית המיגרציות רשומות שנרשמו תחת version של רגע ההחלה:$SAFE . הסכימה לא השתנתה, והקובץ המקביל בריפו ירוץ עכשיו תחת ה-version שבשמו. המקור הוא החלת מיגרציה מחוץ לצינור (כלי MCP או הדשבורד) — ראו docs/supabase-migrations.md."

      # ‏--include-all אינו קיצור דרך אלא תנאי הכרחי בריפו הזה.
      #
      # ברירת המחדל של db push היא לסרב למיגרציה שה-version שלה ישן מהרשומה
      # האחרונה במסד, ולהיכשל ב:
      #
      #   Found local migration files to be inserted before the last migration
      #   on remote database.
      #
      # ההנחה מאחורי הסירוב היא שמיגרציות נוצרות בזו אחר זו. כאן זה פשוט לא
      # נכון: שני ענפים מקבילים בוחרים כל אחד תאריך משלו, והמיזוג השני מכניס
      # ל-main קובץ עם version ישן יותר מזה שכבר רץ. זה קרה כאן שוב ושוב —
      # אותה דינמיקה שיצרה גם את התנגשויות ה-version הכפול המתועדות במסמך.
      #
      # בלי הדגל, כל מיזוג כזה מפיל את ה-job ועוצר *את כל* המיגרציות שאחריו,
      # כולל חדשות לגמרי. עם הדגל, db push מחיל כל קובץ שאינו רשום בהיסטוריה
      # בלי קשר לסדר.
      #
      # אומת מקומית מול אותה גרסת CLI: הדגל מחיל את הקובץ הישן ואת החדש יחד,
      # רושם את שניהם, ו**אינו** מריץ מחדש מיגרציה שכבר רשומה.
      - name: הרצת המיגרציות
        env:
          # קלט ההרצה הידנית מועבר כמשתנה סביבה ולא משורשר לתוך הפקודה
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--include-all"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          supabase db push --db-url "$SUPABASE_DB_URL" $ARGS

      - name: מצב המיגרציות אחרי ההרצה
        if: success()
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
