name: הרצת מיגרציות ל-Supabase

# ‏Netlify מפרסם את ה-HTML תוך שניות מהמיזוג ל-main, אבל שום דבר לא הריץ את
# המיגרציות שנכנסו באותו מיזוג. שלוש פעמים ברצף זה שבר את הפרודקשן באותה
# צורה בדיוק: הקוד ביקש עמודה (‏years_experience, ‏photo_position), ‏PostgREST
# החזיר "עמודה לא קיימת" על השאילתה כולה, והדף נפל — עד שמישהו הריץ ידנית.
#
# ה-workflow הזה סוגר את הפער: כל מיזוג ל-main שנוגע ב-supabase/migrations
# מריץ supabase db push מול המסד, כך שהסכימה והקוד עולים לאוויר יחד.
#
# ‏db push מריץ רק מיגרציות שה-version שלהן (המספר בתחילת שם הקובץ) עדיין לא
# רשום ב-supabase_migrations.schema_migrations, ולכן הוא בטוח להרצה חוזרת:
# ריצה בלי מיגרציות חדשות פשוט לא עושה כלום.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase_migrations.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "הרצת יבש — להציג מה היה רץ בלי לגעת במסד"
        type: boolean
        default: false

# מיזוג נוסף בזמן שהרצה קודמת עוד פועלת ימתין ולא ירוץ במקביל: שתי הרצות
# ‏db push בו-זמנית על אותו מסד הן בדיוק הדרך לקבל מיגרציה חצי-מורצת.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      # שני קבצי מיגרציה עם אותו מספר בתחילת השם הם תקלה שקטה: ‏version הוא
      # מפתח ראשי בטבלת ההיסטוריה, ולכן אחרי שהראשון נרשם השני ייחשב כמורץ
      # ולא ירוץ לעולם. עדיף להיכשל כאן, לפני שהמסד מושפע.
      - name: בדיקת כפילות בגרסאות המיגרציה
        run: |
          DUPES=$(ls supabase/migrations | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::נמצאו קבצי מיגרציה שחולקים אותו version:"
            echo "$DUPES"
            exit 1
          fi
          echo "כל הגרסאות ייחודיות ($(ls supabase/migrations | wc -l) קבצים)."

      - name: התקנת Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ‏SUPABASE_DB_URL ריק הוא מצב שקורה — סוד שלא הוגדר, שהוגדר כ-variable
      # במקום כ-secret, או שנמחק. בלעדיו ה-CLI לא נכשל על "חסר סוד" אלא נופל
      # לברירת המחדל שלו, מסד מקומי, ומחזיר:
      #
      #   failed to connect to `host=/var/run/postgresql user=runner` (ENOENT)
      #
      # ‏16 ההרצות הראשונות של ה-workflow הזה נכשלו כך, ואיש לא זיהה את הסיבה
      # מהשגיאה: היא נראית כמו תקלת רשת ולא כמו סוד חסר. בינתיים כל מיזוג
      # פרסם HTML שנשען על סכימה שלא עודכנה.
      #
      # ההרצה שאחריה (#24) נכשלה אחרת, ובאופן מטעה עוד יותר:
      #
      #   failed to parse connection string: postgresql://postgres.xxx:[REDACTED]@...:5432/postgres
      #
      # המחרוזת בהודעה נראית תקינה לחלוטין — כי התו ששבר אותה בלתי־נראה.
      # מחרוזת שהועתקה דרך עורך טקסט עשירה בעברית נושאת סימן כיווניות
      # (‏U+200F/U+200E) בתחילתה. ‏pgx בודק שהמחרוזת *מתחילה* ב-postgresql://,
      # וכל תו לפני כן — גם ברוחב אפס — מפיל אותה לניתוח כ-DSN ומכשיל אותו.
      # שוחזר מקומית: RLM/LRM/ZWSP מוביל מפילים, ואחרי הסרתם אותה מחרוזת
      # בדיוק נפרסת ומתחברת.
      #
      # לכן השלב הזה מנקה לפני שהוא בודק, ומדווח בדיוק מה הוסר.
      - name: ודא שהסוד SUPABASE_DB_URL מוגדר ותקין
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL_RAW" ]; then
            echo "::error::הסוד SUPABASE_DB_URL ריק או לא מוגדר. הגדירו אותו ב-Settings → Secrets and variables → Actions → New repository secret (לא Variable), עם מחרוזת החיבור מ-Supabase → Project Settings → Database → Connection string → URI, פורט 5432. פירוט: docs/supabase-migrations.md"
            exit 1
          fi

          # ‏LC_ALL=C כדי ש-sed יעבוד ברמת בתים ולא ינסה לפרש UTF-8. הסדר:
          # תווי בקרה, סימני כיווניות ורוחב-אפס, NBSP לרווח, גזירת רווחים,
          # ולבסוף מרכאות עוטפות (הדבקה עם גרשיים גם היא מפילה את הניתוח).
          CLEAN=$(printf '%s' "$SUPABASE_DB_URL_RAW" | LC_ALL=C tr -d '\000-\037\177' | LC_ALL=C sed -E \
            -e 's/\xef\xbb\xbf//g' \
            -e 's/\xe2\x80[\x8b-\x8f]//g' \
            -e 's/\xe2\x80[\xaa-\xae]//g' \
            -e 's/\xe2\x81[\xa6-\xa9]//g' \
            -e 's/\xc2\xa0/ /g' \
            -e 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            -e 's/^"(.*)"$/\1/; s/^'"'"'(.*)'"'"'$/\1/')

          # הערך המנוקה אינו הסוד הרשום, ולכן GitHub לא ימסך אותו מעצמו —
          # הוא מכיל את סיסמת המסד. מיסוך מפורש לפני כל שימוש בו.
          echo "::add-mask::$CLEAN"

          if [ "$CLEAN" != "$SUPABASE_DB_URL_RAW" ]; then
            echo "::warning::הסוד SUPABASE_DB_URL הכיל תווים נסתרים או עוטפים שהוסרו לפני השימוש (${#SUPABASE_DB_URL_RAW} תווים לפני, ${#CLEAN} אחרי). הסיבה הנפוצה: העתקה דרך מסמך בעברית שמוסיף סימן כיווניות. שווה לעדכן את הסוד עצמו."
          fi

          case "$CLEAN" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::הסוד SUPABASE_DB_URL אינו מתחיל ב-postgresql:// גם אחרי ניקוי. ודאו שהודבקה מחרוזת החיבור המלאה מ-Supabase → Connect → Direct → URI, בלי גרשיים ובלי טקסט לפניה. פירוט: docs/supabase-migrations.md"
              exit 1
              ;;
          esac

          case "$CLEAN" in
            *:6543/*)
              echo "::error::הסוד מצביע על פורט 6543 (Transaction pooler). ל-DDL צריך את Session pooler בפורט 5432 — ‏6543 לא תומך ב-advisory locks ומיגרציות ייכשלו בו."
              exit 1
              ;;
          esac

          # השלבים הבאים קוראים את הערך המנוקה מכאן, ולא מהסוד הגולמי.
          {
            echo "SUPABASE_DB_URL<<EOF_DBURL"
            echo "$CLEAN"
            echo "EOF_DBURL"
          } >> "$GITHUB_ENV"

          echo "הסוד תקין (${#CLEAN} תווים, פורט 5432)."

      # מצב ההיסטוריה לפני הנגיעה במסד — כדי שיהיה ברור בלוג מה בדיוק חסר
      # ומה עומד לרוץ, גם כשהשלב הבא נכשל.
      #
      # אין כאן env: SUPABASE_DB_URL בכוונה — הגדרה כזו הייתה דורסת את הערך
      # המנוקה שנכתב ל-GITHUB_ENV ומחזירה את התו הנסתר.
      - name: מצב המיגרציות לפני ההרצה
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: הרצת המיגרציות
        env:
          # קלט ההרצה הידנית מועבר כמשתנה סביבה ולא משורשר לתוך הפקודה
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          supabase db push --db-url "$SUPABASE_DB_URL" $ARGS

      - name: מצב המיגרציות אחרי ההרצה
        if: success()
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
