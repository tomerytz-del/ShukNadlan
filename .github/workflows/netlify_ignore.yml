name: דילוג על דיפלוי ב-Netlify

# ‏scripts/netlify_ignore.sh מחליט אם דחיפה מפורסמת ב-Netlify (‏netlify.toml).
# הכשל המסוכן בו שקט: תיקייה של האתר שנכנסה בטעות לרשימת הדילוג, ומאותו
# רגע שינויים בה לא עולים לאוויר. הבדיקה בונה ריפו זמני ומוודאת שכל סוג
# קובץ אתר בונה ושכל סוג קובץ אחר מדלג. ‏docs/netlify-usage.md.

on:
  pull_request:
    paths:
      - "scripts/netlify_ignore.sh"
      - "scripts/netlify_ignore_test.sh"
      - "netlify.toml"
      - ".github/workflows/netlify_ignore.yml"
  push:
    branches: [main]
    paths:
      - "scripts/netlify_ignore.sh"
      - "scripts/netlify_ignore_test.sh"
      - "netlify.toml"
      - ".github/workflows/netlify_ignore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: בדיקת ההחלטה
        run: bash scripts/netlify_ignore_test.sh
