name: פריסת Edge Functions ל-Supabase

# ‏Netlify מפרסם את ה-HTML בכל מיזוג, ה-workflow של המיגרציות מעדכן את
# הסכימה — אבל את ה-Edge Functions אף אחד לא פרס. הן נפרסו ידנית, ומי
# ששכח פשוט שכח: ארבע פונקציות (‏property-visualize, ‏property-visualize-base,
# ‏classify-property-images, ‏property-marketing-publish) ישבו בריפו חודש
# בלי שיהיו באוויר. מנגנון ההדמיות "עבד" בדף הנכס, הטופס נשלח, והבקשה
# חזרה 404 — כי הפונקציה שאמורה לענות לה מעולם לא נפרסה.
#
# מכאן זה אוטומטי: כל מיזוג ל-main שנוגע ב-supabase/functions מפרס את מה
# שהשתנה.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase_functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: "שם פונקציה יחידה לפריסה (ריק = לפי מה שהשתנה)"
        type: string
      deploy_all:
        description: "פריסת כל הפונקציות שבריפו"
        type: boolean
        default: false

# פריסות במקביל על אותו פרויקט הן הדרך לקבל גרסה חלקית באוויר.
concurrency:
  group: supabase-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ‏20 ולא 15: שלושת סבבי הפריסה (ראו "שלושה סבבים" למטה) לוקחים במקרה
    # הגרוע כשבע דקות — שלוש פריסות מלאות ועוד דקה וחצי של המתנות.
    timeout-minutes: 20
    env:
      # ה-ref גלוי ממילא בכל דף באתר (SUPABASE_URL ב-HTML), ולכן הוא לא סוד
      # ולא צריך לשבת ב-Secrets. הסוד היחיד הוא טוקן הגישה.
      PROJECT_REF: obookujgolazrwycsiyn

    steps:
      # ההיסטוריה המלאה דרושה כדי להשוות מול הקומיט הקודם ולדעת מה השתנה
      - name: משיכת הקוד
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # אותו לקח כמו ב-workflow של המיגרציות, בשתי גרסאותיו: סוד ריק לא נכשל
      # בהודעה ברורה אלא בשגיאה שנראית כמו משהו אחר — וסוד עם תו נסתר גרוע
      # אף יותר, כי הוא נראה תקין לגמרי בלוג. מחרוזת שהועתקה דרך עורך טקסט
      # עברי נושאת סימן כיווניות (‏U+200F/U+200E) שאי אפשר לראות; בטוקן זה
      # יתבטא כשגיאת הרשאה מבלבלת. מנקים לפני שבודקים.
      - name: ודא שהסוד SUPABASE_ACCESS_TOKEN מוגדר ותקין
        env:
          SUPABASE_ACCESS_TOKEN_RAW: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN_RAW" ]; then
            echo "::error::הסוד SUPABASE_ACCESS_TOKEN ריק או לא מוגדר. צרו טוקן ב-https://supabase.com/dashboard/account/tokens והוסיפו אותו ב-Settings → Secrets and variables → Actions → New repository secret (לא Variable). פירוט: docs/edge-functions-deploy.md"
            exit 1
          fi

          CLEAN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN_RAW" | LC_ALL=C tr -d '\000-\037\177' | LC_ALL=C sed -E \
            -e 's/\xef\xbb\xbf//g' \
            -e 's/\xe2\x80[\x8b-\x8f]//g' \
            -e 's/\xe2\x80[\xaa-\xae]//g' \
            -e 's/\xe2\x81[\xa6-\xa9]//g' \
            -e 's/\xc2\xa0/ /g' \
            -e 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            -e 's/^"(.*)"$/\1/; s/^'"'"'(.*)'"'"'$/\1/')

          # הערך המנוקה אינו הסוד הרשום ולכן GitHub לא ימסך אותו מעצמו.
          echo "::add-mask::$CLEAN"

          if [ "$CLEAN" != "$SUPABASE_ACCESS_TOKEN_RAW" ]; then
            echo "::warning::הסוד SUPABASE_ACCESS_TOKEN הכיל תווים נסתרים או עוטפים שהוסרו לפני השימוש (${#SUPABASE_ACCESS_TOKEN_RAW} תווים לפני, ${#CLEAN} אחרי). הסיבה הנפוצה: העתקה דרך מסמך בעברית שמוסיף סימן כיווניות. שווה לעדכן את הסוד עצמו."
          fi

          case "$CLEAN" in
            sbp_*) ;;
            *)
              echo "::error::הסוד SUPABASE_ACCESS_TOKEN אינו מתחיל ב-sbp_ גם אחרי ניקוי. טוקן אישי של Supabase נראה כך תמיד. ודאו שהודבק הטוקן עצמו ולא ה-anon key או ה-service role key. פירוט: docs/edge-functions-deploy.md"
              exit 1
              ;;
          esac

          # השלב שפורס קורא את הערך המנוקה מכאן, לא את הסוד הגולמי.
          {
            echo "SUPABASE_ACCESS_TOKEN<<EOF_TOKEN"
            echo "$CLEAN"
            echo "EOF_TOKEN"
          } >> "$GITHUB_ENV"

          echo "הסוד תקין (${#CLEAN} תווים)."

      # ‏config.toml הוא מה שקובע verify_jwt לכל פונקציה. בלעדיו ה-CLI מניח
      # true לכולן ומכבה את כל נקודות הקצה הציבוריות בפריסה אחת.
      - name: ודא ש-config.toml קיים
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error::supabase/config.toml חסר. בלעדיו הפריסה תדליק verify_jwt על כל הפונקציות ותשבור את נקודות הקצה הציבוריות."
            exit 1
          fi
          MISSING=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            grep -q "^\[functions\.$fn\]" supabase/config.toml || MISSING="$MISSING $fn"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::לפונקציות הבאות אין סעיף ב-supabase/config.toml, ולכן הן ייפרסו עם verify_jwt=true (ברירת המחדל של ה-CLI):$MISSING"
            exit 1
          fi
          echo "לכל הפונקציות יש הגדרת verify_jwt מפורשת."

      - name: התקנת Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # מה לפרוס:
      #   • הרצה ידנית עם deploy_all, או שינוי ב-_shared/config.toml → הכול.
      #     ‏_shared הוא קוד שמשותף לכמה פונקציות, ושינוי בו לא מגיע לאף אחת
      #     מהן עד שהיא נפרסת מחדש — הבאנדל נבנה בזמן הפריסה.
      #   • הרצה ידנית עם שם פונקציה → רק היא.
      #   • אחרת → רק התיקיות שהשתנו מול הקומיט הקודם.
      - name: איתור הפונקציות לפריסה
        id: pick
        env:
          INPUT_FUNCTION: ${{ inputs.function }}
          INPUT_ALL: ${{ inputs.deploy_all }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all_functions() {
            for dir in supabase/functions/*/; do
              fn=$(basename "$dir")
              [ "$fn" = "_shared" ] && continue
              echo "$fn"
            done
          }

          if [ -n "${INPUT_FUNCTION:-}" ]; then
            if [ ! -d "supabase/functions/$INPUT_FUNCTION" ]; then
              echo "::error::אין תיקייה supabase/functions/$INPUT_FUNCTION"
              exit 1
            fi
            TARGETS="$INPUT_FUNCTION"
            echo "פריסה ידנית של פונקציה אחת."
          elif [ "${INPUT_ALL:-false}" = "true" ]; then
            TARGETS=$(all_functions)
            echo "פריסה ידנית של כל הפונקציות."
          else
            # ‏before ריק או אפסים = דחיפה ראשונה או היסטוריה שנכתבה מחדש.
            # במצב כזה אין ממה לגזור diff, ולכן פורסים הכול ולא כלום.
            if [ -z "${BEFORE_SHA:-}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              TARGETS=$(all_functions)
              echo "אין קומיט קודם להשוואה — פורסים הכול."
            else
              CHANGED=$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- supabase/functions supabase/config.toml || true)
              echo "קבצים שהשתנו:"; echo "$CHANGED"
              if echo "$CHANGED" | grep -qE '^supabase/(functions/_shared/|config\.toml$)'; then
                TARGETS=$(all_functions)
                echo "‏_shared או config.toml השתנו — פורסים הכול."
              else
                # ה-‏`|| true` אינו קישוט: תחת set -o pipefail, ‏grep שלא מצא
                # התאמה מפיל את כל השלב בקוד יציאה 1 — כלומר מיזוג שנגע רק
                # בקובץ שנמחק היה נראה ככישלון פריסה. אין התאמה = אין מה
                # לפרוס, וזו הצלחה.
                CANDIDATES=$(echo "$CHANGED" \
                  | grep -E '^supabase/functions/[^/]+/' \
                  | cut -d/ -f3 | sort -u || true)
                # תיקייה שנמחקה מופיעה ב-diff אבל כבר לא קיימת בעץ, ואי אפשר
                # לפרוס אותה. מחיקת פונקציה מ-Supabase נשארת פעולה ידנית.
                TARGETS=""
                for fn in $CANDIDATES; do
                  if [ "$fn" != "_shared" ] && [ -d "supabase/functions/$fn" ]; then
                    TARGETS="$TARGETS $fn"
                  fi
                done
              fi
            fi
          fi

          # שני המקורות מגיעים בפורמט שונה — all_functions מחזירה שורה לכל
          # פונקציה, וצבירת ה-diff מחזירה רשימה מופרדת ברווחים. הנרמול כאן
          # הופך את שניהם לשורה-לכל-פונקציה, שזה מה שלולאת הפריסה קוראת.
          TARGETS=$(echo "${TARGETS:-}" | tr ' ' '\n' | sed '/^$/d')
          if [ -z "$TARGETS" ]; then
            echo "אין פונקציה לפרוס."
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "לפריסה:"; echo "$TARGETS"
            echo "targets<<EOF" >> "$GITHUB_OUTPUT"
            echo "$TARGETS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      # פריסה אחת לכל פונקציה ולא `deploy` גורף: כישלון בפונקציה אחת מזוהה
      # בשם, והלוג אומר מה עלה ומה לא. הלולאה לא נעצרת באמצע — פונקציה
      # שנכשלה לא צריכה למנוע מהשאר לעלות — והסטטוס נקבע בסוף.
      # אין כאן env: SUPABASE_ACCESS_TOKEN בכוונה — הגדרה כזו הייתה דורסת את
      # הערך המנוקה שנכתב ל-GITHUB_ENV ומחזירה את התו הנסתר.
      # ---------------------------------------------------------------------
      # שלושה סבבים, ולא ניסיון אחד
      #
      # ב-7.9.2026, המיזוג של מסלולי המנוי (‏PR #192) פרס 45 פונקציות ו-37
      # מהן נכשלו — כולן על אותה שורה:
      #
      #     Could not find npm package '@supabase/realtime-js' matching '2.116.0'
      #         at https://jsr.io/@supabase/supabase-js/2.116.0/src/lib/types.ts
      #
      # גרסה חדשה של supabase-js פורסמה ל-JSR, והתלות שלה טרם התפשטה ל-npm.
      # הראיה שזה חולף נמצאה באותה הרצה עצמה: שמונה הפונקציות האחרונות **כן**
      # עלו, אחרי שהרישום התיישר תוך כדי. הרצה חוזרת ידנית פתרה הכול.
      #
      # ‏שינוי ב-_shared פורס את כל 45 הפונקציות, כלומר 45 הזדמנויות להיתקל
      # בתקלת רישום חולפת אחת — ובשלב הזה כבר לא משנה אם היא בקוד שלנו: ה-HTML
      # והסכימה כבר באוויר, והפונקציות לא.
      #
      # לכן: סבב ראשון על הכול, ואם נשארו כשלים — עוד שניים, רק עליהם, בהפרשי
      # 30 ו-60 שניות. הפסקה בין סבבים ולא ניסיון חוזר מיידי לכל פונקציה, כי
      # התקלה מתפוגגת בזמן ולא בניסיון: 37 המתנות של דקה היו חורגות מה-timeout,
      # ואילו שתי המתנות גלובליות מכסות בדיוק את חלון ההתפשטות.
      #
      # כשל שהתאושש בסבב מאוחר יוצא כ-warning ולא כ-error: הבנייה ירוקה, אבל
      # מי שמסתכל/ת רואה שהיה גמגום. רק כשל בסבב האחרון מפיל את ה-job.
      # ---------------------------------------------------------------------
      - name: פריסה
        if: steps.pick.outputs.targets != ''
        env:
          TARGETS: ${{ steps.pick.outputs.targets }}
        run: |
          PASS_OK=""
          PASS_FAILED=""

          # סבב אחד על רשימת פונקציות מ-stdin. ממלאת PASS_OK ו-PASS_FAILED.
          deploy_pass() {
            local pass="$1"
            PASS_OK=""
            PASS_FAILED=""
            local fn
            while read -r fn; do
              [ -z "$fn" ] && continue
              echo "::group::פריסת $fn (סבב $pass)"
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
                PASS_OK="$PASS_OK $fn"
              else
                # לא ::error:: כאן — סבב הבא עוד עשוי להצליח, והודעת שגיאה
                # על כשל שהתאושש היא בדיוק מה שמלמד להתעלם מהלוג.
                echo "פריסת $fn נכשלה בסבב $pass"
                PASS_FAILED="$PASS_FAILED $fn"
              fi
              echo "::endgroup::"
            done
          }

          DEPLOYED=""
          REMAINING="$TARGETS"
          RECOVERED=""

          for pass in 1 2 3; do
            [ -z "$(echo "$REMAINING" | tr -d '[:space:]')" ] && break

            if [ "$pass" -gt 1 ]; then
              WAIT=$(( (pass - 1) * 30 ))
              echo "::warning::סבב $pass: $(echo $REMAINING | wc -w) פונקציות לא נפרסו בסבב הקודם. ממתין ${WAIT}s ומנסה שוב."
              sleep "$WAIT"
            fi

            deploy_pass "$pass" <<< "$REMAINING"
            DEPLOYED="$DEPLOYED$PASS_OK"
            [ "$pass" -gt 1 ] && RECOVERED="$RECOVERED$PASS_OK"

            # רשימת הנותרים לסבב הבא, שורה לכל פונקציה
            REMAINING=$(echo "$PASS_FAILED" | tr ' ' '\n' | sed '/^$/d')
          done

          echo "נפרסו בהצלחה:${DEPLOYED:- (אין)}"
          if [ -n "$RECOVERED" ]; then
            echo "::warning::הפונקציות האלה נפרסו רק אחרי ניסיון חוזר:$RECOVERED"
          fi
          if [ -n "$(echo "$REMAINING" | tr -d '[:space:]')" ]; then
            echo "::error::הפונקציות האלה לא נפרסו גם אחרי שלושה סבבים: $(echo $REMAINING | tr '\n' ' ')"
            exit 1
          fi

      - name: סיכום
        if: always()
        env:
          TARGETS: ${{ steps.pick.outputs.targets }}
        run: |
          {
            echo "### פריסת Edge Functions"
            if [ -z "${TARGETS:-}" ]; then
              echo "לא נמצאה פונקציה שהשתנתה — לא נפרס דבר."
            else
              echo "היעדים בהרצה הזו:"
              echo '```'
              echo "$TARGETS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
