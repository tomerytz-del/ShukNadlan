name: מדף עורכי הדין - חיווט ונעילת הדגל

# הדגל is_lawyer חייב להיות נעול בהגדרה האחרונה של protect_sensitive_agency_member_fields:
# מיגרציה מאוחרת שמעתיקה גוף ישן מוחקת את הנעילה בלי שגיאה, וכל סוכן/ת היה/הייתה מעניק/ה
# לעצמו/ה גישה לשאלות של לקוחות. הבדיקה קוראת קבצים בלבד. בלי paths בכוונה: בדיקה נדרשת
# שמדולגת חוסמת מיזוג.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: חיווט מדף עורכי הדין
        run: node --test scripts/lawyer_shelf_test.mjs
