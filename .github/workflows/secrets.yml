name: סודות בקוד

# ‏gitleaks על כל קומיט שנכנס: מפתח API, טוקן או סיסמה שהודבקו לקוד נעצרים
# לפני המיזוג. בודק את **הקומיטים** של ה-PR ולא רק את המצב הסופי: סוד
# שנוסף ונמחק בקומיט הבא עדיין יושב בהיסטוריה של git, ולכן עדיין דלף.
#
# רץ על כל PR, בלי סינון נתיבים: סוד יכול לשבת בכל קובץ, ובדיקה נדרשת
# שמדולגת חוסמת מיזוג לנצח (CLAUDE.md, "גרסאות מיגרציה").
#
# ערכים ציבוריים בכוונה (מפתח ה-publishable, טוקן GovMap) ברשימת ההיתר
# ב-.gitleaks.toml, כל אחד עם נימוק. docs/security-ci.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # הבינארי עצמו ולא ה-Action הרשמי: ה-Action דורש רישיון לחשבון ארגון.
      # גרסה נעולה ו-checksum, כדי שמה שרץ כאן לא ישתנה בלי PR.
      - name: התקנת gitleaks
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: סריקה
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE=""
          fi
          echo "טווח: ${RANGE:-כל ההיסטוריה}"
          ./gitleaks git . --no-banner --redact -c .gitleaks.toml ${RANGE:+--log-opts="$RANGE"}

  # ‏Action שאינו נעול ל-SHA יכול להתחלף בקוד זדוני בלי PR שלנו.
  # ‏scripts/check_action_pins.py, ‏docs/security-ci.md
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actions נעולים ל-SHA
        run: python3 scripts/check_action_pins.py
