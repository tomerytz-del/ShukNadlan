name: רישום זמני תור של גבריאלה

on:
  pull_request:
    paths:
      - "supabase/migrations/20271201110000_gabriela_turn_timings.sql"
      - "supabase/functions/whatsapp-webhook/agent.ts"
      - "supabase/functions/whatsapp-webhook/index.ts"
      - "supabase/functions/whatsapp-webhook/turn-timing.ts"
      - "scripts/gabriela_turn_timing_test.ts"
      - ".github/workflows/gabriela_turn_timing.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271201110000_gabriela_turn_timings.sql"
      - "supabase/functions/whatsapp-webhook/agent.ts"
      - "supabase/functions/whatsapp-webhook/index.ts"
      - "supabase/functions/whatsapp-webhook/turn-timing.ts"
      - "scripts/gabriela_turn_timing_test.ts"
      - ".github/workflows/gabriela_turn_timing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: רישום זמני תור של גבריאלה
        run: node --experimental-strip-types scripts/gabriela_turn_timing_test.ts
