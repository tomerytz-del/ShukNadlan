name: רענון חד-פעמי - תיאור שיווקי ופוסט

# ‏הרצה ידנית בלבד. עוברת על הנכסים הפעילים שהתיאור שלהם נכתב בידי Claude,
# וכותבת להם תיאור ופוסט מחדש בפרומפט הנוכחי - בלי התראה לסוכנים ובלי
# לגעת בטקסט שנכתב ביד. הפרטים: scripts/marketing_refresh_once.py.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "רשימת הנכסים בלבד, בלי לכתוב"
        type: boolean
        default: true
      limit:
        description: "מקסימום נכסים (0 = כולם)"
        type: string
        default: "0"

concurrency:
  group: marketing-refresh-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: רענון
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python scripts/marketing_refresh_once.py --limit "${LIMIT:-0}" ${{ inputs.dry_run && '--dry-run' || '' }}
