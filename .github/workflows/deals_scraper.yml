name: עסקאות רשמיות — רשות המיסים

# תזמון: פעם ביום ב-04:10 UTC. מאגר עסקאות המקרקעין מתעדכן בקצב של
# דיווחי מס — עסקה מופיעה בו שבועות עד חודשים אחרי שנסגרה — ולכן הרצה
# תכופה יותר היא אותן רשומות בדיוק. ההרצה היומית קיימת כדי שמה שהתווסף
# בדיעבד ייכנס, לא כדי לתפוס "חדשות".
#
# ‏⚠ לפני ההפעלה הראשונה: מיפוי השדות ב-deals_engine/nadlan.py נכתב לפי
# התיעוד ולא אומת מול תשובה חיה (הסביבה שבה נכתב הקוד חסומה מ-
# ‏nadlan.gov.il). יש להריץ פעם אחת, ידנית, עם probe=true ולקרוא את
# הפלט. ראו docs/market-deals-official.md.

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "בדיקת מיפוי בלבד — מדפיס את התשובה הגולמית, לא כותב דבר"
        type: boolean
        default: false
      dry_run:
        description: "הרצה יבשה — למשוך ולנרמל בלי לכתוב ל-Supabase"
        type: boolean
        default: false
      city:
        description: "עיר בודדת (ריק = ברירת המחדל)"
        type: string
        default: ""
      limit:
        description: "מקסימום עסקאות לעיר (ריק = ללא הגבלה)"
        type: string
        default: ""

# הרצה אחת בכל רגע נתון: שתי הרצות חופפות היו מבצעות upsert על אותן
# שורות בו-זמנית.
concurrency:
  group: deals-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      # לפני שנוגעים ברשת: אם הנרמול שבור, כל מה שיימשך ייכתב שגוי.
      - name: בדיקת הנרמול
        run: python3 scripts/check_deals_normalize.py

      - name: ייבוא העסקאות
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # אופציונלי — Repository Variables, לא סודות
          DEALS_CITIES: ${{ vars.DEALS_CITIES }}
          DEALS_MONTHS_BACK: ${{ vars.DEALS_MONTHS_BACK }}
          DEALS_MAX_PAGES: ${{ vars.DEALS_MAX_PAGES }}
          DEALS_MAX_UNPARSABLE_RATIO: ${{ vars.DEALS_MAX_UNPARSABLE_RATIO }}
          # קלטי ההרצה הידנית עוברים כמשתני סביבה ולא משורשרים לפקודה,
          # כדי שערך בשדה טקסט לא יורץ כשל shell
          PROBE: ${{ inputs.probe }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_CITY: ${{ inputs.city }}
          RUN_LIMIT: ${{ inputs.limit }}
        # מערך ולא מחרוזת: שם יישוב עשוי להכיל רווח ("תל אביב"), ופיצול
        # מילים של $ARGS היה מעביר "אביב" כארגומנט נפרד.
        run: |
          if [ "$PROBE" = "true" ]; then
            exec python deals_scraper.py --probe "${RUN_CITY:-עפולה}"
          fi
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$RUN_CITY" ];  then ARGS+=(--city "$RUN_CITY"); fi
          if [ -n "$RUN_LIMIT" ]; then ARGS+=(--limit "$RUN_LIMIT"); fi
          python deals_scraper.py "${ARGS[@]}"
