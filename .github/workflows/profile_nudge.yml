name: גיליון השלמת פרטים

# הגיליון במובייל קורא את מדריך ההתחלה (onbModel) ולא מחשב "מה חסר"
# בעצמו. בדיקה שקטה: פריט שגולש מהרשימה, או כפתור שנשמע כמו תשלום,
# נראים תקינים בדף ופשוט מבקשים את הדבר הלא נכון.
#
# קבצים בלבד: בלי רשת ובלי סודות.

on:
  pull_request:
    paths:
      - "assets/crm-profile-nudge.js"
      - "assets/crm-onboarding.js"
      - "scripts/profile_nudge_test.js"
      - ".github/workflows/profile_nudge.yml"
  push:
    branches: [main]
    paths:
      - "assets/crm-profile-nudge.js"
      - "assets/crm-onboarding.js"
      - "scripts/profile_nudge_test.js"
      - ".github/workflows/profile_nudge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: בדיקת הגיליון
        run: node scripts/profile_nudge_test.js
