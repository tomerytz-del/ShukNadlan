name: מבחן עומס - אתר ופונקציות

# ‏הרצה ידנית בלבד. ‏web - "גולשים" בו-זמניים במסלול אמיתי (דף הבית, רשימת
# נכסים מה-REST, דף נכס, /prices); ‏edge - בקשות שנדחות מיד ב-whatsapp-webhook
# (חתימה שגויה) וב-coach-ask (בלי JWT), כדי למדוד את תקרת הריצות של הפונקציות.
# קריאה בלבד, בלי מודל ובלי הודעות. ‏Netlify מבקשת לתאם מראש עומס כבד על האתר.
# docs/load-testing.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "web (אתר) או edge (פונקציות של גבריאלה והמנטור)"
        default: "web"
        required: true
      levels:
        description: "גלים בו-זמניים, מופרדים בפסיק"
        default: "5,20,50"
        required: true

permissions:
  contents: read

jobs:
  load:
    name: מבחן עומס - אתר ופונקציות
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: מבחן העומס
        env:
          TARGET: ${{ inputs.target }}
          LEVELS: ${{ inputs.levels }}
        run: node --experimental-strip-types scripts/site_load_test.ts "--target=$TARGET" "--levels=$LEVELS" --yes
