name: מנוע לידים RSS

# **אין תזמון — הרצה ידנית בלבד, והקובץ אומר את זה במפורש.**
#
# ה-workflow עצמו מושבת ב-GitHub (`disabled_manually`) מ-25.8.2026, ושלוש
# ההרצות המתוזמנות האחרונות שלו — כולן באותו יום — נכשלו. מאז: ‏`rss_sources`
# מחזיקה שבעה מקורות שכולם `active = false` ואף אחד מהם לא נמשך מעולם
# (`last_fetched_at` ריק), ו-`rss_leads` ריקה — אפס שורות מעולם.
#
# בלוק ה-`schedule` נשאר כאן עוד חודש אחרי ההשבתה, וזו הייתה מלכודת: לחיצה
# אחת על Enable workflow בלשונית Actions הייתה מחזירה 48 סריקות ביום מול
# שבעה מקורות כבויים. עכשיו הפעלה מחדש מחזירה **הרצה ידנית בלבד**, וזה בדיוק
# מה שצריך כדי לבדוק מקור חדש.
#
# **להחזרת התזמון, כשיהיו מקורות שמייצרים לידים** — שלושה שינויים באותו PR:
#   1. להחזיר כאן `schedule:` עם `- cron: "*/30 * * * *"` (‏UTC).
#   2. להסיר את `rss_scraper.yml` מ-`PAUSED_WORKFLOWS` ב-`ops_agent/config.py`,
#      אחרת הסוכן התפעולי ישתוק גם על שקט אמיתי.
#   3. להפעיל את ה-workflow עצמו ב-Actions — קובץ בלבד אינו מפעיל אותו.
# לפני כל אלה: הרצה ידנית עם `dry_run` שמחזירה ליד אחד לפחות מהמקור החדש.
#
# הערה שנשארת נכונה: מניעת הכפילויות מבוססת `source_url` ולא חלון זמן, ולכן
# הרצה שנדחתה או רצה פעמיים אינה מייצרת לידים כפולים.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "הרצת יבש — לנתח בלי לשמור ל-Supabase"
        type: boolean
        default: false
      limit:
        description: "מקסימום פוסטים חדשים בהרצה (ריק = ברירת המחדל)"
        type: string
        default: ""

# הרצה אחת בכל רגע נתון: אם הרצה קודמת עוד לא הסתיימה, החדשה ממתינה
# במקום לרוץ במקביל ולנתח את אותם פוסטים פעמיים.
concurrency:
  group: rss-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      - name: הרצת הסקרייפר
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # אופציונלי — מוגדרים כ-Repository Variables, לא כסודות
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          RSS_FEED_URLS: ${{ vars.RSS_FEED_URLS }}
          MAX_NEW_LEADS_PER_RUN: ${{ vars.MAX_NEW_LEADS_PER_RUN }}
          MIN_SCORE_TO_PUBLISH: ${{ vars.MIN_SCORE_TO_PUBLISH }}
          # קלטי ההרצה הידנית מועברים כמשתני סביבה ולא משורשרים לתוך הפקודה,
          # כדי שערך זדוני בשדה הטקסט לא יורץ כשל shell
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          if [ -n "$RUN_LIMIT" ]; then ARGS="$ARGS --limit $RUN_LIMIT"; fi
          python scraper.py $ARGS
