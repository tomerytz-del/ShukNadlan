name: פולואפ פגישה לליד

on:
  pull_request:
    paths:
      - "supabase/migrations/20271129110000_meeting_followup_leads.sql"
      - "supabase/functions/whatsapp-webhook/agenda-lead.ts"
      - "scripts/meeting_followup_leads_test.ts"
      - ".github/workflows/meeting_followup_leads.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271129110000_meeting_followup_leads.sql"
      - "supabase/functions/whatsapp-webhook/agenda-lead.ts"
      - "scripts/meeting_followup_leads_test.ts"
      - ".github/workflows/meeting_followup_leads.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: פולואפ פגישה לליד
        run: node --experimental-strip-types scripts/meeting_followup_leads_test.ts
