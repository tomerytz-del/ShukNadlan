name: תקרת תבניות וואטסאפ

# הדגל whatsapp_template_cap_enabled נולד כבוי. הבדיקה רצה את חוקי
# 0/1/2 ואת הסדר מול שמירת ההתפרצות, בלי לשלוח וואטסאפ.

on:
  pull_request:
    paths:
      - "supabase/migrations/20271030000200_whatsapp_template_cap.sql"
      - "supabase/migrations/20271031260000_template_cap_digest_reserved.sql"
      - "supabase/functions/notification-push/index.ts"
      - "scripts/whatsapp_template_cap_test.mjs"
      - "scripts/whatsapp_template_cap_digest_test.py"
      - ".github/workflows/whatsapp_template_cap.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271030000200_whatsapp_template_cap.sql"
      - "supabase/migrations/20271031260000_template_cap_digest_reserved.sql"
      - "supabase/functions/notification-push/index.ts"
      - "scripts/whatsapp_template_cap_test.mjs"
      - "scripts/whatsapp_template_cap_digest_test.py"
      - ".github/workflows/whatsapp_template_cap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: תקרת תבניות
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: לקוח Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: בדיקת תקרת התבניות
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          node scripts/whatsapp_template_cap_test.mjs
          python3 scripts/whatsapp_template_cap_digest_test.py
