<style>
  :root{
    --ink:#0d1b3d; --ink-soft:#4a5578; --paper:#f4f7fe; --raised:#ffffff;
    --line:#e3e8f4; --blue:#0e2a6b; --blue-tint:#eaf0fb;
    --ok:#1e7a4c; --ok-tint:#e5f5ec; --bad:#b3261e; --bad-tint:#fdecea; --warn:#7a5a00; --warn-tint:#fff6e0;
    --radius:16px; --shadow:0 2px 10px rgba(18,40,64,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55}
  h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--blue);margin:0 0 4px;font-size:1.3rem;line-height:1.3}
  .shell{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
  .sub{color:var(--ink-soft);font-size:.9rem;margin:0}
  .state{text-align:center;color:var(--ink-soft)}
  .spin{width:28px;height:28px;border:3px solid var(--blue-tint);border-top-color:var(--blue);border-radius:50%;margin:6px auto 10px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .fact{background:var(--blue-tint);border-radius:12px;padding:10px 12px}
  .fact b{display:block;font-size:1.05rem;color:var(--blue)}
  .fact span{font-size:.8rem;color:var(--ink-soft)}
  .fact.wide{grid-column:1 / -1}
  .sec-title{font-weight:700;margin:0 0 8px;font-size:1rem}
  .plan{padding:10px 0;border-top:1px solid var(--line)}
  .plan:first-of-type{border-top:none}
  .plan-num{font-weight:700}
  .plan-meta{font-size:.82rem;color:var(--ink-soft)}
  .plan a{color:var(--blue);font-size:.85rem}
  .notice{background:var(--warn-tint);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-top:10px}
  .status{border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem}
  .status.ok{background:var(--ok-tint);color:var(--ok)}
  .status.bad{background:var(--bad-tint);color:var(--bad)}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:12px;font:inherit;font-weight:700;border:none;cursor:pointer;background:var(--blue);color:#fff;margin-top:10px}
  .note{color:var(--ink-soft);font-size:.8rem;margin:10px 0 0}
  .act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .act{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 12px;border-radius:12px;
    font:inherit;font-weight:700;font-size:.92rem;border:none;cursor:pointer;background:var(--blue-tint);color:var(--blue);text-decoration:none;text-align:center}
  .act-wa{background:#1f8f4e;color:#fff;grid-column:1 / -1}
  .act-msg{color:var(--ok);font-size:.85rem;margin:8px 0 0;min-height:1em}
  .foot{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:18px}
  /* ‏"הורדה כ-PDF" היא חלון ההדפסה: בלי הכפתורים, ובלי צללים שיוצאים אפורים */
  @media print{
    body{background:#fff}
    .actions,.status,.foot{display:none}
    .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
    .plan a::after{content:" " attr(href);font-size:.75rem;color:#555}
  }
  .foot a{color:inherit}
</style>
