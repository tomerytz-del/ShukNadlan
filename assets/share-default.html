<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>שוק נדל״ן — תמונת שיתוף</title>
<!--
  מקור האמת לתמונת השיתוף הכללית של האתר (og:image).
  זה לא עמוד שמוגש לגולשים — הוא נפתח ב-Chromium ומצולם ל-assets/share-default.png
  ע"י scripts/build-share-image.mjs. לעריכה: משנים כאן, מריצים את הסקריפט מחדש.

  העיצוב מצטט במכוון את ה-hero של דף הבית — אותו נייבי, אותו גרדיאנט אדום-יין,
  ואותם path-ים בדיוק של קו הרכס מ-index.html — כדי שהתצוגה המקדימה בוואטסאפ
  תרגיש כמו המשך של האתר ולא כמו באנר גנרי.

  1200×630 הוא היחס ש-WhatsApp / Facebook / X מצפים לו.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse at 22% 0%, rgba(139,35,50,.42), transparent 60%),
      #122840;
    color:#fff;font-family:'Heebo',sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 74px;
  }

  .brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}
  .mark{
    width:60px;height:60px;border-radius:14px;
    background:linear-gradient(155deg,#8B2332,#1C3A5E 65%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:2rem;color:#fff;
  }
  .word{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:2.1rem;letter-spacing:.01em}
  .word span{color:#E8A9A9}

  .eyebrow{
    display:flex;align-items:center;gap:12px;
    font-size:1.05rem;font-weight:700;color:#E8C88A;letter-spacing:.04em;margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:34px;height:3px;background:#E8C88A;border-radius:2px}

  h1{
    font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:4.05rem;
    line-height:1.12;max-width:17ch;
  }
  p.lede{margin-top:22px;font-size:1.42rem;color:#C6D4E2;max-width:34ch;line-height:1.45}

  /* אותו קו רכס של ה-hero ב-index.html — הציטוט הוויזואלי הוא כל הרעיון */
  .ridge{position:absolute;bottom:0;right:0;left:0;height:132px;line-height:0}
  .ridge svg{width:100%;height:100%;display:block}
  .ridge .far { fill:rgba(255,255,255,.07) }
  .ridge .near{ fill:rgba(255,255,255,.11) }
  .ridge .rows{ stroke:rgba(255,255,255,.16);stroke-width:1;fill:none }

  .domain{
    position:absolute;bottom:38px;left:74px;
    font-size:1.15rem;font-weight:700;color:rgba(255,255,255,.62);letter-spacing:.02em;
  }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark">ש</span>
    <span class="word">שוק <span>נדל״ן</span></span>
  </div>

  <p class="eyebrow">עפולה והעמק · מרקטפלייס מקומי</p>
  <h1>כל הדירות, כל המתווכים, בכתובת אחת</h1>
  <p class="lede">מפסיקים לרוץ בין לוחות מודעות — כל המתווכים המובילים בעיר, במקום אחד.</p>

  <div class="ridge">
    <svg viewBox="0 0 1200 90" preserveAspectRatio="none" focusable="false">
      <path class="far" d="M0,62 L120,44 L232,58 L358,30 L470,52 L604,26 L742,50 L870,34 L1000,56 L1110,42 L1200,58 L1200,90 L0,90 Z"/>
      <path class="near" d="M0,76 L96,64 L210,74 L332,56 L452,72 L586,54 L716,70 L852,60 L988,74 L1104,64 L1200,74 L1200,90 L0,90 Z"/>
      <g class="rows">
        <path d="M40,88 C220,80 420,80 600,86"/>
        <path d="M300,90 C480,82 700,82 900,88"/>
        <path d="M640,88 C820,81 1020,81 1180,87"/>
      </g>
    </svg>
  </div>

  <div class="domain">shuknadlan.co.il</div>
</body>
</html>
