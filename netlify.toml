# ============================================================================
# ‏Netlify - רק מה שאינו מוגדר במסך
#
# תיקיית הפרסום נשארת בהגדרות האתר ב-Netlify, כמו שהייתה. הקובץ מוסיף שני דברים:
#
# 1. לא לפרסם מחדש כשהדחיפה לא נגעה באתר (תיעוד, מיגרציות, פונקציות Supabase,
#    בדיקות). ‏scripts/netlify_ignore.sh מחליט; בספק הוא בונה.
# 2. פקודת בנייה (2.11.2026): הקטנת העותק שנפרס - הערות ורווחים ב-JS שב-assets/,
#    והערות ב-HTML שאינן סמנים של Edge Functions. הריפו לא משתנה. כל כשל בה
#    נגמר בפריסה בלי הקטנה, לא בבנייה שנכשלה. ‏scripts/build_minify.mjs.
#    ‏command כאן גובר על פקודה שהוגדרה במסך.
#
# זה חל על פרודקשן ועל Deploy Preview כאחד. הפרטים: docs/netlify-usage.md.
# ============================================================================

[build]
  ignore = "bash scripts/netlify_ignore.sh"
  command = "bash scripts/netlify_build.sh"
