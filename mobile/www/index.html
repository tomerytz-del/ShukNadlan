<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a6b">
  <title>שוק נדל״ן</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e2a6b;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 24px;
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 28px; font-weight: 700; margin: 16px 0 4px; }
    p { margin: 0; color: #d5def5; font-size: 16px; }
    #offline { display: none; }
    #offline.show { display: block; }
    #loading.hide { display: none; }
    .card {
      margin-top: 28px;
      background: #fff;
      color: #12224f;
      border-radius: 18px;
      padding: 20px 18px;
      max-width: 320px;
    }
    .card p { color: #24345f; line-height: 1.45; }
    button, a.btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #0e2a6b;
      color: #fff;
      font: inherit;
      font-size: 17px;
      padding: 12px 16px;
      text-decoration: none;
    }
    a.link { display: inline-block; margin-top: 12px; color: #0e2a6b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>שוק נדל״ן</h1>
    <p id="loading">טוענים את האתר...</p>
    <div id="offline">
      <div class="card">
        <p>אין חיבור לאינטרנט כרגע. כשהרשת חוזרת, לחצו על נסו שוב.</p>
        <button type="button" id="retry">נסו שוב</button>
        <a class="link" href="https://shuknadlan.co.il/privacy">מדיניות הפרטיות</a>
      </div>
    </div>
  </main>
  <script src="native-bridge.js"></script>
  <script>
    var SITE = 'https://shuknadlan.co.il/';
    function showOffline() {
      document.getElementById('loading').className = 'hide';
      document.getElementById('offline').className = 'show';
    }
    function go(url) {
      if (!navigator.onLine) { showOffline(); return; }
      location.replace(url || SITE);
    }
    document.getElementById('retry').addEventListener('click', function () { go(SITE); });
    window.addEventListener('online', function () {
      var btn = document.getElementById('retry');
      if (btn) btn.textContent = 'החיבור חזר - נסו שוב';
    });
    function start(tries) {
      var cap = window.Capacitor;
      var ready = cap && cap.isNativePlatform && cap.isNativePlatform();
      if (!ready && tries < 15) {
        setTimeout(function () { start(tries + 1); }, 100);
        return;
      }
      var native = window.ShukNative;
      var pending = native && native.launchDestination ? native.launchDestination() : Promise.resolve(null);
      Promise.resolve(pending).then(function (dest) {
        if (!navigator.onLine) { showOffline(); return; }
        go(dest || SITE);
      }).catch(function () { go(SITE); });
    }
    start(0);
  </script>
</body>
</html>
