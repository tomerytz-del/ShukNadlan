<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a6b">
  <title>שוק נדל״ן</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e2a6b;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 24px;
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 28px; margin: 16px 0 0; }
    .card {
      margin-top: 28px;
      background: #fff;
      color: #12224f;
      border-radius: 18px;
      padding: 20px 18px;
      max-width: 320px;
    }
    .card p { margin: 0; line-height: 1.45; }
    button {
      display: block;
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #0e2a6b;
      color: #fff;
      font: inherit;
      font-size: 17px;
      padding: 12px 16px;
    }
    a { display: inline-block; margin-top: 12px; color: #0e2a6b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>שוק נדל״ן</h1>
    <div class="card">
      <p>אין חיבור לאינטרנט כרגע. כשהרשת חוזרת, לחצו על נסו שוב.</p>
      <button type="button" id="retry">נסו שוב</button>
      <a href="https://shuknadlan.co.il/privacy">מדיניות הפרטיות</a>
    </div>
  </main>
  <script>
    var SITE = 'https://shuknadlan.co.il/';
    document.getElementById('retry').addEventListener('click', function () {
      if (navigator.onLine) location.replace(SITE);
    });
    window.addEventListener('online', function () {
      document.getElementById('retry').textContent = 'החיבור חזר - נסו שוב';
    });
  </script>
</body>
</html>
