<style>
/* ============================================================================
   אזור הלמידה - כיוון "חפיסת קלפים" (docs/exam-course-design-brief.md, הקנבס
   של קלוד דיזיין 6.11.2026). design-system.css נטען אחרי הבלוק הזה.
   הטוקנים: ספיר #0e2a6b, ספיר עמוק #0d1b3d, זהב #e5c76a, קרם #fbf4dc,
   נייר #f4f7fe, קו #e3e8f4, דיו #0d1b3d, דיו רך #4a5578.
   ============================================================================ */
*{box-sizing:border-box}
body{margin:0;background:#f4f7fe;color:#0d1b3d;font-family:'Heebo',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input{font-family:inherit}
.hidden{display:none !important}
#app{flex:1 0 auto;display:flex;flex-direction:column;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;width:100%}

/* ---- הפס הכחול העליון ---- */
.band{background:#0e2a6b;color:#fff;border-radius:0 0 32px 32px;padding-bottom:16px;position:relative;z-index:2}
.band.tall{padding-bottom:72px}
.band-in{max-width:1120px;margin:0 auto;padding:0 16px}
.bar-row{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:calc(env(safe-area-inset-top,0px) + 4px)}
.bar-row .logo{width:26px;height:31px;flex:none}
.bar-row .brand{font-size:17px;font-weight:800;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .ctx{font-size:14px;color:#c9d3ee;white-space:nowrap;display:none}
.track{flex:1 1 auto;height:12px;border-radius:99px;background:rgba(13,27,61,.55);padding:2px;min-width:40px}
.track i{display:block;height:100%;border-radius:99px;background:#e5c76a;width:0;transition:width .4s ease}
.frac{font-size:14px;font-weight:800;color:#e5c76a;white-space:nowrap;font-variant-numeric:tabular-nums}
.av{width:32px;height:32px;border-radius:50%;background:#e5c76a;color:#0d1b3d;font-size:14px;font-weight:800;display:grid;place-items:center;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.ib{width:44px;height:44px;margin:-6px;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:12px;flex:none}
.ib:hover{background:rgba(255,255,255,.1)}
.sub-row{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 0;color:#fff}
.sub-row .n{font-size:15px;font-weight:700}
.sub-row .t{font-size:13px;color:#c9d3ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.band h1{margin:0;color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}
.pill.gold{background:#e5c76a;color:#0d1b3d}
.pill.cream{background:#fbf4dc;color:#0d1b3d}
.pill.navy{background:#0e2a6b;color:#fff}
.pill.red{background:#d92d20;color:#fff}

/* ---- כפתורים ---- */
.btn-p{width:100%;height:58px;border:0;border-radius:99px;background:#0e2a6b;color:#fff;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0d1b3d;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s}
.btn-p:active{transform:translateY(3px);box-shadow:0 2px 0 #0d1b3d}
.btn-p:disabled{opacity:.55;cursor:default}
.btn-s{width:100%;height:54px;border:2px solid #e3e8f4;border-radius:99px;background:#fff;color:#0e2a6b;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #e3e8f4;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-s:active{transform:translateY(2px);box-shadow:0 2px 0 #e3e8f4}
.btn-s:disabled{opacity:.5;cursor:default}
.btn-o{width:100%;height:56px;border:2px solid #0e2a6b;border-radius:99px;background:#fff;color:#0e2a6b;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #0e2a6b;display:flex;align-items:center;justify-content:center;gap:8px}
.link{background:none;border:0;color:#0e2a6b;font-weight:700;cursor:pointer;font-size:14px;text-decoration:underline;padding:6px}
.err{color:#b42318;font-size:14px;min-height:1em}
.spin{width:34px;height:34px;border:3px solid #e3e8f4;border-top-color:#0e2a6b;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0d1b3d;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---- כניסה / תשלום ---- */
.center{max-width:520px;margin:-56px auto 30px;padding:0 18px;position:relative;z-index:3;width:100%}
.card{background:#fff;border:1px solid #e3e8f4;border-radius:24px;padding:22px 20px;box-shadow:0 16px 36px rgba(14,42,107,.14);display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:22px}
.card p{margin:0;font-size:15px;line-height:1.6;color:#4a5578}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mrow img{width:44px;height:44px;border-radius:50%;flex:none;border:2px solid #e5c76a;object-fit:cover}
.bubble{flex:1;background:#f4f7fe;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:14.5px;line-height:1.5;color:#0d1b3d}
.gbtn{width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:2px solid #e3e8f4;border-radius:99px;font-weight:800;font-size:16px;cursor:pointer;color:#0d1b3d;box-shadow:0 4px 0 #e3e8f4}
.gbtn:disabled{opacity:.6}
.gbtn svg{width:20px;height:20px}
.price-row{display:flex;align-items:baseline;justify-content:space-between}
.price-row .amt{font-size:42px;font-weight:800;line-height:1}
.price-row .amt small{font-size:14px;font-weight:500;color:#4a5578;margin-inline-start:6px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:15px}
.feat li{display:flex;align-items:center;gap:8px}
.feat svg{flex:none}
.hr{height:1px;background:#e3e8f4}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#4a5578}
.field input{height:48px;border:2px solid #e3e8f4;border-radius:14px;padding:0 14px;font-size:16px;color:#0d1b3d;background:#fff}
.field input:focus{outline:none;border-color:#0e2a6b}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px;color:#0d1b3d}
.chk input{width:22px;height:22px;accent-color:#0e2a6b;margin:0;flex:none}

/* ---- מפת הקורס ---- */
.map-head{padding:0 6px;display:flex;flex-direction:column;gap:10px}
.map-head .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.map-head h1{font-size:22px;font-weight:800}
.map-head .count{font-size:15px;font-weight:700;color:#e5c76a;white-space:nowrap}
.map-track{height:14px;border-radius:99px;background:rgba(13,27,61,.55);padding:3px}
.map-track i{display:block;height:100%;border-radius:99px;background:#e5c76a;width:0;transition:width .5s}
.mline{display:flex;align-items:center;gap:10px;margin-top:4px}
.mline img{width:40px;height:40px;border-radius:50%;border:2px solid #e5c76a;flex:none;object-fit:cover}
.mline p{margin:0;flex:1;background:#fff;color:#0d1b3d;border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px;line-height:1.45}
.map{padding:16px 20px 140px;display:flex;flex-direction:column;gap:10px;max-width:1120px;margin:0 auto;width:100%}
.chap-t{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:#4a5578;margin-top:8px}
.path{position:relative;display:flex;flex-direction:column;gap:12px}
.path::before{content:"";position:absolute;top:24px;bottom:24px;right:27px;width:4px;border-radius:4px;background:#e3e8f4}
.node{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none;color:#0d1b3d;background:none;border:0;padding:0;text-align:start;cursor:pointer;width:100%;font-family:inherit}
.node .dot{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e3e8f4;color:#4a5578}
.node.done .dot{background:#1f9d55;color:#fff;box-shadow:0 4px 0 #146c3a}
.node.open .dot{background:#0e2a6b;color:#e5c76a;box-shadow:0 4px 0 #0d1b3d,0 0 0 6px rgba(14,42,107,.14)}
.node .lbl{flex:1;font-size:15px;font-weight:600;line-height:1.35}
.node.locked{color:#4a5578;cursor:pointer}
.node.locked .lbl{font-weight:500}
.node.next .lbl{background:#fff;border:2px solid #0e2a6b;border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 #0e2a6b;display:flex;flex-direction:column;gap:2px;font-weight:700}
.node.next .lbl small{font-size:12px;font-weight:800;color:#0e2a6b}
.map-nav{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(26px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #e3e8f4;border-radius:24px 24px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:0 -8px 24px rgba(14,42,107,.08);z-index:5}
.map-nav .btn-p,.map-nav .btn-s{height:58px;border-radius:18px;font-size:16px}
.map-nav .btn-s{border-color:#e3e8f4}
.badge{padding:1px 8px;border-radius:99px;font-size:13px;font-weight:800}
.badge.gold{background:#e5c76a;color:#0d1b3d}
.badge.red{background:#d92d20;color:#fff}

/* ---- חפיסת הקלפים ---- */
.deck-wrap{position:relative;z-index:3;padding:0 4px;flex:1 1 auto;display:flex;flex-direction:column;max-width:1120px;margin:-50px auto 0;width:100%}
.deck{position:relative;flex:1 1 auto}
.deck::before{content:"";position:absolute;top:18px;left:20px;right:20px;bottom:-8px;background:#dfe6f7;border-radius:24px}
.deck::after{content:"";position:absolute;top:9px;left:10px;right:10px;bottom:1px;background:#eef2fb;border:1px solid #e3e8f4;border-radius:24px}
.kard{position:relative;z-index:1;background:#fff;border:1px solid #e3e8f4;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 36px rgba(14,42,107,.14);min-height:420px;animation:kin .25s ease}
@keyframes kin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kard .top{height:150px;background:#fbf4dc;display:grid;place-items:center;position:relative;flex:none}
.kard .top .tile{width:92px;height:92px;border-radius:28px;background:#fff;color:#0e2a6b;display:grid;place-items:center;box-shadow:0 6px 0 #e5c76a;font-size:44px}
.kard .top .pill{position:absolute;top:14px;right:14px}
.kard .body{flex:1;padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px}
.kard h2{margin:0;font-size:26px;line-height:1.25;font-weight:800;text-wrap:balance}
.kard p{margin:0;font-size:17px;line-height:1.6;color:#0d1b3d}
.kard .ref{margin-top:auto;font-size:14px;font-weight:700;color:#0e2a6b}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;color:#4a5578;font-size:13px}
.sheet-m,.sheet-wrap{margin-top:auto;display:flex;flex-direction:column}
.sheet-wrap{padding:0 18px}
.foot{padding:14px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-width:1120px;margin:0 auto;width:100%}
.foot.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.intro-m{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.intro-m img{width:40px;height:40px;border-radius:50%;border:2px solid #e5c76a;flex:none}
.intro-m p{margin:0;flex:1;background:#fff;border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px;line-height:1.45;border:1px solid #e3e8f4}

/* ---- סיפור מקרה ---- */
.case-wrap{position:relative;z-index:3;padding:0;flex:1 1 auto;display:flex;flex-direction:column;max-width:1120px;margin:-50px auto 0;width:100%}
.tab{display:flex}
.tab span{padding:8px 16px 10px;border-radius:16px 16px 0 0;background:#fbf4dc;color:#0d1b3d;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.case{background:#fff;border:1px solid #e3e8f4;border-top:6px solid #fbf4dc;border-radius:0 24px 24px 24px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 36px rgba(14,42,107,.14)}
.case .who{display:flex;align-items:center;gap:10px}
.case .who .ini{width:40px;height:40px;border-radius:50%;background:#e9eefb;color:#0e2a6b;font-size:17px;font-weight:800;display:grid;place-items:center}
.case .who b{font-size:16px;font-weight:800;display:block}
.case .who small{font-size:13px;color:#4a5578}
.case p{margin:0;font-size:18px;line-height:1.65}
.case .q{font-size:16px;font-weight:700;color:#0e2a6b}
.law{margin-top:14px;background:#0e2a6b;color:#fff;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;animation:kin .25s ease}
.law small{font-size:13px;font-weight:800;color:#e5c76a}
.law p{margin:0;font-size:17px;line-height:1.55;font-weight:600}

/* ---- בדיקה מהירה ---- */
.q-band{padding:0 6px;display:flex;flex-direction:column;gap:8px}
.q-band h1{font-size:20px;line-height:1.45;font-weight:700;color:#fff;margin:0}
.opts{padding:18px 20px 0;display:flex;flex-direction:column;gap:10px;max-width:1120px;margin:0 auto;width:100%}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px;border-radius:16px;border:2px solid #e3e8f4;background:#fff;box-shadow:0 4px 0 #e3e8f4;text-align:start;font-size:16px;color:#4a5578;cursor:pointer;width:100%;line-height:1.45;transition:transform .08s}
.opt:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #e3e8f4}
.opt .l{flex:none;width:30px;height:30px;border-radius:10px;background:#eef1f8;color:#4a5578;font-weight:800;font-size:15px;display:grid;place-items:center}
.opt:disabled{cursor:default}
.opt.chosen{border-color:#0e2a6b;background:#e9eefb;box-shadow:0 4px 0 #0e2a6b;color:#0d1b3d}
.opt.chosen .l{background:#0e2a6b;color:#fff}
.opt.right{border-color:#1f9d55;background:#e7f6ed;box-shadow:0 4px 0 #1f9d55;color:#0d1b3d;font-weight:600}
.opt.right .l{background:#1f9d55;color:#fff}
.opt.wrong{border-color:#d92d20;background:#fdecea;box-shadow:0 4px 0 #d92d20;color:#0d1b3d}
.opt.wrong .l{background:#d92d20;color:#fff}
.sheet{margin-top:auto;position:relative;background:#fff;border-top:3px solid #1f9d55;border-radius:24px 24px 0 0;padding:22px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 28px rgba(14,42,107,.1);animation:up .25s ease}
.sheet.bad{border-top-color:#d92d20}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.sheet img{position:absolute;top:-30px;left:20px;width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(13,27,61,.2)}
.sheet b.t{font-size:18px;font-weight:800;color:#146c3a}
.sheet.bad b.t{color:#b42318}
.sheet .lead{margin:0;font-size:16px;line-height:1.5;font-weight:600;padding-inline-end:0;padding-left:64px}
.sheet .ex{margin:0;font-size:14px;line-height:1.6;color:#4a5578}
.sheet .ex strong{color:#0e2a6b}
.sheet .btn-p{margin-top:6px}
.src{font-size:12px;color:#4a5578}

/* ---- כרטיס זיכרון ---- */
.flash{position:relative;z-index:1;width:100%;min-height:440px;border:0;border-radius:24px;cursor:pointer;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;font-family:inherit;animation:kin .25s ease}
.flash.front{background:#0e2a6b;color:#fff;box-shadow:0 16px 36px rgba(14,42,107,.25)}
.flash.back{background:#fff;color:#0d1b3d;border:2px solid #e3e8f4;box-shadow:0 16px 36px rgba(14,42,107,.14)}
.flash .pill{position:absolute;top:16px;right:16px}
.flash .big{font-size:26px;line-height:1.3;font-weight:800}
.flash.back .big{color:#0e2a6b;font-size:28px}
.flash .q{font-size:15px;color:#4a5578}
.flash .hint2{display:flex;align-items:center;gap:6px;font-size:14px;color:#c9d3ee}
.btn-no{height:58px;border-radius:18px;border:2px solid #d92d20;background:#fdecea;color:#b42318;font-size:17px;font-weight:800;box-shadow:0 4px 0 #d92d20;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn-yes{height:58px;border-radius:18px;border:2px solid #1f9d55;background:#e7f6ed;color:#146c3a;font-size:17px;font-weight:800;box-shadow:0 4px 0 #1f9d55;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}

/* ---- סיום שיעור / תוצאה ---- */
.done-head{padding:8px 22px 0;text-align:center;display:flex;flex-direction:column;gap:4px}
.done-head h1{font-size:30px;font-weight:800}
.done-head p{margin:0;font-size:15px;color:#c9d3ee}
.done-main{padding:0 20px;margin-top:-54px;position:relative;z-index:3;display:flex;flex-direction:column;gap:14px;max-width:900px;margin-inline:auto;width:100%}
.score{background:#fff;border:1px solid #e3e8f4;border-radius:24px;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 14px 32px rgba(14,42,107,.12)}
.gauge{position:relative;width:168px;height:168px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font-size:52px;font-weight:800;line-height:1}
.gauge .v small{font-size:13px;color:#4a5578;margin-top:2px}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;align-items:center}
.stats .ok{background:#e7f6ed}.stats .ok b{color:#146c3a}
.stats .no{background:#fdecea}.stats .no b{color:#b42318}
.stats b{font-size:22px;font-weight:800}
.stats span{font-size:13px}
.res-head{padding:4px 22px 0;display:flex;align-items:center;gap:18px}
.res-head .gauge{width:116px;height:116px;flex:none}
.res-head .gauge .v b{font-size:36px;color:#fff}
.res-head .gauge .v small{color:#c9d3ee;font-size:12px}
.res-head .txt{display:flex;flex-direction:column;gap:6px}
.res-head .txt .big{font-size:22px;font-weight:800;line-height:1.2}
.res-head .txt .sm{font-size:14px;color:#c9d3ee}
.review{list-style:none;margin:0;padding:0;background:#fff;border:1px solid #e3e8f4;border-radius:20px;overflow:hidden}
.review li{border-bottom:1px solid #e3e8f4}
.review li:last-child{border-bottom:0}
.review .row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:start;font-family:inherit;font-size:15px;color:#0d1b3d;cursor:pointer}
.review li.bad .row{background:#fff8f7}
.review .ic{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.review li.ok .ic{background:#e7f6ed;color:#146c3a}
.review li.bad .ic{background:#fdecea;color:#b42318}
.review .row .more{font-size:13px;font-weight:700;color:#0e2a6b;white-space:nowrap}
.review .det{display:none;padding:0 14px 14px;font-size:14.5px;line-height:1.6;color:#4a5578}
.review li.open .det{display:block}
.review .det .opts{padding:8px 0 0}
.review .det .opt{min-height:40px;font-size:14px;cursor:default;box-shadow:none}
.rv-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;max-width:1120px;margin:0 auto;width:100%}
.rv-head h2{margin:0;font-size:18px;font-weight:800}
.rv-head span{font-size:13px;color:#4a5578}
.rv-list{padding:10px 18px 0;max-width:1120px;margin:0 auto;width:100%}

/* ---- סימולציה ---- */
.seg{padding:0 6px;display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:4px}
.seg i{height:8px;border-radius:99px;background:rgba(255,255,255,.2);display:block}
.seg i.a{background:#e5c76a}.seg i.cur{background:#fff}.seg i.f{background:#d92d20}
.timer{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:#e5c76a;color:#0d1b3d;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{background:#d92d20;color:#fff}
.sim-q{margin:14px 18px 0;background:#fff;border:1px solid #e3e8f4;border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.55;white-space:pre-line}
.sim-q .src{display:block;margin-bottom:6px}
.sim-foot{padding:12px 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;max-width:1120px;margin:0 auto;width:100%}
.sq{flex:none;width:54px;height:54px;border-radius:16px;border:2px solid #e3e8f4;background:#fff;color:#0e2a6b;box-shadow:0 3px 0 #e3e8f4;display:grid;place-items:center;cursor:pointer}
.sq.on{border-color:#d92d20;color:#d92d20;background:#fdecea}
.sq:disabled{opacity:.4;cursor:default}
.sim-foot .btn-p{height:56px;font-size:18px}
.qgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.qgrid button{height:40px;border-radius:10px;border:1px solid #e3e8f4;background:#f4f7fe;color:#4a5578;font-weight:700;cursor:pointer}
.qgrid button.a{background:#e5c76a;color:#0d1b3d;border:0}
.qgrid button.cur{border:2px solid #0e2a6b;background:#fff;color:#0e2a6b;font-weight:800}
.qgrid button.f{outline:2px solid #d92d20;outline-offset:-2px}

/* ---- שתי עמודות במחשב ---- */
.cols{max-width:1120px;margin:0 auto;padding:0 20px;width:100%;flex:1 1 auto;display:flex;flex-direction:column;gap:16px}
.cols > .main{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.cols > .main > .foot{padding-left:0;padding-right:0}
.aside{display:none}
.aside .box{background:#fff;border:1px solid #e3e8f4;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(14,42,107,.08)}
.aside .box h3{margin:0;font-size:13px;font-weight:800;color:#4a5578}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.steplist li{display:flex;align-items:center;gap:10px;color:#4a5578}
.steplist li.cur{color:#0d1b3d;font-weight:700}
.steplist .k{width:24px;height:24px;border-radius:8px;background:#eef1f8;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.steplist li.done .k{background:#1f9d55;color:#fff}
.steplist li.cur .k{background:#0e2a6b;color:#e5c76a;font-weight:800}
.lfoot{text-align:center;font-size:12.5px;color:#4a5578;padding:16px;border-top:1px solid #e3e8f4;margin-top:auto}
.lfoot a{color:#4a5578}

@media(min-width:900px){
  .band{border-radius:0 0 40px 40px}
  .bar-row{min-height:68px}
  .bar-row .ctx{display:inline}
  .bar-row .logo{width:30px;height:36px}
  .track{height:14px;padding:3px}
  .kard h2{font-size:34px}
  .kard p{font-size:20px}
  .kard{min-height:420px}
  .kard .top{height:auto;min-height:200px}
  .deck-wrap,.case-wrap{margin-top:0;padding-top:0}
  .cols{flex-direction:row;align-items:flex-start;gap:28px;margin-top:-130px;position:relative;z-index:3}
  .cols > .main{flex:999 1 560px;min-width:0}
  .aside{display:block;flex:1 1 280px;position:sticky;top:20px}
  .band.tall{padding-bottom:150px}
  .band.mid{padding-bottom:90px}
  .q-band h1{font-size:30px;max-width:820px}
  .opts{padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .opt{min-height:92px;padding:14px 18px;border-radius:20px;font-size:18px}
  .sheet{margin-top:0;border-radius:24px;border-top-width:4px;box-shadow:0 14px 36px rgba(14,42,107,.12);padding-bottom:22px}
  .sheet img{position:static;width:60px;height:60px}
  .sheet .lead{padding-left:0}
  .sheet .head{display:flex;align-items:center;gap:12px}
  .foot{flex-direction:row;justify-content:flex-end}
  .foot .btn-p,.foot .btn-s,.foot .btn-o{width:auto;padding:0 52px}
  .foot.two{display:flex}
  .map{padding-bottom:40px}
  .map-nav{position:static;display:none}
  .map-cols{display:flex;gap:24px;align-items:flex-start;max-width:1120px;margin:-80px auto 0;padding:0 24px;position:relative;z-index:3}
  .map-cols .map{margin:0;padding:26px 28px;background:#fff;border:1px solid #e3e8f4;border-radius:28px;box-shadow:0 16px 40px rgba(14,42,107,.12);flex:999 1 560px}
  .map-cols .practice{display:flex;flex-direction:column;gap:14px;flex:1 1 300px}
  .practice .pc{border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:8px;text-decoration:none;cursor:pointer;border:0;text-align:start;font-family:inherit}
  .practice .pc.p{background:#0e2a6b;color:#fff;box-shadow:0 5px 0 #0d1b3d,0 16px 40px rgba(14,42,107,.18)}
  .practice .pc.s{background:#fff;color:#0d1b3d;border:2px solid #e3e8f4;box-shadow:0 5px 0 #e3e8f4}
  .practice .pc .r{display:flex;align-items:center;justify-content:space-between}
  .practice .pc .r b{font-size:20px;font-weight:800}
  .practice .pc.s .r b{color:#0e2a6b}
  .practice .pc small{font-size:14px;color:#c9d3ee}
  .practice .pc.s small{color:#4a5578}
  .band.map-band{padding-bottom:110px}
  .map-head h1{font-size:38px}
  .map-track{height:16px;max-width:560px}
  .path{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .path::before{display:none}
  .node{padding:12px;border-radius:18px;background:#f4f7fe}
  .node .dot{width:48px;height:48px}
  .node.next{background:#fff;border:2px solid #0e2a6b;box-shadow:0 4px 0 #0e2a6b}
  .node.next .lbl{background:none;border:0;box-shadow:none;padding:0}
  .node.locked{border:1px dashed #c9d2e8;background:transparent}
  .chap-t{grid-column:1/-1}
  .flash{min-height:400px}
  .flash .big{font-size:38px}
  .done-main{margin-top:-96px}
  .res-head .gauge{width:150px;height:150px}
  .sim-q{font-size:18px;padding:26px 30px;border-radius:24px}
  .sim-foot{display:none}
  .seg{display:none}
  .sheet-m{display:none}
  .sheet-wrap{margin-top:16px;padding:0}
}
