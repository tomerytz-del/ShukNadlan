<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משרד תיווך | שוק נדל״ן</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/quality-badge.js"></script>
<script src="assets/specialties.js"></script>
<style>
  /* ---------- ערכת הצבעים של המשרד ----------
     ארבעת ה־brand tokens למטה הם היחידים שדף הניהול דורס (setProperty על :root)
     לפי הצבעים שמנהל המשרד בחר. כל שאר המשתנים נגזרים מהם, כך שהחלפת ערכה
     צובעת את הדף כולו — לא רק את הכותרת. */
  :root{
    --brand:#1C3A5E; --brand-dark:#122840; --accent:#8B2332; --accent-dark:#6B1A26;
    --ink:#1B1F26; --ink-soft:#565C63; --paper:#DEDCD6; --paper-raised:#F4F3F0; --line:#C5C3BC;
    /* נפילה־לאחור לדפדפנים בלי color-mix: גוונים ניטרליים במקום גוון המותג */
    --teal-tint:#E0E7ED; --gold-tint:#F1DFE1;
    /* צבע הטקסט שיושב על גבי --brand; נדרס ל-כהה אם המשרד בחר גוון בהיר */
    --on-brand:#fff;
    /* אותו עיקרון לצבע המשני: טקסט שיושב על גבי --accent */
    --on-accent:#fff;
    /* ‏--accent-ink הוא הצבע המשני כטקסט על משטח בהיר. הוא נגזר ב-JS ונסוג
       ל-‎--brand-dark‎ כשהמשרד בחר אקסנט בהיר מדי — מחיר בכרטיס נכס חייב
       להיקרא, גם במחיר של ויתור על הגוון שנבחר. */
    --accent-ink:var(--accent-dark);
    /* האקסנט כתגית שמונחת על תמונה: חצי־שקוף איפה שיש color-mix, אטום אחרת */
    --accent-veil:var(--accent);
    --teal:var(--brand); --teal-dark:var(--brand-dark); --gold:var(--accent); --gold-dark:var(--accent-dark);
    --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --shadow-sm:0 2px 8px rgba(15,52,53,.08); --maxw:1000px;

    /* ====== שכבת העיצוב 2026 ======
       אותה שכבה שדף הנכס מקבל: משטחים בהירים, קווי הפרדה דקיקים וצללים רכים.
       הפריסה, הרדיוסים ועוצמת הצללים זהים בכל המשרדים — זה השלד המשותף של
       המרקטפלייס. מה שכן נגזר מ-var(--brand) הוא הטמפרטורה: המשטח המשני
       והצללים מקבלים את גוון המותג, כך שערכה חמה לא נשארת עם צללים כחלחלים.
       ‏--surface נדרס אם המשרד הגדיר paper_raised משלו, כדי לא לשבור ערכה
       כהה שנבחרה בכוונה. */
    --surface:#FFFFFF; --surface-soft:#FBFAF9;
    --hair:#E6E3DD; --hair-strong:#D8D4CC;
    --radius-xl:24px;
    /* ‏--veil-ink הוא ה"שחור" של הדף: הבסיס לצללים, לשכבת הכהות מעל תמונת
       הנושא ולתגיות שיושבות על תמונות. בלי color-mix הוא נשאר שחור נקי. */
    --veil-ink:#000;
    --shadow-xs:0 1px 2px rgba(18,40,64,.05);
    --shadow-md:0 8px 24px rgba(18,40,64,.10);
    --brand-veil:rgba(18,40,64,.62);
    --cover-veil-strong:rgba(0,0,0,.45); --cover-veil-soft:rgba(0,0,0,.05);
  }
  @supports (color: color-mix(in srgb, red 50%, white)){
    :root{
      --teal-tint:color-mix(in srgb, var(--brand) 14%, #fff);
      --gold-tint:color-mix(in srgb, var(--accent) 14%, #fff);
      --accent-veil:color-mix(in srgb, var(--accent) 84%, transparent);

      /* ‏--surface-soft נגזר מ---surface (ולא מלבן קבוע), ולכן הוא ממשיך לעבוד
         גם כשהמשרד הגדיר רקע כרטיסים משלו. */
      --surface-soft:color-mix(in srgb, var(--brand) 4%, var(--surface));
      /* שחור מעורבב בגוון הראשי הכהה — תמיד כהה יותר מ---brand-dark עצמו,
         ולכן שכבת הכהות מעל תמונת הנושא נשארת קריאה גם בערכה בהירה. */
      --veil-ink:color-mix(in srgb, var(--brand-dark) 55%, #000);
      /* אותן עוצמות צל כמו קודם (5%/8%/10% של נייבי) — רק הגוון משתנה */
      --shadow-xs:0 1px 2px color-mix(in srgb, var(--veil-ink) 6%, transparent);
      --shadow-sm:0 2px 8px color-mix(in srgb, var(--veil-ink) 9%, transparent);
      --shadow-md:0 8px 24px color-mix(in srgb, var(--veil-ink) 12%, transparent);
      --brand-veil:color-mix(in srgb, var(--veil-ink) 62%, transparent);
      --cover-veil-strong:color-mix(in srgb, var(--veil-ink) 45%, transparent);
      --cover-veil-soft:color-mix(in srgb, var(--veil-ink) 5%, transparent);
    }
  }
  *{box-sizing:border-box}
  /* אלמנטים רבים בדף נכבים ונדלקים דרך ‎[hidden]‎ ומקבלים display מהמחלקה
     שלהם — ‎display:flex‎ במחלקה גובר על ‎[hidden]‎ של הדפדפן */
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,.display{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--teal-dark);margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none}
  svg{display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}
  .card{background:var(--paper-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-xl);box-shadow:var(--shadow-xs)}
  /* הכותרת היא של הפלטפורמה, לא של המשרד — לכן צבעיה קבועים ולא נגזרים
     מ-var(--brand), אחרת המיתוג של "שוק נדל״ן" היה מתחלף בין משרד למשרד. */
  header.site{background:#F4F3F0;border-bottom:1px solid #C5C3BC;padding:14px 0}
  .header-inner{display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px;min-width:0}
  .logo-img{height:46px;width:46px;display:block;flex:0 0 auto;border-radius:50%}
  .logo-word{
    font-family:'Rubik','Heebo',sans-serif;font-weight:500;color:#122840;
    font-size:.82rem;line-height:1.3;letter-spacing:-.012em;min-width:0;text-align:center;
  }
  .logo-word span{color:#6B1A26;font-weight:700}
  @media(min-width:900px){
    .logo-img{height:54px;width:54px}
    .logo-word{font-size:.95rem;white-space:nowrap}
  }
  .back-link{font-size:.85rem;font-weight:700;color:#1C3A5E}

  #loadingState,#notFoundState{padding:60px 18px;text-align:center;color:var(--ink-soft)}
  #notFoundState{display:none}
  #agencyContent{display:none}

  /* הקו התחתון בצבע המשני הוא ההופעה הראשונה של האקסנט בדף — הוא חוצה את כל
     רוחב המסך מעל הקיפול, ולכן ערכה מתחלפת נראית מיד ולא רק בלוגו. */
  .cover{
    height:170px;background:linear-gradient(120deg,var(--brand-dark),var(--brand));position:relative;
    border-bottom:4px solid var(--accent);
  }
  /* עם תמונת נושא: התמונה ממלאת את הרצועה, ומעליה שכבת כהות בגוון המותג כדי
     שהלוגו והשם שנשענים על הקצה התחתון יישארו קריאים על כל תמונה. */
  .cover.has-image{height:240px;background-size:cover;background-position:center}
  .cover.has-image::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--cover-veil-strong),var(--cover-veil-soft) 55%)}
  @media(max-width:640px){.cover{height:130px}.cover.has-image{height:165px}}

  /* ---------- כרטיס הזהות של המשרד ----------
     עד כה ראש הדף היה טקסט חשוף על רקע הנייר: שם, מוטו ושורת תיאור אחת,
     בלי דבר שיאסוף אותם. עכשיו הכל יושב בכרטיס אחד שנשען על רצועת הנושא —
     הוא נותן לראש הדף רקע משלו ומפריד אותו משאר המקטעים.

     הכרטיס מחזיק את המינימום שדרוש כדי להחליט אם להתקשר: שם, מוטו, דירוג,
     תחומי התמחות, אזורי פעילות ושני כפתורי פנייה. כל מה שאפשר לקרוא מטה
     בדף — מספר הנכסים, מספר העסקאות, מניין הסוכנים — ירד מכאן: הוא הופיע
     ממילא בכותרות המקטעים, וכפילות שדוחפת את נבחרת המתווכים מתחת לקיפול
     עולה יותר משהיא מוסיפה.

     הרקע נגזר מגוון המותג ולא קבוע — משרד שבחר ערכה חמה מקבל כרטיס חמים,
     ובדפדפן בלי color-mix הוא נסוג למשטח הרגיל בלי לאבד קריאות. */
  .hero{
    position:relative;margin-top:16px;padding:16px 16px 18px;
    border:1px solid var(--hair);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);
    background:
      radial-gradient(120% 150% at 100% 0%, var(--teal-tint), transparent 58%),
      linear-gradient(180deg, var(--surface), var(--surface-soft));
    /* רצועת האקסנט בראש הכרטיס ממשיכה את הקו שמתחת לתמונת הנושא */
    border-top:3px solid var(--accent);
  }
  @media(min-width:900px){
    .hero{
      padding:20px 24px 22px;
      display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;
    }
  }
  /* משרד בלי טלפון לא מייצר עמודת כפתורים — ולכן גם לא רווח ריק לצדה */
  @supports selector(:has(*)){
    @media(min-width:900px){.hero:has(.brand-cta:empty){grid-template-columns:minmax(0,1fr)}}
  }
  .hero-main{min-width:0}

  /* רק הלוגו נכנס אל תוך רצועת הנושא; שם המשרד יושב כולו על רקע הכרטיס,
     אחרת טקסט כהה על גבי תמונת נושא כהה היה בלתי קריא. */
  .brand-strip{display:flex;align-items:flex-start;gap:16px;position:relative;z-index:1}
  .brand-id{min-width:0}
  /* תו האיכות של המשרד — בקצה השני של שורת השם והלוגו, בגובה השם */
  .brand-badge{margin-inline-start:auto;flex:0 0 auto;padding-top:4px}
  @media(max-width:560px){
    .brand-badge .qb-badge img{width:50px!important;height:50px!important}
    .brand-badge .qb-label{display:none}
    /* במסך צר התו גזל מהשם ומהמוטו את הרוחב ודחף אותם לשתי שורות מיותרות.
       הפתרון הוא לא להוריד אותו למטה אלא להחליף את סדר השורות: הלוגו והתו
       חולקים את השורה העליונה (אחד בכל קצה), והשם מקבל את כל הרוחב מתחתיהם. */
    .brand-strip{flex-wrap:wrap}
    .brand-logo{order:1}
    .brand-badge{order:2;padding-top:0}
    .brand-id{order:3;flex:1 0 100%;margin-top:4px}
  }
  .brand-logo{
    width:104px;height:104px;margin-top:-44px;border-radius:24px;flex-shrink:0;overflow:hidden;
    background:linear-gradient(155deg,var(--accent),var(--brand) 65%);
    border:4px solid var(--surface);box-shadow:var(--shadow-md);
    display:flex;align-items:center;justify-content:center;
    color:var(--on-brand);font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:2.3rem;
  }
  @media(max-width:560px){.brand-logo{width:88px;height:88px;margin-top:-38px;font-size:2rem}}
  .brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
  /* שם המשרד הוא הכותרת הראשית של הדף ומודד את עצמו מול שם האתר שמעליו —
     בגודל הקודם הוא נקרא כשורת מידע ולא ככותרת. */
  .brand-name{font-size:1.9rem;line-height:1.2;letter-spacing:-.015em}
  @media(min-width:640px){.brand-name{font-size:2.4rem}}
  /* המוטו יושב בין השם לדירוג ובגופן הכותרות — הוא אמירה של המשרד ולא עוד
     שורת מידע, ולכן הוא לא מקבל את הצבע האפור של הטקסט המשני. */
  .brand-tagline{
    font-family:'Frank Ruhl Libre',serif;font-size:1.1rem;font-weight:500;font-style:italic;
    color:var(--brand);margin:7px 0 0;max-width:46ch;line-height:1.4;
  }
  @media(min-width:640px){.brand-tagline{font-size:1.3rem}}

  /* ---------- דירוג המשרד בראש הדף ----------
     הדירוג היה קבור במקטע הביקורות בתחתית הדף. בראש הדף הוא הדבר הראשון
     שלקוח מחפש, ולחיצה עליו מגלגלת אל הביקורות עצמן. */
  .hero-rating{display:inline-flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .hero-rating:hover .hr-count{text-decoration:underline}
  .hr-stars{display:inline-flex;gap:1px;color:var(--accent-ink)}
  .hr-stars span{display:flex}
  /* כוכב מלא הוא צורה ולא קו — הכוכבים החסרים נשארים מתאר בלבד, וכך העין
     סופרת אותם במבט אחד בלי לקרוא את המספר */
  .hr-stars svg{width:16px;height:16px;fill:currentColor}
  .hr-stars .off svg{fill:none;opacity:.34}
  .hr-score{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:1.15rem;color:var(--brand-dark)}
  .hr-count{font-size:.82rem;color:var(--ink-soft)}

  /* ---------- שורות התגיות ----------
     שתי שאלות שונות ולכן שתי שורות: "במה המשרד מתמחה" ו"איפה הוא פועל".
     התווית הקטנה בצד מונעת את הקריאה השגויה שבה קרקעות ועפולה נראים
     כאותו סוג מידע. */
  .hero-tags{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}
  .tags-label{
    font-size:.68rem;font-weight:800;letter-spacing:.04em;color:var(--ink-soft);
    text-transform:uppercase;flex:0 0 auto;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
  /* הקפסולות דחוסות דיין ששתי שורות מספיקות לארבע תגיות גם במסך צר —
     שלוש שורות של תגיות דחפו את כפתורי הפנייה מתחת לקיפול */
  .spec-chip,.area-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;
    padding:5px 10px;border-radius:999px;line-height:1.2;
  }
  .spec-chip svg,.area-chip svg{width:13px;height:13px;flex:none}
  /* התמחויות בגוון המשני — הן ההבטחה המקצועית של המשרד; אזורי פעילות
     בגוון הראשי, כמידע גאוגרפי שקט יותר */
  .spec-chip{background:var(--gold-tint);color:var(--accent-ink);border:1px solid var(--accent)}
  .area-chip{background:var(--teal-tint);color:var(--brand-dark);border:1px solid transparent}

  /* ---------- יצירת קשר עם המשרד ----------
     עד כה דף המשרד היה קטלוג בלבד — אפשר היה לראות נכסים ולא לפנות לאיש.
     שני הכפתורים כאן צבועים בצבעי המשרד (ולא בירוק של וואטסאפ) בכוונה: זו
     הפעולה הבולטת ביותר בדף, ולכן המקום שבו הערכה שנבחרה נראית הכי חזק.
     הבלוק נוצר רק כשיש טלפון אמיתי מאחוריו, ולכן ‎:empty‎ מכבה אותו. */
  .brand-cta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px;max-width:460px}
  .brand-cta:empty{display:none}
  @media(min-width:640px){.brand-cta{grid-template-columns:auto auto;justify-content:start}}
  /* בעמודה שלצד הזהות הם נערמים ומתיישרים לרוחב אחיד */
  @media(min-width:900px){.brand-cta{grid-template-columns:1fr;width:236px;max-width:none;margin-top:0}}
  .brand-cta a{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 24px;border-radius:999px;font-weight:800;font-size:1rem;line-height:1;
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease;
  }
  .brand-cta svg{width:19px;height:19px;flex:none}
  .cta-primary{background:linear-gradient(120deg,var(--brand-dark),var(--brand));color:var(--on-brand);box-shadow:var(--shadow-md)}
  .cta-primary:hover{transform:translateY(-1px)}
  .cta-primary svg{fill:currentColor;stroke:none;width:19px;height:19px}
  .cta-secondary{background:var(--gold-tint);color:var(--accent-ink);border:1px solid var(--accent)}
  .cta-secondary:hover{background:var(--accent);color:var(--on-accent)}
  @media(max-width:420px){.brand-cta a{padding-inline:12px;font-size:.86rem;gap:6px}}

  /* ---------- כותרת מקטע ----------
     מקל קצר בצבע המשני לפני הכותרת, ולצידה שורת מידע קטנה (כמה נכסים, כמה
     תמונות, איזה דירוג). זו הכותרת של כל מקטעי הדף — הגלריה, הנבחרת,
     הנכסים, הביקורות — כדי שכולם ייקראו כרצף אחד ולא כארבעה עיצובים. */
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .sec-head h2{font-size:1.05rem;position:relative;padding-inline-start:12px}
  .sec-head h2::before{
    content:'';position:absolute;inset-block:3px;inset-inline-start:0;
    width:4px;border-radius:2px;background:var(--accent);
  }
  .sec-head span{font-size:.78rem;color:var(--ink-soft)}

  /* ---------- נבחרת המתווכים ----------
     המקטע הראשון מתחת לכותרת המשרד: אנשים, לא מספרים. הקרוסלה גוללת
     במגע ובחיצים, ומנהל/ת המשרד היא הכרטיס הבולט בה — כרטיס רחב יותר,
     טבעת בצבע המשני ותגית תפקיד — ולכן גם הכרטיס הראשון ברצף. */
  .team-sec{margin-top:26px;display:none}
  /* ---------- רצועה נגללת ----------
     ‏overflow-x גולל, scroll-snap ממרכז כרטיס — כך שגלילה במגע נעצרת על
     כרטיס שלם ולא באמצע אחד. הפדינג האנכי משאיר מקום להרמה ב-hover ולצל.
     ‏‎.rail‎ משותפת לרצועת המתווכים ולרצועות הנכסים. */
  .rail{
    --rail-gap:12px;
    display:flex;gap:var(--rail-gap);overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    /* הפדינג האנכי הוא בדיוק מה שההרמה ב-hover והצל צריכים ולא יותר, כדי
       שלא ייווצר רווח לבן בין רצועה לרצועה */
    padding:6px 2px 10px;scrollbar-width:none;-ms-overflow-style:none;
  }
  .rail::-webkit-scrollbar{display:none}
  /* רצועה שאין בה מה לגלול לא תיראה כרצועה קטועה בקצה — הכרטיסים מתמרכזים */
  .rail.no-scroll{justify-content:center;flex-wrap:wrap}
  /* תגית "מנהל/ת המשרד" חורגת מעל שפת הכרטיס וזקוקה למקום מעליה */
  .team-rail{padding-top:18px}
  .team-card{
    flex:0 0 196px;scroll-snap-align:center;position:relative;text-align:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--hair);border-radius:20px;
    padding:18px 14px 14px;box-shadow:var(--shadow-xs);
    display:flex;flex-direction:column;align-items:center;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .team-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
  .team-card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  /* כרטיס מנהל/ת המשרד: רחב יותר, נושא את גוון האקסנט מלמעלה ומקבל תגית
     תפקיד שיושבת על שפת הכרטיס — הבולטוּת נעשית בשלושה סימנים ולא באחד,
     כדי שתישמר גם כשהמשרד בחר אקסנט חיוור. */
  .team-card.is-manager{
    flex-basis:224px;border-color:var(--accent);box-shadow:var(--shadow-md);
    background:linear-gradient(180deg,var(--gold-tint) 0%,var(--surface) 46%);
  }
  /* התגית חורגת מעל שפת הכרטיס — הפדינג העליון של הרצועה מפנה לה מקום כדי
     שגלילה אופקית לא תחתוך אותה */
  .team-flag{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:var(--on-accent);font-size:.66rem;font-weight:800;
    padding:3px 11px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow-sm);
    display:inline-flex;align-items:center;gap:4px;
  }
  .team-flag svg{width:11px;height:11px}
  .team-avatar{
    width:88px;height:88px;border-radius:50%;overflow:hidden;flex:none;
    background:var(--brand);color:var(--on-brand);box-shadow:0 0 0 2px var(--hair);
    display:flex;align-items:center;justify-content:center;
    font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1.9rem;
  }
  .team-avatar img{width:100%;height:100%;object-fit:cover;display:block;object-position:var(--photo-pos,50% 25%)}
  .team-card.is-manager .team-avatar{width:104px;height:104px;font-size:2.2rem;box-shadow:0 0 0 3px var(--accent)}
  .team-name{font-weight:800;font-size:.97rem;color:var(--teal-dark);margin-top:11px;line-height:1.25}
  .team-card.is-manager .team-name{font-size:1.06rem}
  .team-role{font-size:.76rem;color:var(--ink-soft);margin-top:1px}
  .team-lic{
    display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:.68rem;font-weight:700;
    background:var(--teal-tint);color:var(--brand-dark);padding:2px 8px;border-radius:999px;
  }
  .team-lic svg{width:11px;height:11px}
  .team-badge{margin-top:8px;display:flex;justify-content:center}
  /* הפעולות נדחפות לתחתית הכרטיס כדי שכל הכרטיסים ברצועה יסתיימו באותו קו,
     גם כשלאחד/ת יש רישיון ולאחר/ת אין */
  .team-actions{display:flex;gap:6px;margin-top:auto;padding-top:12px;width:100%}
  .team-actions a{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:8px 6px;border-radius:999px;font-size:.78rem;font-weight:800;line-height:1;
    transition:background .15s ease,color .15s ease;
  }
  .team-actions svg{width:15px;height:15px;flex:none}
  .ta-wa{background:linear-gradient(120deg,var(--brand-dark),var(--brand));color:var(--on-brand)}
  .ta-wa svg{fill:currentColor;stroke:none;width:16px;height:16px}
  .ta-tel{background:var(--gold-tint);color:var(--accent-ink);border:1px solid var(--accent)}
  .ta-tel:hover{background:var(--accent);color:var(--on-accent)}
  /* ---------- חיצים ונקודות של רצועה ----------
     אותה בקרה משרתת את רצועת המתווכים ואת שלוש רצועות הנכסים, כדי שכל
     הגלילות בדף יתנהגו ויֵראו אותו דבר.
     ב-RTL ה"קודם" הוא לכיוון ההתחלה — ימין — ולכן המיקום לוגי
     (‏inset-inline) ולא ימין/שמאל פיזיים. */
  .rail-wrap{position:relative}
  .rail-nav{
    position:absolute;top:calc(50% - 8px);transform:translateY(-50%);width:36px;height:36px;
    border-radius:50%;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow-md);
    color:var(--brand-dark);display:grid;place-items:center;z-index:2;padding:0;
    transition:background .15s ease,opacity .15s ease;
  }
  .rail-nav:hover{background:var(--teal-tint)}
  .rail-nav[disabled]{opacity:.32;cursor:default}
  .rail-nav svg{width:19px;height:19px}
  .rail-nav.prev{inset-inline-start:-6px}
  .rail-nav.next{inset-inline-end:-6px}
  .rail-dots{display:flex;justify-content:center;gap:6px;margin-top:2px}
  .rail-dots button{
    width:7px;height:7px;padding:0;border-radius:999px;background:var(--hair-strong);
    transition:width .2s ease,background .2s ease;
  }
  .rail-dots button.on{width:20px;background:var(--accent)}

  /* ---------- גלריית המשרד ----------
     רשת Bento באותה שפה כמו גלריית הנכס: שתי תמונות גדולות ושלוש קטנות,
     ושכבת "‎+N‎" על האחרונה כשיש עוד. הפריסה נגזרת ממספר התמונות בפועל, כדי
     שמשרד עם תמונה אחת לא יקבל חצי שורה ריקה. */
  .gallery-sec{margin-top:30px;display:none}
  /* מובייל הוא ברירת המחדל והפריסה לשש עמודות חיה רק מ-640px ומעלה: כללי
     ה-data-count נושאים סלקטור נוסף, ולכן כמדיה־קוורי של max-width הם היו
     גוברים על כללי המובייל ומותחים את שתי התמונות הראשונות לרוחב מלא. */
  .bento{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .bento-cell{
    position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--hair);
    background:var(--surface-soft);padding:0;line-height:0;cursor:pointer;aspect-ratio:1/1;
  }
  .bento-cell:nth-child(1){grid-column:span 2;aspect-ratio:16/10}
  .bento-cell img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
  .bento-cell:hover img{transform:scale(1.045)}
  .bento-cell:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  @media(min-width:640px){
    .bento{grid-template-columns:repeat(6,1fr)}
    .bento-cell,.bento-cell:nth-child(1){grid-column:span 2;aspect-ratio:4/3}
    .bento[data-count="1"] .bento-cell{grid-column:span 6;aspect-ratio:16/9}
    .bento[data-count="2"] .bento-cell,
    .bento[data-count="4"] .bento-cell{grid-column:span 3;aspect-ratio:16/10}
    .bento[data-count="5"] .bento-cell:nth-child(-n+2){grid-column:span 3;aspect-ratio:16/10}
  }
  .bento-cell .cap{
    position:absolute;inset:auto 0 0 0;background:linear-gradient(to top,rgba(10,18,30,.78),transparent);
    color:#fff;font-size:.74rem;font-weight:600;padding:18px 10px 8px;line-height:1.3;text-align:start;
  }
  .more-overlay{
    position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,18,30,.55);
    color:#fff;font-weight:800;font-size:1.05rem;backdrop-filter:blur(2px);
  }

  /* ---------- מקטע הנכסים ----------
     החיפוש והמעבר בין נכסים פעילים לעסקאות שנסגרו יושבים יחד: שניהם עונים
     על אותה שאלה — מה המשרד הזה מוכר. */
  .props-sec{margin-top:30px}

  /* ---------- טאבים ----------
     בקרת מקטעים בקפסולה במקום קו תחתון: הטאב הפעיל נצבע בצבע המשרד, וזה
     המקום שבו המיתוג האישי שלו באמת נראה. */
  /* שני הטאבים חולקים את מלוא רוחב הדף בחלקים שווים, במובייל ובמחשב כאחד:
     כרצועה צרה בקצה הימני הם נראו כמו שובל של הכותרת שמעליהם ולא כמתג בין
     שני מצבים של הדף. ‏grid-auto-columns (ולא שתי עמודות קבועות) כדי שטאב
     שלישי, אם ייווסף, יתחלק איתם באותה מידה. */
  .tabs{
    display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;
    margin-bottom:16px;padding:6px;width:100%;
    background:var(--surface);border:1px solid var(--hair);border-radius:999px;
    box-shadow:var(--shadow-xs);
  }
  .tab-btn{
    padding:12px 10px;border-radius:999px;font-weight:700;font-size:.95rem;text-align:center;
    color:var(--ink-soft);background:none;white-space:nowrap;transition:background .15s ease,color .15s ease;
  }
  @media(max-width:380px){.tab-btn{font-size:.86rem;padding-inline:6px}}
  .tab-btn:hover{background:var(--teal-tint);color:var(--brand-dark)}
  .tab-btn.active{background:var(--brand);color:var(--on-brand)}
  .tab-btn.active:hover{background:var(--brand)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .prop-search{
    display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--hair);
    border-radius:999px;padding:4px 6px 4px 14px;box-shadow:var(--shadow-xs);margin-bottom:14px;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .prop-search:focus-within{border-color:var(--brand);box-shadow:var(--shadow-md)}
  .prop-search .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--ink-soft)}
  .prop-search .ic svg{width:18px;height:18px}
  .prop-search input{
    flex:1;min-width:0;border:none;background:none;padding:9px 0;font-size:.92rem;color:var(--ink);
  }
  .prop-search input:focus{outline:none}
  .prop-search input::-webkit-search-cancel-button{display:none}
  .prop-search .clear{
    width:28px;height:28px;flex:none;border-radius:50%;background:var(--surface-soft);
    color:var(--ink-soft);font-size:.8rem;display:grid;place-items:center;
  }
  .prop-search .clear:hover{background:var(--teal-tint);color:var(--brand-dark)}
  .search-count{font-size:.8rem;color:var(--ink-soft);margin:0 0 12px;font-weight:600}

  /* ---------- שלוש רצועות הנכסים ----------
     במקום רשימה אחת ארוכה שמערבבת דירה להשכרה עם חנות למכירה, הנכסים
     מחולקים לשלוש רצועות לפי מה שהגולש/ת באמת מחפש/ת: פרטי להשכרה, פרטי
     למכירה, ומסחרי (מכירה והשכרה יחד — שוק אחד). רצועה שאין לה נכסים
     פשוט לא נוצרת. */
  .prop-group{margin-top:18px}
  .prop-group:first-child{margin-top:6px}
  .group-head{display:flex;align-items:center;gap:9px}
  /* הקישור נדחף לקצה השני של שורת הכותרת ומופיע רק כשיש מה לפתוח */
  .group-all{
    margin-inline-start:auto;font-size:.78rem;font-weight:800;color:var(--accent-ink);
    background:none;padding:4px 2px;white-space:nowrap;
  }
  .group-all:hover{text-decoration:underline}
  .group-head .ic{
    width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:var(--teal-tint);color:var(--brand);
  }
  .group-head .ic svg{width:17px;height:17px}
  .group-head h3{
    font-family:'Frank Ruhl Libre',serif;font-size:1rem;font-weight:700;
    color:var(--teal-dark);margin:0;
  }
  .group-head .n{font-size:.75rem;font-weight:600;color:var(--ink-soft)}
  /* להשכרה ומסחרי נושאים את הצבע המשני — אותה הבחנה בדיוק שהתגית על אריח
     הנכס עושה, כך שהצבע אומר את אותו הדבר בכל מקום בדף */
  .prop-group[data-kind="rent"] .group-head .ic,
  .prop-group[data-kind="commercial"] .group-head .ic{background:var(--gold-tint);color:var(--accent-ink)}
  /* ---------- רוחב הכרטיס ברצועה ----------
     לכל היותר שלושה כרטיסים במסך אחד, והם ממלאים את רוחב המכל בדיוק:
     ‏3 כרטיסים + 2 רווחים = 100%. במסך צר שלושה כרטיסים היו יוצאים צרים
     מכדי לקרוא, ולכן שם הרצועה מציגה אחד ומציצה אל הבא — אותה משמעות,
     בקנה מידה של מובייל. ‏scroll-snap-align:start מצמיד את הכרטיס לשפת
     המכל, כך שכל "עמוד" של הרצועה יושב בתוך הגבולות ולא חוצה אותם. */
  .rail .prop-card{flex:0 0 82%;scroll-snap-align:start}
  @media(min-width:600px){.rail .prop-card{flex-basis:calc((100% - var(--rail-gap)) / 2)}}
  @media(min-width:900px){.rail .prop-card{flex-basis:calc((100% - 2 * var(--rail-gap)) / 3)}}

  /* ---------- "לכל הנכסים" ----------
     אין דף רשימה נפרד לנכסי משרד לפי קטגוריה, ולכן הקישור פותח את הרצועה
     במקום — הופך אותה לרשת שמציגה את כל הנכסים של אותה קטגוריה בבת אחת.
     במצב פתוח אין מה לגלול, ולכן החיצים והנקודות יורדים. */
  .prop-group.expanded .rail{
    display:grid;grid-template-columns:1fr;overflow:visible;scroll-snap-type:none;
  }
  @media(min-width:600px){.prop-group.expanded .rail{grid-template-columns:1fr 1fr}}
  @media(min-width:900px){.prop-group.expanded .rail{grid-template-columns:1fr 1fr 1fr}}
  .prop-group.expanded .rail .prop-card{flex:none}
  .prop-group.expanded .rail-nav,
  .prop-group.expanded .rail-dots{display:none}
  .prop-card{
    background:var(--surface);border:1px solid var(--hair);border-radius:18px;overflow:hidden;cursor:pointer;
    box-shadow:var(--shadow-xs);transition:box-shadow .15s ease,transform .15s ease;
  }
  .prop-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .prop-card .thumb{
    height:150px;position:relative;background-size:cover;background-position:center;
    background-image:linear-gradient(155deg,var(--accent),var(--brand));
  }
  /* הצללה בתחתית התמונה — בלעדיה תגיות המדיה השקופות נבלעות בתמונות בהירות */
  .prop-card .thumb::after{
    content:'';position:absolute;inset:auto 0 0 0;height:52%;pointer-events:none;
    background:linear-gradient(to top,rgba(10,18,30,.6),rgba(10,18,30,0));
  }
  /* ====== נכס שהתמונות שלו עוד לא הועלו ======
     לוגו המשרד + "תמונות של הנכס יעלו בקרוב" במקום מלבן צבע ריק. ההצללה
     התחתונה מבוטלת כאן: היא נועדה לתמונות אמיתיות, ועל רקע בהיר היא רק
     מלכלכת את ממלא המקום. */
  .prop-card .thumb.no-photo{background-image:none}
  .prop-card .thumb.no-photo::after{display:none}
  .thumb-fallback{
    position:absolute;inset:0;z-index:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;padding:12px;text-align:center;
    background:
      linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.36) 55%,rgba(255,255,255,.56)),
      url('assets/property-placeholder.jpg') center/cover no-repeat,
      linear-gradient(160deg,var(--surface-soft) 0%,var(--teal-tint) 100%);
  }
  .thumb-fallback .tf-logo{
    width:54px;height:54px;flex:0 0 auto;border-radius:14px;background:#fff;
    border:1px solid var(--hair);object-fit:contain;padding:5px;
    box-shadow:0 4px 14px rgba(18,40,64,.18);
  }
  .thumb-fallback .tf-initial{
    display:flex;align-items:center;justify-content:center;padding:0;border-color:transparent;
    background:linear-gradient(155deg,var(--accent),var(--brand) 65%);color:#fff;
    font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1.3rem;line-height:1;
  }
  .thumb-fallback .tf-agency{
    font-size:.78rem;font-weight:800;color:var(--brand-dark);line-height:1.25;
    max-width:100%;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .thumb-fallback .tf-note{font-size:.7rem;font-weight:600;color:var(--ink-soft);line-height:1.25}
  .card-tags{position:absolute;top:9px;inset-inline-start:9px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;max-width:80%}
  .card-tag{
    font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;line-height:1.35;
    background:var(--brand-veil);color:#fff;border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(8px);
  }
  .card-tag.rent{background:var(--accent-veil);color:var(--on-accent)}
  .card-media{position:absolute;bottom:9px;inset-inline-start:9px;z-index:2;display:flex;gap:5px;flex-wrap:wrap}
  .card-media span{
    display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;
    background:rgba(15,23,42,.58);color:#fff;border:1px solid rgba(255,255,255,.24);
    padding:4px 9px;border-radius:999px;backdrop-filter:blur(8px);
  }
  .card-media svg{width:12px;height:12px}
  .prop-card .body{padding:12px 13px 13px}
  /* המחיר הוא הדבר שהעין נעצרת עליו בכל אריח — ולכן הוא נושא את הצבע המשני.
     ‏--accent-ink כבר עבר בדיקת ניגודיות ב-JS מול רקע הכרטיס. */

  phone:   S('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.7 2Z"/>'),
};
// לוגו וואטסאפ הוא צורה מלאה ולא קו, ולכן הוא לא עובר דרך S()
const WA_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.6 14.2c-.2.7-1.2 1.3-1.9 1.4-.5.1-1.2.1-1.9-.1a13 13 0 0 1-5.6-4.6c-.6-.9-1-1.9-1-2.8 0-1 .5-1.7 1-2 .2-.2.4-.3.6-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2 0 .4-.1.5l-.4.5c-.1.2-.3.3-.1.6.5.9 1.1 1.6 2 2.2.3.2.5.2.7 0l.7-.8c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.2.4.4.1.2.1.7-.1 1.4Z"></path></svg>';

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function priceLabel(price, dealType){
  return dealType === 'rent' ? ('₪' + Number(price).toLocaleString('he-IL') + '/חוד׳') : ('₪' + Number(price).toLocaleString('he-IL'));
}

/* התמונה הראשית של הנכס; בלי תמונות מוצג ממלא מקום עם לוגו המשרד */
function thumbStyle(p){
  const img = safeImageUrl(p.images && p.images[0]);
  return img ? ` style="background-image:url('${encodeURI(img)}')"` : '';
}

const NO_PHOTOS_NOTE = 'תמונות של הנכס יעלו בקרוב';
const SITE_LOGO = 'assets/logo-shuknadlan.png';

/* המשרד שהעמוד מוקדש לו — נשמר כדי שאריח נכס בלי תמונות יוכל להציג את
   הלוגו והשם שלו. */
let currentAgency = null;

function thumbFallback(p){
  if (safeImageUrl(p.images && p.images[0])) return '';
  const name = (currentAgency && currentAgency.name) || '';
  const logo = (currentAgency && safeImageUrl(currentAgency.logo_url)) || (name ? '' : SITE_LOGO);
  const mark = logo
    ? `<img class="tf-logo" src="${escapeHtml(encodeURI(logo))}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.remove()">`
    : `<span class="tf-logo tf-initial" aria-hidden="true">${escapeHtml(name.trim()[0] || '?')}</span>`;
  return `<div class="thumb-fallback">
      ${mark}
      ${name ? `<span class="tf-agency">${escapeHtml(name)}</span>` : ''}
      <span class="tf-note">${NO_PHOTOS_NOTE}</span>
    </div>`;
}

/* ---------- שורות המידע של המקטעים ----------
   המספרים של המשרד (כמה נכסים, כמה סוכנים, איזה דירוג) כבר לא יושבים
   בקפסולות נפרדות אלא לצד כותרת המקטע שאליו הם שייכים. טוען שאין לו מה
   לדווח פשוט לא כותב כלום — שורת מידע ריקה גרועה משורה שאינה. */
function setSectionNote(id, text){
  const el = document.getElementById(id);
  if (el) el.textContent = text || '';
}

/* ---------- תחומי ההתמחות ----------
   מה שמנהל/ת המשרד סימן/ה ב-CRM גובר תמיד. משרד שעדיין לא סימן לא נשאר עם
   שורה ריקה: הנכסים שכבר עלו מספרים בעצמם במה הוא עוסק, והתגיות נגזרות
   מהם. הגזירה אינה מסומנת בדף — הערת "לפי הנכסים שבמשרד" תפסה שורה שלמה
   בכרטיס, וזה מחיר גבוה מדי להסתייגות שהלקוח ממילא לא צריך לעשות בה דבר.
   מי שרוצה שליטה מדויקת בתגיות מסמן אותן במסך המיתוג. */

/* בדף מוצגות עד ארבע תגיות גם כשהמשרד סימן שש: ארבע קפסולות הן בדיוק שתי
   שורות במסך צר, ומשם והלאה השורה השלישית דוחפת את כפתורי הפנייה מתחת
   לקיפול. הבחירה המלאה נשמרת — רק התצוגה נעצרת. */
const HERO_SPECS_SHOWN = 4;

function renderSpecialties(agency, properties){
  if (!window.Specialties) return;
  const row = document.getElementById('specsRow');
  const picked = Specialties.forAgency(agency, properties);
  if (!picked.ids.length){ row.hidden = true; return; }
  document.getElementById('brandSpecs').innerHTML =
    Specialties.chipsHtml(picked.ids.slice(0, HERO_SPECS_SHOWN));
  row.hidden = false;
}

/* חמישה כוכבים מלאים שהעמומים שבהם מסמנים את מה שחסר — חצי כוכב היה מדייק
   ולא מוסיף, וכאן הציון המספרי ממילא כתוב לצדם. */
function starsHtml(rating){
  const rounded = Math.round(rating);
  return `<span class="hr-stars">${[1,2,3,4,5]
    .map(i => `<span class="${i <= rounded ? '' : 'off'}">${ICON.star}</span>`).join('')}</span>`;
}

/* ---------- מיתוג המשרד ----------
   מנהל המשרד קובע ב-CRM צבעים, לוגו ותמונת נושא; כאן רק מיישמים. כל שדה
   אופציונלי — משרד שלא הגדיר דבר מקבל את עיצוב ברירת המחדל של הפלטפורמה. */
const HEX_RE = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;

// הצבעים מגיעים מ-DB שמנהל המשרד כותב אליו, ונכנסים ל-CSS — בלי הסינון הזה
// ערך כמו "red;background:url(...)" היה מוזרק כפשוטו אל תוך גיליון הסגנון.
function safeHex(value, fallback){
  return typeof value === 'string' && HEX_RE.test(value.trim()) ? value.trim() : fallback;
}

// בהירות יחסית (WCAG) — הבסיס לכל בדיקות הניגודיות בדף
function relLuminance(hex){
  const full = hex.length === 4 ? '#' + hex.slice(1).split('').map(c=>c+c).join('') : hex;
  return [1,3,5].map(i=>{
    const ch = parseInt(full.slice(i, i+2), 16) / 255;
    return ch <= 0.03928 ? ch/12.92 : Math.pow((ch+0.055)/1.055, 2.4);
  }).reduce((acc, ch, i)=> acc + [0.2126,0.7152,0.0722][i] * ch, 0);
}
function contrastBetween(a, b){
  const la = relLuminance(a), lb = relLuminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
// יחס הניגודיות בין צבע לבין לבן — קובע אם טקסט לבן עליו יהיה קריא
function contrastWithWhite(hex){
  return contrastBetween(hex, '#ffffff');
}

function safeImageUrl(url){
  if (typeof url !== 'string') return null;
  const trimmed = url.trim();
  return /^https:\/\//i.test(trimmed) ? trimmed : null;
}

function applyBranding(agency){
  const c = agency.colors || {};
  const root = document.documentElement.style;
  const brand = safeHex(c.primary, null);
  const accent = safeHex(c.accent, null);
  if (brand){
    root.setProperty('--brand', brand);
    root.setProperty('--brand-dark', safeHex(c.primary_dark, brand));
    // אם המשרד בחר גוון בהיר, טקסט לבן עליו לא יהיה קריא
    root.setProperty('--on-brand', contrastWithWhite(brand) >= 3.2 ? '#fff' : '#1B1F26');
  }
  if (accent){
    const accentDark = safeHex(c.accent_dark, accent);
    root.setProperty('--accent', accent);
    root.setProperty('--accent-dark', accentDark);
    root.setProperty('--on-accent', contrastWithWhite(accent) >= 3.2 ? '#fff' : '#1B1F26');
    /* ‏--accent-ink נושא טקסט ואייקונים קטנים (מחיר, כוכבים, אייקוני הקפסולות) על רקע
       הכרטיסים. אקסנט בהיר — צהוב, חול, ובוודאי לבן — נכשל שם בניגודיות,
       ולכן נבחר כאן הגוון הראשון שעובר 4.5:1: קודם המשני הכהה, אחריו המשני
       עצמו, ורק אם שניהם בהירים מדי נסוגים לצבע הראשי. */
    const surface = safeHex(c.paper_raised, '#FFFFFF');
    const brandDark = safeHex(c.primary_dark, safeHex(c.primary, '#122840'));
    const ink = [accentDark, accent, brandDark].find(hex => contrastBetween(hex, surface) >= 4.5) || '#1B1F26';
    root.setProperty('--accent-ink', ink);
  }
  if (safeHex(c.paper, null)) root.setProperty('--paper', c.paper.trim());
  // ‏paper_raised הוא צבע המשטחים שהמשרד בחר — הוא גובר גם על ‎--surface‎ של
  // השכבה החדשה, אחרת ערכה כהה שנבחרה בכוונה הייתה מקבלת כרטיסים לבנים.
  if (safeHex(c.paper_raised, null)){
    root.setProperty('--paper-raised', c.paper_raised.trim());
    root.setProperty('--surface', c.paper_raised.trim());
  }
  if (safeHex(c.line, null)){
    root.setProperty('--line', c.line.trim());
    root.setProperty('--hair', c.line.trim());
  }

  const cover = safeImageUrl(agency.cover_url);
  if (cover){
    const el = document.querySelector('.cover');
    el.classList.add('has-image');
    el.style.backgroundImage = `url("${encodeURI(cover)}")`;
  }

  const logo = safeImageUrl(agency.logo_url);
  const logoEl = document.getElementById('brandLogo');
  if (logo){
    const img = document.createElement('img');
    img.src = logo;
    img.alt = 'הלוגו של ' + agency.name;
    logoEl.textContent = '';
    logoEl.appendChild(img);
  } else {
    logoEl.textContent = agency.name[0];
  }
}

/* ---------- יצירת קשר עם המשרד ----------
   ל-agencies אין עמודת טלפון — המספר הפומבי היחיד שיש הוא של חברי הצוות
   (‏agency_members_public.phone_e164‎). לכן הפנייה מנותבת למנהל/ת המשרד, ואם
   אין להם מספר — לסוכן/ת הראשון/ה שיש לו. בלי מספר אמיתי הבלוק לא נוצר:
   כפתור שלא מוביל לאיש גרוע מהיעדר כפתור.
   ‏phone_e164 שמור כספרות בלבד (972521112222) — בדיוק מה ש-wa.me ו-tel:
   מצפים לו. הבדיקה כאן היא גם שער אבטחה: המספר נכנס ל-href. */
const PHONE_RE = /^\d{9,15}$/;
const hasPhone = m => PHONE_RE.test(String(m && m.phone_e164 || ''));

/* קישור וואטסאפ עם פתיח שכבר מספר מאיפה הפנייה הגיעה */
function waLink(phone, opener){
  const name = (currentAgency && currentAgency.name) || 'המשרד';
  const text = [
    'היי,',
    opener || `הגעתי לדף של ${name} בשוק הנדל״ן של עפולה והסביבה ואשמח לקבל פרטים.`,
    window.location.href,
  ].join('\n');
  return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
}

const ROLE_LABELS = { manager:'מנהל/ת משרד', agent:'סוכן/ת' };
const roleLabel = a => ROLE_LABELS[a && a.role] || (a && a.role) || 'סוכן/ת';

/* תמונת הסוכן/ת, ובהיעדרה האות הראשונה של השם. ‏--photo-pos = נקודת המיקוד
   שסומנה ב-CRM; בלעדיה חיתוך למרכז היה קוטע פנים בתמונות פורטרט. */
function agentAvatarHtml(a, cls){
  const name = a.display_name || '?';
  const photo = safeImageUrl(a.photo_url);
  const focus = /^\d{1,3}% \d{1,3}%$/.test(a.photo_position || '') ? a.photo_position : '';
  const inner = photo
    ? `<img src="${encodeURI(photo)}" alt="${escapeHtml(name)}" loading="lazy"${focus ? ` style="--photo-pos:${focus}"` : ''}>`
    : escapeHtml(name.trim()[0] || '?');
  return `<div class="${cls}">${inner}</div>`;
}

function renderAgencyContact(members){
  const reachable = (members || []).filter(hasPhone);
  if (!reachable.length) return;
  const contact = reachable.find(m => m.role === 'manager') || reachable[0];
  const phone = contact.phone_e164;
  const name = (currentAgency && currentAgency.name) || 'המשרד';
  const href = waLink(phone);

  document.getElementById('brandCta').innerHTML = `
    <a class="cta-primary" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer"
       aria-label="${escapeHtml('שליחת הודעת וואטסאפ ל' + name)}">${WA_SVG} וואטסאפ למשרד</a>
    <a class="cta-secondary" href="tel:+${phone}" aria-label="${escapeHtml('חיוג ל' + name)}">${ICON.phone} שיחה עם המשרד</a>`;
}

/* ---------- חותם הדף: פנייה למנהל/ת המשרד ----------
   כאן, בשונה מהכפתורים שבראש הדף, הפנייה נושאת פנים ושם. אם למנהל/ת אין
   מספר, המקטע נופל לסוכן/ת הראשון/ה שיש לו — עדיף איש קשר אמיתי בשם אחר
   מאשר מקטע שנפתח ולא מוביל לאיש. בלי מספר בכלל המקטע לא מוצג. */
function renderManagerContact(members){
  const list = members || [];
  const manager = list.find(m => m.role === 'manager' && hasPhone(m))
    || list.find(hasPhone);
  if (!manager) return;

  const name = manager.display_name || 'מנהל המשרד';
  const agencyName = (currentAgency && currentAgency.name) || 'המשרד';
  const isManager = manager.role === 'manager';
  const href = waLink(manager.phone_e164,
    `הגעתי לדף של ${agencyName} בשוק הנדל״ן של עפולה והסביבה ואשמח לדבר עם ${name}.`);

  document.getElementById('contactHeading').textContent =
    isManager ? 'יצירת קשר עם מנהל המשרד' : 'יצירת קשר עם המשרד';

  document.getElementById('contactCard').innerHTML = `
    ${agentAvatarHtml(manager, 'team-avatar')}
    <div class="contact-who">
      <div class="name">${escapeHtml(name)}</div>
      <div class="role">${escapeHtml(roleLabel(manager))} · ${escapeHtml(agencyName)}</div>
      <p class="note">מוזמנים לפנות בכל שאלה — על נכס מסוים, על הערכת שווי או על מכירה והשכרה בעפולה והעמק.</p>
    </div>
    <div class="contact-actions">
      <a class="cta-primary" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer"
         aria-label="${escapeHtml('שליחת הודעת וואטסאפ ל' + name)}">${WA_SVG} וואטסאפ ל${escapeHtml(name.split(' ')[0])}</a>
      <a class="cta-secondary" href="tel:+${manager.phone_e164}"
         aria-label="${escapeHtml('חיוג ל' + name)}">${ICON.phone} שיחת טלפון</a>
    </div>`;
  document.getElementById('contactSec').style.display = 'block';
}

/* ---------- גלריית המשרד (תמונות עסקאות/אירועים — לא נכסים) ----------
   מוצגות עד חמש תמונות ברשת; השאר נגישות דרך הלייטבוקס, שנפתח על התמונה
   הראשונה שלא נראית ברשת בלחיצה על שכבת ה-"‎+N‎". */
let galleryItems = [];
/* שתי שורות תמונות ותו לא. במסך רחב זה 2 גדולות + 3 קטנות; במסך צר הרשת היא
   שתי עמודות, ולכן חמש תמונות היו נערמות לשלוש שורות ודוחפות את הנכסים —
   שהם הסיבה שנכנסו לדף — אל מתחת לקיפול. */
const galleryVisibleCount = () =>
  (window.matchMedia && window.matchMedia('(min-width: 640px)').matches) ? 5 : 3;

function renderGallery(gallery){
  galleryItems = (Array.isArray(gallery) ? gallery : [])
    .map(item => ({ url: safeImageUrl(item && item.url), caption: (item && item.caption) || '' }))
    .filter(item => item.url);
  if (galleryItems.length === 0) return;

  const grid = document.getElementById('galleryBento');
  grid.textContent = '';
  const shown = Math.min(galleryItems.length, galleryVisibleCount());
  grid.setAttribute('data-count', String(shown));
  const rest = galleryItems.length - shown;

  galleryItems.slice(0, shown).forEach((item, i)=>{
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'bento-cell';
    cell.setAttribute('aria-label', item.caption || `תמונה ${i+1} מתוך ${galleryItems.length}`);
    const img = document.createElement('img');
    img.src = item.url;
    img.loading = i ? 'lazy' : 'eager';
    img.alt = item.caption || 'תמונה מהמשרד';
    cell.appendChild(img);
    // הכיתוב יורד מהתמונה האחרונה כשהיא נושאת את מונה השאר — שתי שכבות
    // כתוביות אחת על השנייה לא נקראות
    const carriesRest = (i === shown - 1 && rest > 0);
    if (item.caption && !carriesRest){
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = item.caption;
      cell.appendChild(cap);
    }
    if (carriesRest){
      const overlay = document.createElement('span');
      overlay.className = 'more-overlay';
      overlay.textContent = '+' + rest;
      cell.appendChild(overlay);
    }
    cell.addEventListener('click', ()=> openLightbox(carriesRest ? shown : i));
    grid.appendChild(cell);
  });

  document.getElementById('galleryCount').textContent = galleryItems.length + ' תמונות';
  document.getElementById('gallerySec').style.display = 'block';
}

let lightboxIndex = 0;
const lightboxEl = document.getElementById('lightbox');

function openLightbox(i){
  lightboxIndex = Math.min(Math.max(i, 0), galleryItems.length - 1);
  showLightboxImage();
  lightboxEl.classList.add('open');
  document.body.style.overflow = 'hidden'; // שלא ייגלל הדף מתחת לתמונה
}
function showLightboxImage(){
  const item = galleryItems[lightboxIndex];
  if (!item) return;
  document.getElementById('lbImage').src = item.url;
  document.getElementById('lbImage').alt = item.caption || '';
  document.getElementById('lbCaption').textContent = item.caption || '';
}
function stepLightbox(delta){
  if (galleryItems.length === 0) return;
  lightboxIndex = (lightboxIndex + delta + galleryItems.length) % galleryItems.length;
  showLightboxImage();
}
function closeLightbox(){
  lightboxEl.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', ()=> stepLightbox(-1));
document.getElementById('lbNext').addEventListener('click', ()=> stepLightbox(1));
lightboxEl.addEventListener('click', (e)=>{ if (e.target === lightboxEl) closeLightbox(); });
document.addEventListener('keydown', (e)=>{
  if (!lightboxEl.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  // ה-RTL הופך את משמעות החצים: "קדימה" בגלריה עברית הוא שמאלה
  if (e.key === 'ArrowLeft') stepLightbox(1);
  if (e.key === 'ArrowRight') stepLightbox(-1);
});

/* ---------- תו האיכות של המשרד ----------
   מנהל/ת המשרד מאשר/ת את הקוד האתי בשם המשרד ב-CRM. שני התאריכים נשמרים
   בשורת ה-agency, והתו מוצג רק כשיש אישור ואין הסרה — אותו תנאי בדיוק
   שה-view של הסוכנים מחשב בעצמו ב-has_ethics_badge. */
function agencyHasEthicsBadge(agency){
  return !!(agency && agency.ethics_code_accepted_at && !agency.ethics_badge_revoked_at);
}

function renderQualityBadge(agency){
  if (!agencyHasEthicsBadge(agency) || !window.QualityBadge) return;
  QualityBadge.mount('brandBadge', { size:'lg', label:true, subject: agency.name });
}

async function loadAgency(){
  const slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug || !window.supabase){
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  try{
    const { data: agency, error } = await sb.from('agencies').select('*').eq('slug', slug).single();
    if (error || !agency) throw error || new Error('not found');

    currentAgency = agency;
    document.title = agency.name + ' | שוק נדל״ן';
    document.getElementById('brandName').textContent = agency.name;
    const tagline = (agency.tagline || '').trim();
    const taglineEl = document.getElementById('brandTagline');
    taglineEl.textContent = tagline;
    taglineEl.hidden = !tagline;
    const areas = (agency.specialty_areas || []).filter(a => String(a || '').trim());
    document.getElementById('brandAreas').innerHTML = areas
      .map(a => `<span class="area-chip">${ICON.pin}${escapeHtml(a)}</span>`).join('');
    document.getElementById('areasRow').hidden = areas.length === 0;
    // התמחויות מוצהרות נכנסות מיד; משרד בלי הצהרה מקבל תגיות נגזרות אחרי
    // שהנכסים נטענים (loadActiveProperties קורא שוב עם הנכסים בידו)
    renderSpecialties(agency, null);
    applyBranding(agency);
    renderQualityBadge(agency);
    renderGallery(agency.gallery);

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('agencyContent').style.display = 'block';

    loadTeam(sb, agency.id);
    loadActiveProperties(sb, agency.id);
    loadSoldDeals(sb, agency.id);
    loadReviews(sb, agency.id);
  } catch(e){
    console.warn('טעינת משרד נכשלה:', e);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('notFoundState').style.display = 'block';
  }
}

let agencyProperties = [];

async function loadActiveProperties(sb, agencyId){
  const el = document.getElementById('activeProps');
  const { data: props } = await sb.from('properties')
    .select('id, title, price, deal_type, category, rooms, property_type, size_sqm, city, street, images, tour_3d_url, video_url')
    .eq('agency_id', agencyId).eq('status', 'active').order('created_at', { ascending:false });
  if (!props || props.length === 0){ el.innerHTML = '<div class="empty-state">אין כרגע נכסים פעילים במשרד זה.</div>'; return; }

  agencyProperties = props;
  // התגיות הנגזרות מחכות לרגע הזה — עכשיו יש נכסים שאפשר לקרוא מהם
  renderSpecialties(currentAgency, props);
  setSectionNote('propsCount', props.length === 1 ? 'נכס פעיל אחד' : props.length + ' נכסים פעילים');
  renderPropertyCards(props);
  // סרגל החיפוש מופיע רק כשיש בו טעם: בארבעה נכסים העין מהירה ממנו
  if (props.length >= 5) initPropertySearch();
}

function propertyCardHtml(p){
  // רק נתונים שמולאו נכנסים לשורת המטא — מודעה דלילה לא צריכה מקפים
  const meta = [
    p.rooms ? p.rooms + ' חדרים' : '',
    p.size_sqm ? p.size_sqm + ' מ״ר' : '',
    p.property_type || '',
    p.city || '',
  ].filter(Boolean);
  // המדיה מגיעה מהעמודות שנוספו לנכס — תגית עולה רק כשיש קישור אמיתי
  const media = [
    p.tour_3d_url ? `<span>${ICON.cube}סיור וירטואלי</span>` : '',
    p.video_url ? `<span>${ICON.play}סרטון</span>` : '',
  ].filter(Boolean).join('');
  const hasPhoto = !!safeImageUrl(p.images && p.images[0]);

  return `
    <div class="thumb${hasPhoto ? '' : ' no-photo'}"${thumbStyle(p)}>
      ${thumbFallback(p)}
      <div class="card-tags">
        <span class="card-tag${p.deal_type === 'rent' ? ' rent' : ''}">${p.deal_type === 'rent' ? 'להשכרה' : 'למכירה'}</span>
      </div>
      ${media ? `<div class="card-media">${media}</div>` : ''}
    </div>
    <div class="body">
      <div class="price">${priceLabel(p.price, p.deal_type)}</div>
      <div class="title">${escapeHtml(p.title || '')}</div>
      <div class="meta">${meta.map(m => `<span>${escapeHtml(m)}</span>`).join('')}</div>
    </div>`;
}

/* ---------- שלוש רצועות הנכסים ----------
   ‏category הוא מה שמפריד בין נדל״ן פרטי למסחרי בכל המרקטפלייס — עמודה
   ‏NOT NULL עם ברירת מחדל 'residential' וערכים 'residential'/'commercial'
   בלבד (index.html שולף לפיה את הרצועה המסחרית). גם ‎deal_type‎ מוגבל
   ל-'sale'/'rent', ולכן שלוש הרצועות מכסות את כל הנכסים בלי שאף אחד ייפול
   בין הכיסאות. */
const isCommercial = p => p.category === 'commercial';

const PROP_GROUPS = [
  { key:'rent',  title:'נכסים פרטיים להשכרה', icon:'key',
    match: p => !isCommercial(p) && p.deal_type === 'rent' },
  { key:'sale',  title:'נכסים פרטיים למכירה', icon:'building',
    match: p => !isCommercial(p) && p.deal_type === 'sale' },
  // במסחרי מכירה והשכרה יושבים יחד: מי שמחפש חנות בודק ממילא את שתי האפשרויות
  { key:'commercial', title:'נכסים מסחריים', icon:'store', match: isCommercial },
];

/* הרצועה מציגה עד שלושה כרטיסים במסך אחד; כשיש יותר, "לכל הנכסים" פותח את
   כולם ברשת. עד שלושה — אין מה לפתוח, ולכן אין קישור. */
const RAIL_VISIBLE = 3;
const allLabel = items => `כל ${items.length} הנכסים`;

function propertyRailHtml(group, items){
  const count = items.length === 1 ? 'נכס אחד' : items.length + ' נכסים';
  const showAll = items.length > RAIL_VISIBLE
    ? `<button type="button" class="group-all" aria-expanded="false">${allLabel(items)} ←</button>`
    : '';
  return `
    <div class="group-head">
      <span class="ic" aria-hidden="true">${ICON[group.icon]}</span>
      <h3 id="group-${group.key}">${escapeHtml(group.title)}</h3>
      <span class="n">${count}</span>
      ${showAll}
    </div>
    <div class="rail-wrap">
      <button type="button" class="rail-nav prev" aria-label="הנכסים הקודמים" hidden></button>
      <div class="rail" tabindex="0" role="group" aria-labelledby="group-${group.key}"></div>
      <button type="button" class="rail-nav next" aria-label="הנכסים הבאים" hidden></button>
    </div>
    <div class="rail-dots"></div>`;
}

function initShowAll(section, items){
  const btn = section.querySelector('.group-all');
  if (!btn) return;
  const rail = section.querySelector('.rail');
  btn.addEventListener('click', ()=>{
    const open = !section.classList.contains('expanded');
    section.classList.toggle('expanded', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.textContent = open ? 'תצוגה מצומצמת ←' : `${allLabel(items)} ←`;
    // במצב פתוח אין גלילה למדוד, וה-sync רק היה מחזיר את החיצים
    rail.dataset.expanded = open ? '1' : '';
    if (!open){ rail.scrollTo({ left:0 }); rail._railSync(); }
  });
}

function renderPropertyCards(list){
  const el = document.getElementById('activeProps');
  el.textContent = '';
  if (!list.length){
    el.innerHTML = '<div class="empty-state">לא נמצאו נכסים שתואמים לחיפוש.</div>';
    return;
  }

  PROP_GROUPS.forEach(group=>{
    const items = list.filter(group.match);
    if (!items.length) return;                 // רצועה בלי נכסים לא נוצרת

    const section = document.createElement('section');
    section.className = 'prop-group';
    section.dataset.kind = group.key;
    section.innerHTML = propertyRailHtml(group, items);

    const rail = section.querySelector('.rail');
    items.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'prop-card';
      card.innerHTML = propertyCardHtml(p);
      card.addEventListener('click', ()=> window.location.href = 'property.html?id=' + p.id);
      rail.appendChild(card);
    });

    el.appendChild(section);
    // אחרי ההוספה ל-DOM, אחרת המדידות של הרצועה מחזירות אפס
    initCarousel(rail, section.querySelector('.rail-nav.prev'),
                 section.querySelector('.rail-nav.next'), section.querySelector('.rail-dots'));
    initShowAll(section, items);
  });
}

/* ---------- חיפוש בנכסי המשרד ----------
   סינון מקומי על מה שכבר בזיכרון. השדות שנסרקים הם מה שגולש/ת באמת מקליד/ה:
   רחוב, עיר, סוג נכס וכותרת. מספרים (מחיר, שטח) לא נסרקים — "230" היה מחזיר
   גם נכס ב-230 מ״ר וגם נכס ב-230,000 ₪ ומבלבל יותר משהוא עוזר. */
function initPropertySearch(){
  const bar = document.getElementById('propSearchBar');
  const input = document.getElementById('propSearch');
  const clear = document.getElementById('propSearchClear');
  const count = document.getElementById('propSearchCount');
  bar.querySelector('.ic').innerHTML = ICON.search;
  bar.hidden = false;

  const apply = ()=>{
    const q = input.value.trim().toLowerCase();
    clear.hidden = !q;
    if (!q){
      renderPropertyCards(agencyProperties);
      count.hidden = true;
      return;
    }
    const terms = q.split(/\s+/);
    const matches = agencyProperties.filter(p=>{
      const haystack = [p.title, p.street, p.city, p.property_type].filter(Boolean).join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    });
    renderPropertyCards(matches);
    count.textContent = matches.length === 1
      ? 'נכס אחד תואם'
      : `${matches.length} נכסים תואמים מתוך ${agencyProperties.length}`;
    count.hidden = false;
  };

  input.addEventListener('input', apply);
  clear.addEventListener('click', ()=>{ input.value = ''; apply(); input.focus(); });
}

async function loadSoldDeals(sb, agencyId){
  const el = document.getElementById('soldDeals');
  const { data: deals } = await sb.from('market_deals')
    .select('sale_price, sold_at, rooms, property_type')
    .eq('agency_id', agencyId).order('sold_at', { ascending:false });
  if (!deals || deals.length === 0){ el.innerHTML = '<div class="empty-state">אין עדיין היסטוריית עסקאות למשרד זה.</div>'; return; }

  // מספר העסקאות נכנס אל תוך הכפתור עצמו — הוא הסיבה היחידה ללחוץ עליו
  const soldBtn = document.querySelector('.tab-btn[data-tab="sold"]');
  if (soldBtn) soldBtn.textContent = `נכסים שנמכרו (${deals.length})`;
  el.innerHTML = '';
  deals.forEach(d=>{
    const row = document.createElement('div');
    row.className = 'deal-row';
    const when = d.sold_at ? new Date(d.sold_at).toLocaleDateString('he-IL', { year:'numeric', month:'long' }) : '';
    row.innerHTML = `<span>${escapeHtml(d.property_type || '')}${d.rooms ? ' · ' + d.rooms + ' חדרים' : ''}` +
      `${when ? `<div class="deal-date">${escapeHtml(when)}</div>` : ''}</span>` +
      `<span class="deal-price">₪${Number(d.sale_price).toLocaleString('he-IL')}</span>`;
    el.appendChild(row);
  });
}

/* ---------- נבחרת המתווכים ----------
   הקרוסלה הפותחת של הדף. מנהל/ת המשרד תמיד הכרטיס הראשון והבולט: כרטיס
   רחב יותר, טבעת בצבע המשני ותגית תפקיד מעליו. */
async function loadTeam(sb, agencyId){
  const rail = document.getElementById('teamRail');
  const { data: agents } = await sb.from('agency_members_public')
    .select('id, slug, display_name, role, photo_url, photo_position, license_number, has_ethics_badge, phone_e164')
    .eq('agency_id', agencyId);

  // כפתורי יצירת הקשר — בראש הדף ובחותם שלו — ניזונים מאותה שליפה
  renderAgencyContact(agents);
  renderManagerContact(agents);
  // בלי צוות אין מה להציג: מקטע "נבחרת" ריק פוגע יותר משהוא מוסיף
  if (!agents || agents.length === 0) return;

  // sort יציב ב-JS מודרני, ולכן שאר הצוות שומר על סדר ההגעה מהמסד
  const team = agents.slice().sort((a, b) => (b.role === 'manager') - (a.role === 'manager'));

  setSectionNote('teamCount', team.length === 1 ? 'סוכן/ת אחד/ת במשרד' : team.length + ' סוכנים במשרד');

  rail.textContent = '';
  team.forEach(a=>{
    const name = a.display_name || '?';
    const isManager = a.role === 'manager';
    const card = document.createElement('div');
    card.className = 'team-card' + (isManager ? ' is-manager' : '');
    card.setAttribute('role', 'link');
    card.tabIndex = 0;
    card.setAttribute('aria-label', name + ' — ' + roleLabel(a));
    card.innerHTML = `
      ${isManager ? `<span class="team-flag">${ICON.star}מנהל/ת המשרד</span>` : ''}
      ${agentAvatarHtml(a, 'team-avatar')}
      <div class="team-name">${escapeHtml(name)}</div>
      <div class="team-role">${escapeHtml(roleLabel(a))}</div>
      ${a.license_number ? `<span class="team-lic">${ICON.check}רישיון ${escapeHtml(a.license_number)}</span>` : ''}
      ${a.has_ethics_badge ? '<div class="team-badge"></div>' : ''}
      ${hasPhone(a) ? `<div class="team-actions">
        <a class="ta-wa" href="${escapeHtml(waLink(a.phone_e164, `הגעתי לדף של ${(currentAgency && currentAgency.name) || 'המשרד'} בשוק הנדל״ן של עפולה והסביבה ואשמח לדבר עם ${name}.`))}"
           target="_blank" rel="noopener noreferrer"
           aria-label="${escapeHtml('שליחת הודעת וואטסאפ ל' + name)}">${WA_SVG} וואטסאפ</a>
        <a class="ta-tel" href="tel:+${a.phone_e164}" aria-label="${escapeHtml('חיוג ל' + name)}">${ICON.phone} חיוג</a>
      </div>` : ''}`;

    // התו נשתל אחרי ה-innerHTML כדי שיישא את מאזין הלחיצה שלו
    if (a.has_ethics_badge && window.QualityBadge){
      QualityBadge.mount(card.querySelector('.team-badge'), { size:'sm', subject:name });
    }

    const open = ()=> window.location.href = 'agent.html?slug=' + (a.slug || a.id);
    // לחיצה על כפתור וואטסאפ/חיוג או על תו האיכות לא אמורה לנווט לדף הסוכן/ת
    card.addEventListener('click', (e)=>{ if (!e.target.closest('a, button')) open(); });
    card.addEventListener('keydown', (e)=>{
      if ((e.key === 'Enter' || e.key === ' ') && e.target === card){ e.preventDefault(); open(); }
    });
    rail.appendChild(card);
  });

  document.getElementById('teamSec').style.display = 'block';
  initCarousel(rail, document.getElementById('teamPrev'),
               document.getElementById('teamNext'), document.getElementById('teamDots'));
}

/* ---------- קרוסלה ----------
   חיצים, נקודות וגלילה בקפיצות של כרטיס — לרצועת המתווכים ולשלוש רצועות
   הנכסים כאחד. ב-RTL ציר הגלילה הפיזי הפוך — ‏scrollLeft יורד לשלילי ככל
   שמתקדמים — ולכן כיוון הצעד נגזר מכיוון הכתיבה בפועל ולא מקובע. */
window.addEventListener('resize', ()=>{
  document.querySelectorAll('.rail').forEach(rail => rail._railSync && rail._railSync());
});

function initCarousel(rail, prev, next, dots){
  const cards = Array.from(rail.children);
  if (!cards.length) return;

  prev.innerHTML = ICON.chevronR;
  next.innerHTML = ICON.chevron;

  const rtl = getComputedStyle(rail).direction === 'rtl';
  // ‏scrollBy/scrollTo מקבלים היסט פיזי; ב-RTL ההתקדמות היא לכיוון השלילי
  const toAxis = value => rtl ? -value : value;

  const gap = parseFloat(getComputedStyle(rail).columnGap) || 0;
  const step = dir =>{
    const width = cards[0].getBoundingClientRect().width + gap;
    rail.scrollBy({ left: toAxis(dir * width), behavior:'smooth' });
  };
  prev.addEventListener('click', ()=> step(-1));
  next.addEventListener('click', ()=> step(1));

  /* הנקודות מסמנות עמודי גלילה ולא כרטיסים: במסך רחב נראים ארבעה כרטיסים
     בבת אחת, ונקודה לכל כרטיס הייתה מציגה ארבע "מיקומים" שאי אפשר להגיע
     אליהם. מספר העמודים תלוי ברוחב, ולכן הן נבנות מחדש כשהוא משתנה. */
  let pageCount = 0;
  function buildDots(count){
    pageCount = count;
    dots.textContent = '';
    for (let i = 0; i < count; i++){
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.setAttribute('aria-label', `מעבר לעמוד ${i + 1} מתוך ${count}`);
      // מיקום יחסי לאורך הגלילה כולה — כך שהנקודה האחרונה באמת מגיעה לסוף
      // הרצועה גם כשהעודף לגלילה קטן מרוחב עמוד שלם
      dot.addEventListener('click', ()=>{
        const scrollable = rail.scrollWidth - rail.clientWidth;
        rail.scrollTo({ left: toAxis(scrollable * i / (count - 1)), behavior:'smooth' });
      });
      dots.appendChild(dot);
    }
  }

  function sync(){
    if (rail.dataset.expanded === '1') return;   // רשת פתוחה — אין קרוסלה לסנכרן
    rail.classList.remove('no-scroll');
    const scrollable = rail.scrollWidth - rail.clientWidth;
    const overflowing = scrollable > 8;
    prev.hidden = next.hidden = !overflowing;
    dots.hidden = !overflowing;
    if (!overflowing){ rail.classList.add('no-scroll'); return; }

    const pos = Math.abs(rail.scrollLeft);
    prev.disabled = pos <= 2;
    next.disabled = pos >= scrollable - 2;

    const count = Math.max(2, Math.ceil(rail.scrollWidth / rail.clientWidth));
    if (count !== pageCount) buildDots(count);
    const active = Math.round(pos / scrollable * (count - 1));
    Array.from(dots.children).forEach((d, i)=> d.classList.toggle('on', i === active));
  }

  rail.addEventListener('scroll', ()=>{
    if (rail._syncing) return;
    rail._syncing = requestAnimationFrame(()=>{ rail._syncing = null; sync(); });
  });
  // הרצועות של הנכסים נבנות מחדש בכל הקלדה בחיפוש. מאזין resize על window לכל
  // רצועה היה משאיר מאחוריו מאזין מת בכל בנייה — לכן ה-sync נתלה על הרצועה
  // עצמה, ומאזין יחיד וגלובלי מריץ את מה שבאמת נמצא בדף.
  rail._railSync = sync;
  sync();
}

async function loadReviews(sb, agencyId){
  const el = document.getElementById('reviewsList');
  const { data: reviews } = await sb.from('reviews').select('rating, text, reviewer_display_name')
    .eq('agency_id', agencyId).eq('status', 'published');
  if (!reviews || reviews.length === 0){ el.innerHTML = '<div class="empty-state">אין עדיין ביקורות למשרד זה.</div>'; return; }

  const avg = reviews.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / reviews.length;
  const reviewsLabel = reviews.length === 1 ? 'ביקורת אחת' : `${reviews.length} ביקורות`;
  const score = avg.toFixed(1).replace(/\.0$/, '');
  setSectionNote('reviewsSummary', `★ ${score} דירוג ממוצע · ${reviewsLabel}`);

  // אותו דירוג פעמיים בדף: בראשו כמדד אמון, ובמקטע עצמו ככותרת הביקורות
  const ratingEl = document.getElementById('heroRating');
  ratingEl.innerHTML = `${starsHtml(avg)}<span class="hr-score">${score}</span><span class="hr-count">${reviewsLabel} ←</span>`;
  ratingEl.hidden = false;

  el.innerHTML = '';
  reviews.forEach(r=>{
    const rating = Math.max(0, Math.min(5, Number(r.rating) || 0));
    const card = document.createElement('div');
    card.className = 'panel review-card';
    card.innerHTML = `
      <div class="review-stars">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</div>
      <div class="review-text">${escapeHtml(r.text || '')}</div>
      <div class="review-by">${escapeHtml(r.reviewer_display_name || 'לקוח מאומת')}</div>`;
    el.appendChild(card);
  });
}
