<meta name="google-site-verification" content="_ALC1h51UGYFz3-d53Q9wYeB88QS5ow5DbJ-ZgV1PDA">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;700&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1b3d; --ink-soft:#4a5578; --paper:#f4f7fe; --raised:#ffffff;
    --line:#e3e8f4; --blue:#0e2a6b; --blue-tint:#eaf0fb; --gold:#c9a24a;
    --love:#c2185b; --love-tint:#fde7ef; --ok:#1e7a4c; --ok-tint:#e5f5ec;
    --radius:16px; --shadow:0 2px 10px rgba(18,40,64,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55}
  h1,h2,.display{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--blue);margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  textarea,input,select{font-family:inherit;font-size:1rem}
  .shell{max-width:760px;margin:0 auto;padding:16px 14px 110px}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---- כותרת: המשרד והסוכן/ת ששלח/ה ----
     זה המיתוג היחיד בדף. הצבעים נקבעים ב-applyBrand (‏assets/showcase.js)
     מ-agencies.colors, על --blue ו---love, והנכסים עצמם בלי מיתוג. */
  .brandbar{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;font-weight:700;font-size:1.05rem}
  .brandbar img{height:44px;width:auto;max-width:160px;object-fit:contain;background:#fff;border-radius:10px;padding:4px 8px}
  .hero{padding:18px;margin-bottom:12px}
  .hero-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .hero img.agent{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none;background:var(--blue-tint);border:3px solid var(--blue)}
  .agent-name{font-weight:800;font-size:1.08rem}
  .agent-sub{color:var(--ink-soft);font-size:.82rem}
  .hero h1{font-size:1.22rem;line-height:1.3}
  .hero .sub{color:var(--ink-soft);font-size:.9rem;margin-top:2px}
  .intro{padding:14px 18px;margin-bottom:12px;white-space:pre-line;border-inline-start:4px solid var(--blue)}
  .always{margin-top:10px;font-size:.84rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .share-btn{color:var(--blue);font-weight:700;font-size:.84rem;padding:2px 0;text-decoration:underline}
  .wa-pref{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.84rem;color:var(--ink-soft);cursor:pointer}
  .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .pill-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border-radius:12px;background:var(--blue-tint);color:var(--blue);font-weight:600;font-size:.86rem;text-decoration:none}

  /* ---- כפתור קשר צף ---- */
  .fab{position:fixed;inset-inline-start:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25}
  body.has-banner .fab{bottom:calc(78px + env(safe-area-inset-bottom))}
  .fab-btn{background:var(--blue);color:#fff;border-radius:999px;padding:11px 16px;font-weight:700;font-size:.9rem;box-shadow:0 6px 18px rgba(18,40,64,.25)}
  .fab-sheet{position:absolute;bottom:52px;inset-inline-start:0;width:250px;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(18,40,64,.2);padding:12px}
  .fab-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .fab-head img{width:34px;height:34px;border-radius:50%;object-fit:cover}
  .fab-links{display:grid;gap:4px}
  .fab-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
  .fab-link:hover{background:var(--blue-tint)}

  /* ---- לשוניות ---- */
  .tabs{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;margin-bottom:6px;overflow-x:auto}
  .tabs button{padding:8px 14px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-weight:600;font-size:.9rem;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
  .tabs .n{opacity:.75;font-weight:500;margin-inline-start:3px}

  /* ---- כרטיס נכס ---- */
  .prop{margin-bottom:16px;overflow:hidden}
  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#dfe5f2;aspect-ratio:4/3}
  .gallery img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
  .gallery .noimg{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:.9rem}
  .gal-count{font-size:.75rem;color:var(--ink-soft);padding:4px 16px 0}
  .prop-body{padding:14px 16px 16px}
  .price{font-size:1.35rem;font-weight:800;color:var(--blue)}
  .what{font-weight:700;margin-top:2px}
  .where{color:var(--ink-soft);font-size:.92rem}
  .specs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .specs span{background:var(--blue-tint);border-radius:8px;padding:3px 9px;font-size:.84rem}
  .note{background:#fff8e6;border-radius:10px;padding:9px 12px;font-size:.92rem;margin:10px 0;white-space:pre-line}
  .note b{color:#8a6510}
  .desc{font-size:.92rem;color:var(--ink);white-space:pre-line;max-height:6.2em;overflow:hidden;position:relative}
  .desc.open{max-height:none}
  .more{color:var(--blue);font-weight:600;font-size:.86rem;padding:4px 0}
  .feats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .feats span{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px}

  /* ---- אהבתי / לא בשבילי ----
     הפעולה העיקרית בעמוד, ולכן מלאה ובולטת: "אהבתי" בצבע המשרד (‏--love, נקבע
     ב-applyBrand), "לא בשבילי" במסגרת כהה - בולט, אבל משני לו. */
  .react{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin:14px 0 12px}
  .react button{min-height:52px;padding:12px;border-radius:14px;font-weight:800;font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s ease, box-shadow .15s ease}
  .react button:active{transform:scale(.97)}
  .react button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .react .love{background:var(--love);color:#fff;border:2px solid var(--love);box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .react .love[aria-pressed="true"]{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75), 0 4px 14px rgba(0,0,0,.18)}
  .react .nope{background:var(--raised);color:var(--ink);border:2px solid var(--ink)}
  .ask{width:100%;margin-top:8px;padding:9px;border-radius:12px;background:var(--blue-tint);color:var(--blue);font-weight:600}

  .reasons{margin-top:10px;padding:12px;border-radius:12px;background:#f6f7fb}
  .reasons p{margin:0 0 8px;font-weight:600;font-size:.92rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.86rem}
  .chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .reasons .row{display:flex;gap:8px;margin-top:10px}
  .btn{padding:9px 16px;border-radius:10px;font-weight:700}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink-soft)}
  .btn[disabled]{opacity:.55;cursor:default}

  /* ---- שיחה ---- */
  .thread{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .msg{max-width:85%;padding:7px 11px;border-radius:12px;margin:5px 0;font-size:.92rem;white-space:pre-line;word-break:break-word}
  .msg time{display:block;font-size:.7rem;opacity:.65;margin-top:2px}
  .msg.client{background:var(--blue);color:#fff;margin-inline-start:auto;border-end-start-radius:4px}
  .msg.agent{background:#eef1f8;border-end-end-radius:4px}
  .compose{display:flex;gap:6px;margin-top:8px}
  .compose textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:42px}
  .empty{padding:26px 16px;text-align:center;color:var(--ink-soft)}

  /* ---- סיור ---- */
  .tour-banner{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--raised);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(18,40,64,.1)}
  .tour-banner .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .tour-banner .t{flex:1;font-size:.92rem}
  .tour{padding:16px}
  .tour h2{font-size:1.1rem;margin-bottom:8px}
  .tour fieldset{border:none;padding:0;margin:0 0 14px}
  .tour legend{font-weight:700;margin-bottom:6px;font-size:.94rem}
  .pick{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.92rem}
  .days,.slots{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}
  .days button,.slots button{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.86rem;white-space:nowrap}
  .days button[aria-pressed="true"],.slots button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
  .slots button[disabled]{text-decoration:line-through;opacity:.45;cursor:default}
  .legal{font-size:.84rem;background:var(--blue-tint);border-radius:10px;padding:9px 12px;margin-bottom:12px}
  .meet{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .meet:last-child{border-bottom:none}
  .st{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .st-requested{background:#fff4d6;color:#8a6510}
  .st-confirmed{background:var(--ok-tint);color:var(--ok)}
  .st-declined{background:#f3f3f3;color:var(--ink-soft)}

  .toast{position:fixed;bottom:84px;inset-inline:14px;margin:0 auto;max-width:420px;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:30;font-size:.92rem}
  .toast button{color:#ffd77a;font-weight:700}
  .state{padding:40px 20px;text-align:center}
  .state h1{font-size:1.2rem;margin-bottom:6px}
  .foot{text-align:center;font-size:.78rem;color:var(--ink-soft);margin-top:20px}
  .foot small{opacity:.7}
  [hidden]{display:none !important}
</style>
</head>
<body>

<main class="shell" id="app" aria-live="polite">
  <div class="card state" id="loading"><p>טוען את הנכסים שנבחרו בשבילך…</p></div>
</main>

<div class="tour-banner" id="tourBanner" hidden>
  <div class="in">
    <div class="t" id="tourBannerText"></div>
    <button type="button" class="btn btn-primary" id="tourBannerBtn">לתאם סיור</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button type="button" id="toastUndo" hidden>ביטול</button></div>

<script src="assets/showcase.js"></script>
</body>
</html>
