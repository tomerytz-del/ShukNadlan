<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Shuk Reel</title>
<style>
@font-face { font-family: Heebo; src: url(fonts/Heebo.ttf) format("truetype"); font-weight: 100 900; }
html, body { margin: 0; padding: 0; background: #ebe8e3; }
#stage { position: relative; width: 1440px; height: 1440px; overflow: hidden; background: #ebe8e3;
  font-family: Heebo, sans-serif; color: #151515; -webkit-font-smoothing: antialiased; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#shadow, #shape { position: absolute; left: 0; top: 0; }
#shadow { background: rgba(60, 48, 30, .20); filter: blur(30px); }
#shape { overflow: hidden; }
.layer { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.abs { position: absolute; white-space: nowrap; }
.r { transform: translate(-100%, -50%); }   /* anchored at its right edge */
.l { transform: translate(0, -50%); }       /* anchored at its left edge */
.c { transform: translate(-50%, -50%); }
svg { display: block; overflow: visible; }
#cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="shadow"></div>
    <div id="shape"></div>
  </div>
  <svg id="cursor" viewBox="0 0 46 46">
    <path d="M6 4 L6 36 L14.5 28.5 L20 41 L26 38.5 L20.5 26.5 L32 26 Z" fill="#151515" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  </svg>
</div>
<script>
// ---------------------------------------------------------------------------
// Everything below is a pure function of t. No transitions, timers, or state
// carried between frames: seek(t) can be called in any order.
// ---------------------------------------------------------------------------
const T = 14;                       // 7 bars × 4 beats × 0.5s (120 BPM)
const NAVY = [14, 42, 107], INK = [21, 21, 21], WHITE = [255, 255, 255];
const GRAY = '#8a857c', LINE = '#ebe7e1', TINT = '#e8ecf5', OFF = [216, 212, 205];

// Closed-form spring step response. [omega, zeta]; zeta < 1 keeps overshoot small.
const P = { main: [17, .8], fast: [26, .82], slow: [11, .85], cur: [12.5, .92], quick: [34, 1] };
function S(t, [w, z]) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// A value that changes target many times = a sum of one spring per change.
// The previous cycle's springs are added too, so t=0 and t=T match exactly,
// velocity included (every track ends where it starts).
function track(v0, evs, preset = 'main') {
  let prev = v0;
  const ds = evs.map(e => { const d = { t: e[0], d: e[1] - prev, p: P[e[2] || preset] }; prev = e[1]; return d; });
  if (Math.abs(prev - v0) > 1e-9) throw new Error('track does not loop: ' + v0 + ' -> ' + prev);
  return t => { let v = v0; for (const e of ds) v += e.d * (S(t - e.t, e.p) + S(t - e.t + T, e.p)); return v; };
}
const ctrack = (c0, evs, p) => [0, 1, 2].map(i => track(c0[i], evs.map(e => [e[0], e[1][i], e[2]]), p));
const rgb = (tr, t) => `rgb(${tr.map(f => Math.round(Math.max(0, Math.min(255, f(t))))).join(',')})`;
const clamp01 = v => Math.max(0, Math.min(1, v));
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));

// --- the shape --------------------------------------------------------------
// [t, w, h, radius, color]
const ST = [
  [1.0, 76, 76, 38, NAVY],      // spinner
  [2.5, 380, 72, 36, INK],      // island
  [3.0, 440, 470, 32, WHITE],   // property card
  [5.5, 400, 96, 48, WHITE],    // exclusivity toggle
  [7.0, 480, 84, 42, WHITE],    // tabs
  [8.5, 600, 540, 32, WHITE],   // chart panel
  [10.0, 560, 76, 24, WHITE],   // ⌘K
  [10.5, 560, 268, 24, WHITE],  // three results
  [11.0, 560, 148, 24, WHITE],  // one result
  [12.0, 520, 72, 36, NAVY],    // opened result
  [12.5, 460, 100, 30, WHITE],  // toast
  [13.5, 260, 76, 38, NAVY],    // back to the button
];
const S0 = [260, 76, 38, NAVY];
const shW = track(S0[0], ST.map(s => [s[0], s[1]]));
const shH = track(S0[1], ST.map(s => [s[0], s[2]]));
const shR = track(S0[2], ST.map(s => [s[0], s[3]]));
const shC = ctrack(S0[3], ST.map(s => [s[0], s[4]]));
const press = track(1, [[0.5, .95, 'fast'], [0.62, 1], [12.0, .97, 'fast'], [12.1, 1]]);

// Camera: zooms out ahead of a growing shape, follows a shrinking one.
let pw = S0[0], ph = S0[1];
const camEv = ST.map(s => { const grow = s[1] * s[2] > pw * ph; pw = s[1]; ph = s[2]; return [s[0] + (grow ? -0.08 : 0.12), s[1], s[2]]; });
const camW = track(S0[0], camEv.map(e => [e[0], e[1]]));
const camH = track(S0[1], camEv.map(e => [e[0], e[2]]));

// --- the cursor (world coordinates, shape centred on 0,0) --------------------
const HANDLE0 = -30, TRACK = 172;
const curX = track(120, [[0.05, 28, 'cur'], [0.75, 120, 'cur'], [3.02, HANDLE0 + 2, 'cur'], [3.8, -176, 'cur'], [4.3, -300, 'cur'],
  [5.15, -112, 'cur'], [6.85, 2, 'cur'], [7.62, -152, 'cur'], [8.85, 86, 'cur'], [11.0, 170, 'cur'], [12.95, 120, 'cur']]);
const curY = track(150, [[0.05, 12, 'cur'], [0.75, 110, 'cur'], [3.02, 162, 'cur'], [3.8, 164, 'cur'], [4.3, 168, 'cur'],
  [5.15, 4, 'cur'], [6.85, 6, 'cur'], [7.62, 6, 'cur'], [8.85, -6, 'cur'], [11.0, 200, 'cur'], [12.95, 150, 'cur']]);
const curO = track(1, [[10.05, 0, 'fast'], [12.85, 1]]);
const curP = track(1, [[0.5, .84, 'fast'], [0.62, 1], [3.5, .84, 'fast'], [5.0, 1], [6.0, .84, 'fast'], [6.12, 1],
  [7.5, .84, 'fast'], [7.62, 1], [8.0, .84, 'fast'], [8.12, 1]]);

// --- layers -----------------------------------------------------------------
// Content has its own in/out timing: out is quick, in waits for the shape.
function vis(t, wins, delay = 0.1) {
  let best = 0, bi = 0;
  for (const [a, b] of wins) {
    const i = clamp01(S(t - a - delay, P.main)), o = clamp01(S(t - b, P.quick));
    const v = i * (1 - o);
    if (v > best) { best = v; bi = i; }
  }
  return [best, bi];
}
function applyVis(el, t, wins, delay) {
  let [op, inn] = vis(t, wins, delay);
  if (op < .002) { op = 0; inn = 0; }   // fully hidden has one canonical state
  el.style.opacity = op.toFixed(4);
  el.style.filter = op > .995 ? 'none' : `blur(${((1 - op) * 7).toFixed(2)}px)`;
  el.style.transform = `scale(${(0.94 + 0.06 * inn).toFixed(4)})`;
  el.style.visibility = op < .002 ? 'hidden' : 'visible';
  return op;
}

const shape = document.getElementById('shape');
const L = {};
function layer(name, html) { const d = document.createElement('div'); d.className = 'layer'; d.innerHTML = html; shape.appendChild(d); L[name] = d; return d; }
function icon(size, body, color = 'currentColor') {
  const sw = (2.4 * 24 / size).toFixed(3);   // same stroke weight in world px for every icon
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  house: '<path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  chat: '<path d="M5 18.5l1.2-3.6A7.5 7.5 0 1 1 9.2 18z"/>',
};
const at = (x, y, cls, html, style = '') => `<div class="abs ${cls}" style="left:${x}px;top:${y}px;${style}">${html}</div>`;

// button
layer('btn', at(0, 0, 'c', `<div style="display:flex;align-items:center;gap:10px;color:#fff;font:600 27px Heebo">${icon(26, I.plus, '#fff')}<span>פרסום נכס</span></div>`));
// spinner
layer('spin', at(0, 0, 'c', `<svg id="spinSvg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2.4"/><circle id="spinArc" cx="20" cy="20" r="15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" pathLength="100" stroke-dasharray="28 100"/></svg>`));
// check
layer('check', at(0, 0, 'c', `<svg width="44" height="44" viewBox="0 0 44 44"><path id="checkPath" d="M11 23l7.5 7.5L33 15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100"/></svg>`));
// island
layer('island',
  at(146, 0, 'c', `<div style="width:44px;height:44px;border-radius:22px;background:rgb(${NAVY});display:grid;place-items:center">${icon(22, I.check, '#fff')}</div>`) +
  at(114, 0, 'r', `<span style="color:#fff;font:500 22px Heebo">פורסם בפייסבוק</span>`) +
  at(-160, 0, 'l', `<span style="color:#9a958c;font:400 18px Heebo">עכשיו</span>`));
// property card
layer('card',
  `<div class="abs" style="left:-208px;top:-223px;width:416px;height:200px;border-radius:22px;background:#e2ded7;display:grid;place-items:center;color:#aaa398">${icon(56, I.house)}</div>` +
  at(196, -2, 'r', `<span style="font:600 25px Heebo">דירת 4 חדרים, עפולה</span>`) +
  at(196, 30, 'r', `<span style="font:400 19px Heebo;color:${GRAY}">גבעת המורה · קומה 3</span>`) +
  at(196, 90, 'r', `<span style="font:400 18px Heebo;color:${GRAY}">מחיר מבוקש</span>`) +
  at(-196, 90, 'l', `<span id="price" dir="ltr" style="font:700 30px Heebo;font-variant-numeric:tabular-nums">₪2,150,000</span>`) +
  `<div id="trackBase" class="abs" style="top:156px;height:8px;border-radius:4px;background:${LINE}"></div>` +
  `<div id="trackFill" class="abs" style="top:156px;height:8px;border-radius:4px;background:rgb(${NAVY})"></div>` +
  `<div id="handle" class="abs" style="top:160px;width:30px;height:30px;border-radius:15px;background:#fff;box-sizing:border-box;border:2.4px solid rgb(${NAVY})"></div>`);
// toggle row (the knob itself is the shared blob below)
layer('toggle',
  at(168, -12, 'r', `<span style="font:600 25px Heebo">בלעדיות</span>`) +
  at(168, 20, 'r', `<span style="font:400 18px Heebo;color:${GRAY}">הסכם בלעדיות חתום</span>`) +
  `<div id="tgTrack" class="abs" style="left:-172px;top:-24px;width:84px;height:48px;border-radius:24px"></div>`);
layer('badge', at(38, -12, 'r', `<span style="display:inline-block;padding:3px 12px;border-radius:14px;background:${TINT};color:rgb(${NAVY});font:600 16px Heebo">בלעדי</span>`));
// shared blob: toggle knob → active tab marker
layer('blob', `<div id="blob" class="abs"></div>`);
// tab labels
layer('tabs', ['נכסים', 'לקוחות', 'לידים'].map((s, i) => `<div id="tab${i}" class="abs c" style="font:600 22px Heebo">${s}</div>`).join(''));
// chart
const DAYS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'], VALS = [6, 9, 12, 8, 14, 11, 8];
const PX = i => 250 - i * (500 / 6), PY = v => 200 - v / 15 * 250;
layer('chart',
  at(268, -138, 'r', `<span style="font:600 25px Heebo">לידים השבוע</span>`) +
  at(268, -106, 'r', `<span style="font:400 18px Heebo;color:${GRAY}">מכל הנכסים הפעילים</span>`) +
  at(-268, -124, 'l', `<span style="font:700 44px Heebo">68</span>`) +
  `<svg class="abs" style="left:0;top:0" width="1" height="1">` +
  [0, 5, 10, 15].map(v => `<line x1="-262" x2="262" y1="${PY(v)}" y2="${PY(v)}" stroke="${LINE}" stroke-width="1.5"/>`).join('') +
  `<line id="hoverLine" x1="${PX(2)}" x2="${PX(2)}" y1="${PY(15)}" y2="${PY(0)}" stroke="#cfcac2" stroke-width="1.5" stroke-dasharray="4 5"/>` +
  `<polyline id="chartLine" points="${VALS.map((v, i) => PX(i) + ',' + PY(v)).join(' ')}" fill="none" stroke="rgb(${NAVY})" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100"/>` +
  VALS.map((v, i) => `<circle id="dot${i}" cx="${PX(i)}" cy="${PY(v)}" r="5" fill="#fff" stroke="rgb(${NAVY})" stroke-width="2.4"/>`).join('') +
  `</svg>` +
  DAYS.map((d, i) => at(PX(i), 234, 'c', `<span style="font:400 17px Heebo;color:${GRAY}">${d}</span>`)).join(''));
layer('tip', at(PX(2), PY(12) - 50, 'c', `<div style="padding:9px 16px;border-radius:14px;background:rgb(${INK});color:#fff;font:500 18px Heebo">יום ג׳ · 12 לידים</div>`));
// ⌘K search
const RES = [['דירת 4 חדרים, עפולה', 'גבעת המורה'], ['דירת 4 חדרים, חדרה', 'הנשיא 8'], ['דירת 4 חדרים, חולון', 'סוקולוב 40']];
layer('search',
  `<div id="sIcon" class="abs c" style="color:#151515">${icon(26, I.search)}</div>` +
  `<div id="sPh" class="abs r" style="font:400 22px Heebo;color:#a19b91">חיפוש נכסים, לקוחות ולידים</div>` +
  `<div id="sText" class="abs r" style="font:500 22px Heebo"></div>` +
  `<div id="sCaret" class="abs" style="width:2.4px;height:28px;background:rgb(${NAVY})"></div>` +
  `<div id="sKey" class="abs l" dir="ltr" style="padding:2px 9px;border-radius:8px;border:1.5px solid #d7d2ca;color:${GRAY};font:500 17px Heebo">⌘K</div>` +
  `<div id="sDiv" class="abs" style="left:-280px;width:560px;height:1.5px;background:${LINE}"></div>` +
  `<div id="sHi" class="abs" style="left:-268px;width:536px;height:52px;border-radius:14px;background:${TINT}"></div>`);
RES.forEach((r, i) => layer('res' + i,
  `<div class="rowIcon abs c" style="left:246px;color:${GRAY}">${icon(22, I.house)}</div>` +
  `<div class="rowText abs r" style="left:222px;font:500 21px Heebo">${r[0]}</div>` +
  `<div class="rowAddr abs l" style="left:-252px;font:400 18px Heebo;color:${GRAY}">${r[1]}</div>` +
  (i === 0 ? `<div class="rowEnter abs l" style="left:-252px;padding:1px 9px;border-radius:8px;border:1.5px solid #c3cbe0;color:rgb(${NAVY});font:600 17px Heebo">↵</div>` : '')));
// opened result
layer('opened', at(0, 0, 'c', `<div style="display:flex;align-items:center;gap:12px;color:#fff;font:500 22px Heebo">${icon(24, I.house, '#fff')}<span>דירת 4 חדרים, עפולה</span></div>`));
// toast
layer('toast',
  at(172, 0, 'c', `<div style="width:56px;height:56px;border-radius:28px;background:rgb(${NAVY});display:grid;place-items:center">${icon(26, I.chat, '#fff')}</div>`) +
  at(130, -15, 'r', `<span style="font:600 23px Heebo">ליד חדש מוואטסאפ</span>`) +
  at(130, 17, 'r', `<span style="font:400 19px Heebo;color:${GRAY}">דירת 4 חדרים בעפולה</span>`) +
  at(-200, -20, 'l', `<span style="font:400 16px Heebo;color:#a19b91">עכשיו</span>`));
layer('unread', `<div class="abs" style="left:-199px;top:9px;width:12px;height:12px;border-radius:6px;background:rgb(${NAVY})"></div>`);

// --- tracks for inner parts --------------------------------------------------
const spinLen = track(28, [[1.5, 62, 'slow'], [2.0, 28]]);
const checkP = track(0, [[2.05, 1, 'main'], [2.8, 0]]);
// knob → tab marker: the two edges ride different springs, so the leading edge
// stretches ahead and the trailing edge catches up.
const bL = track(-168 + 36, [[6.0, -168, 'fast'], [7.0, 77, 'slow'], [7.5, -77, 'fast'], [8.0, -231, 'fast'], [10.4, -132]]);
const bR = track(-128 + 36, [[6.0, -128, 'slow'], [7.0, 231, 'fast'], [7.5, 77, 'slow'], [8.0, -77, 'slow'], [10.4, -92]]);
const bH = track(20, [[7.0, 33], [10.4, 20]]);
const rowY = track(0, [[8.5, -213], [10.4, 0]]);
const blobC = ctrack(WHITE, [[7.0, NAVY], [10.4, WHITE]]);
const tgC = ctrack(OFF, [[6.0, NAVY, 'fast'], [7.2, OFF]]);
const drawP = track(0, [[9.0, 1, 'slow'], [10.4, 0]]);
const hover = track(0, [[9.5, 1, 'fast'], [10.0, 0, 'quick']]);
const hiP = track(0, [[11.5, 1, 'fast'], [12.2, 0]]);
const TYPE = '4 חדרים בעפולה';
const TYPE_T = [10.30, 10.36, 10.42, 10.48, 10.62, 10.70, 10.78, 10.84, 10.90, 10.95, 11.0, 11.20, 11.32, 11.45];
const handleScale = track(1, [[3.5, 1.18, 'fast'], [5.0, 1]]);

function sliderX(t) {
  const grab = curX(3.5) - HANDLE0;
  const rubber = x => x < -TRACK ? -TRACK - (-TRACK - x) * .18 : x > TRACK ? TRACK + (x - TRACK) * .18 : x;
  if (t < 3.5 || t >= 6.0) return HANDLE0;          // card is hidden by 6.0; reset keeps the loop seamless
  if (t < 5.0) return rubber(curX(t) - grab);          // direct manipulation
  const d0 = rubber(curX(5.0) - grab);                    // release: spring back from wherever it is
  const target = Math.max(-TRACK, Math.min(TRACK, d0));
  return target + (d0 - target) * (1 - S(t - 5.0, P.main));
}

// --- seek --------------------------------------------------------------------
const $ = id => document.getElementById(id);
const world = $('world'), shadow = $('shadow'), cursor = $('cursor');
const FILLW = 0.74, FILLH = 0.62, ZMAX = 4.0;

function seek(t) {
  t = ((t % T) + T) % T;
  const k = press(t);
  const w = shW(t) * k, h = shH(t) * k, r = Math.min(shR(t), w / 2, h / 2);
  for (const el of [shape, shadow]) {
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.left = -w / 2 + 'px'; el.style.top = -h / 2 + 'px'; el.style.borderRadius = r + 'px';
  }
  shadow.style.transform = 'translateY(22px)';
  shape.style.background = rgb(shC, t);

  const W = Math.max(camW(t), w), H = Math.max(camH(t), h);
  const s = Math.min(1440 * FILLW / W, 1440 * FILLH / H, ZMAX);
  world.style.transform = `translate(720px,720px) scale(${s})`;

  applyVis(L.btn, t, [[-0.5, 1.0], [13.5, 15]], 0.1);
  applyVis(L.spin, t, [[1.0, 2.0]], 0.08);
  $('spinSvg').style.transform = `rotate(${((t * 540) % 360).toFixed(2) % 360}deg)`;
  $('spinArc').setAttribute('stroke-dasharray', `${spinLen(t)} 100`);
  applyVis(L.check, t, [[2.0, 2.5]], 0);
  $('checkPath').setAttribute('stroke-dashoffset', 100 * (1 - clamp01(checkP(t))));
  applyVis(L.island, t, [[2.5, 3.0]], 0.12);

  // card + price slider
  applyVis(L.card, t, [[3.0, 5.5]], 0.12);
  const hx = sliderX(t);
  const left = Math.min(-TRACK, hx), right = Math.max(TRACK, hx);
  Object.assign($('trackBase').style, { left: left + 'px', width: right - left + 'px' });
  Object.assign($('trackFill').style, { left: hx + 'px', width: right - hx + 'px' });   // RTL: fills from the right
  Object.assign($('handle').style, { left: hx - 15 + 'px', transform: `translateY(-50%) scale(${handleScale(t)})` });
  const pv = clamp01((TRACK - hx) / (2 * TRACK));
  $('price').textContent = '₪' + (Math.round((1800000 + pv * 600000) / 10000) * 10000).toLocaleString('en-US');

  // toggle, knob, tabs
  applyVis(L.toggle, t, [[5.5, 7.0]], 0.12);
  $('tgTrack').style.background = rgb(tgC, t);
  applyVis(L.badge, t, [[6.5, 7.0]], 0);
  const bo = applyVis(L.blob, t, [[5.5, 10.0]], 0.12);
  L.blob.style.transform = 'none';
  const l = bL(t), rr = bR(t), hh = bH(t), y0 = rowY(t);
  Object.assign($('blob').style, { left: l + 'px', width: Math.max(0, rr - l) + 'px', top: y0 - hh + 'px', height: 2 * hh + 'px',
    borderRadius: hh + 'px', background: rgb(blobC, t) });
  applyVis(L.tabs, t, [[7.0, 10.0]], 0.12);
  [154, 0, -154].forEach((cx, i) => {
    const cover = clamp01((Math.min(rr, cx + 36) - Math.max(l, cx - 36)) / 72);
    Object.assign($('tab' + i).style, { left: cx + 'px', top: y0 + 'px', color: `rgb(${mix(INK, WHITE, cover)})` });
  });

  // chart
  applyVis(L.chart, t, [[8.5, 10.0]], 0.14);
  const dp = clamp01(drawP(t));
  $('chartLine').setAttribute('stroke-dashoffset', 100 * (1 - dp));
  const hv = clamp01(hover(t));
  VALS.forEach((_, i) => {
    const seen = clamp01((dp - i / 6) * 8 + 1);
    const dot = $('dot' + i);
    dot.setAttribute('opacity', seen);
    dot.setAttribute('r', (i === 2 ? 5 + 2.5 * hv : 5) * (0.4 + 0.6 * seen));
  });
  $('hoverLine').setAttribute('opacity', hv);
  applyVis(L.tip, t, [[9.5, 10.0]], 0.02);

  // ⌘K
  applyVis(L.search, t, [[10.0, 12.0]], 0.12);
  const top = -h / 2, iy = top + 38;
  const typed = t < 12.6 ? TYPE.slice(0, TYPE_T.filter(x => t >= x).length) : "";   // cleared once hidden, for the seam
  Object.assign($('sIcon').style, { left: '250px', top: iy + 'px' });
  Object.assign($('sPh').style, { left: '220px', top: iy + 'px', opacity: typed ? 0 : 1 });
  const st = $('sText'); st.textContent = typed; Object.assign(st.style, { left: '220px', top: iy + 'px' });
  Object.assign($('sCaret').style, { left: 216 - (typed ? st.offsetWidth : 0) + 'px', top: iy - 14 + 'px', opacity: t > 10.2 && t < 11.9 ? 1 : 0 });
  Object.assign($('sKey').style, { left: '-252px', top: iy + 'px' });
  Object.assign($('sDiv').style, { top: top + 76 + 'px', opacity: clamp01((h - 90) / 30) });
  Object.assign($('sHi').style, { top: top + 82 + 4 + 'px', opacity: clamp01(hiP(t)) });
  RES.forEach((_, i) => {
    const el = L['res' + i];
    applyVis(el, t, i === 0 ? [[10.5, 12.0]] : [[10.5, 11.0]], 0.08 + i * 0.04);
    el.style.top = `calc(50% + ${top + 82 + 30 + i * 60}px)`;
  });
  const hp = clamp01(hiP(t));
  L.res0.querySelector('.rowAddr').style.opacity = 1 - hp;
  L.res0.querySelector('.rowEnter').style.opacity = hp;
  L.res0.querySelector('.rowIcon').style.color = `rgb(${mix([138, 133, 124], NAVY, hp)})`;

  applyVis(L.opened, t, [[12.0, 12.5]], 0.1);
  applyVis(L.toast, t, [[12.5, 13.5]], 0.12);
  applyVis(L.unread, t, [[13.0, 13.5]], 0);

  // cursor lives in screen space, pinned to the world through the camera
  const cx = 720 + s * curX(t), cy = 720 + s * curY(t);
  cursor.style.transform = `translate(${cx - 6}px,${cy - 4}px) scale(${curP(t)})`;
  cursor.style.opacity = clamp01(curO(t));
}

window.ready = (async () => { await document.fonts.load('600 24px Heebo'); await document.fonts.load('400 24px Heebo'); seek(0); return true; })();
window.seek = seek;
window.T = T;
</script>
