  :root{--ink:#0d1b3d;--ink-soft:#4a5578;--paper:#f4f7fe;--raised:#fff;--line:#e3e8f4;--blue:#0e2a6b;--ok:#1e7a4c;--bad:#b3261e;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55;padding:24px}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;border-radius:12px;font:inherit;font-weight:700;border:none;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none}
  .btn[disabled]{opacity:.6;cursor:default}
  .btn[hidden]{display:none}
  .msg{margin:14px 0 0;font-size:.9rem;min-height:1.2em}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

<!-- הסרה מתזכורות מדריך ההתחלה (יזמים ובעלי מקצוע). הדף הזה קיים ולא עמוד של הפונקציה, כי Supabase מגישה
     HTML מהדומיין הרגיל כ-text/plain (עם sandbox): עמוד אישור משם היה מוצג כקוד. ההסרה בפועל ב-POST בלבד, בלחיצה על
     הכפתור (סורקי קישורים של מייל פותחים כתובות), אל onboarding-reminders-unsubscribe, שמאמתת חתימת hmac בטוקן. -->
<main class="box" id="app">
  <h1>הסרה מתזכורות להשלמת העמוד</h1>
  <p id="lead">לא נשלח לכם יותר תזכורות על השלמת העמוד. אפשר להמשיך להשלים אותו בכל זמן.</p>
  <button type="button" class="btn" id="stopBtn">להסרה מהתזכורות</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="note">ההסרה מתבצעת רק בלחיצה על הכפתור. <a href="/">לאתר</a></p>
</main>

<script>
const FUNCTION_URL = 'https://obookujgolazrwycsiyn.supabase.co/functions/v1/onboarding-reminders-unsubscribe';
// הטוקן ב-fragment ולא ב-query: GA4 רושם את כתובת הדף עם ה-query, ולא עם ה-fragment (ואין לטוקן תפוגה)
const token = new URLSearchParams(location.hash.replace(/^#/, '')).get('t') || '';
history.replaceState(null, '', location.pathname); // הטוקן נשמר במשתנה, וה-fragment יוצא מהכתובת (GTM עלול לשלוח את הכתובת המלאה ל-GA4)
const btn = document.getElementById('stopBtn'), msg = document.getElementById('msg');

function say(text, kind){ msg.textContent = text; msg.className = 'msg ' + (kind || ''); }

if (!token){
  btn.hidden = true;
  say('הקישור אינו תקין. אפשר לכתוב לנו ונסיר ידנית.', 'bad');
}
btn.addEventListener('click', async ()=>{
  btn.disabled = true; say('מסירים…');
  try{
    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: token }),
    });
    const data = await res.json().catch(()=> ({}));
    if (res.ok && data.success){
      btn.hidden = true;
      document.getElementById('lead').textContent = 'הוסרתם מהתזכורות. לא נשלח לכם יותר תזכורות על השלמת העמוד.';
      say('', '');
      return;
    }
    btn.disabled = false;
    say(data.error === 'invalid_token' ? 'הקישור אינו תקין. אפשר לכתוב לנו ונסיר ידנית.' : 'משהו השתבש. נסו שוב בעוד רגע.', 'bad');
  } catch(e){
    btn.disabled = false;
    say('שגיאת רשת. נסו שוב בעוד רגע.', 'bad');
  }
});
</script>
</body>
