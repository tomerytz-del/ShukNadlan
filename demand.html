  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.55}
  h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--blue);margin:0 0 6px;font-size:1.25rem;line-height:1.3}
  .shell{max-width:520px;margin:0 auto;padding:24px 16px 40px}
  .card{background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center}
  .sub{color:var(--ink-soft);font-size:.92rem;margin:0 0 4px}
  .spin{width:28px;height:28px;border:3px solid var(--blue-tint);border-top-color:var(--blue);border-radius:50%;margin:4px auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem;margin:12px 0}
  .status.ok{background:var(--ok-tint);color:var(--ok)}

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:12px;font:inherit;font-weight:700;border:none;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;margin-top:8px}
  .foot{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:18px}
  .foot a{color:inherit}

<main class="shell">
  <div class="card" id="app" aria-live="polite">
    <div class="spin" id="spin"></div>
    <h1 id="title">מסמן "אני פונה" ופותח את הפוסט</h1>
    <p class="sub" id="sub">רגע, זה לוקח כמה שניות.</p>
    <div id="out"></div>
  </div>
</main>
<p class="foot"><a href="/">שוק נדל״ן</a></p>

<script>
/* הדף הזה הוא הלחיצה על פוסט בביקוש הפתוח. הלחיצה מסמנת "אני פונה" (התפיסה
   נעשית ב-POST ל-demand-claim, לא בטעינת הדף: תצוגה מקדימה של קישור בוואטסאפ
   אינה מריצה JavaScript ולכן אינה תופסת), ואז מעבירה לפוסט.
   docs/scraped-leads.md, "הלחיצה היא אני פונה" */
(function(){
  const FN_URL = 'https://obookujgolazrwycsiyn.supabase.co/functions/v1/demand-claim';
  const ANON = 'sb_publishable_oq0dgmwKy83K7sDO3hoDMA_VpSnR5Fx';
  const K = new URLSearchParams(location.search).get('k') || '';
  const $ = id => document.getElementById(id);

  function show(kind, title, sub, status, link){
    $('spin').style.display = 'none';
    $('title').textContent = title;
    $('sub').textContent = sub || '';
    const out = $('out');
    out.textContent = '';
    if (status){
      const box = document.createElement('div');
      box.className = 'status ' + kind;
      box.textContent = status;
      out.appendChild(box);
    }
    if (link){
      const a = document.createElement(link.href ? 'a' : 'button');
      a.className = 'btn';
      a.textContent = link.text;
      if (link.href){ a.href = link.href; a.rel = 'noopener noreferrer'; }
      else a.addEventListener('click', link.onClick);
      out.appendChild(a);
    }
  }

  function dayCap(n){ return n ? n + ' פניות ביום' : 'התקרה היומית'; }

  async function run(){
    if (!/^[0-9a-f]{32}$/.test(K)){
      show('bad', 'הקישור אינו תקין', 'בקשו מגבריאלה קישור חדש.', '', null);
      return;
    }
    $('spin').style.display = '';
    $('title').textContent = 'מסמן "אני פונה" ופותח את הפוסט';
    $('sub').textContent = 'רגע, זה לוקח כמה שניות.';
    $('out').textContent = '';
    let data = {};
    try {
      const res = await fetch(FN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON },
        body: JSON.stringify({ k: K }),
      });
      try { data = await res.json(); } catch(_){ data = {}; }
      if (res.status >= 500) data = { error: 'server' };
    } catch(_){
      data = { error: 'network' };
    }

    if (data.ok && /^https:\/\/([a-z0-9-]+\.)?(facebook|fb)\.com\//.test(String(data.url || ''))){
      const left = (data.daily_cap && data.my_today) ? Math.max(0, data.daily_cap - data.my_today) : null;
      show('ok',
        data.already_mine ? 'כבר סימנת "אני פונה" על הפוסט הזה' : 'סימנתי "אני פונה"',
        'עכשיו אפשר להגיב בפוסט או לשלוח הודעה בפייסבוק.',
        left === null || data.already_mine ? '' : 'נשארו לך ' + left + ' פניות להיום.',
        { text: 'לפתיחת הפוסט', href: data.url });
      // מעבר אוטומטי. הכפתור נשאר למקרה שהדפדפן של האפליקציה חסם אותו.
      setTimeout(function(){ location.replace(data.url); }, 600);
      return;
    }
    switch (data.error){
      case 'taken':
        show('warn', 'סוכן אחר כבר סימן "אני פונה" על הפוסט הזה',
          'פוסט בביקוש הפתוח נתפס על ידי הראשון שלוחץ. אין מה לעשות כאן.', '', null);
        break;
      case 'daily_cap':
        show('warn', 'הגעת לתקרה היומית',
          'הפוסט לא נתפס והוא נשאר פתוח. אפשר ללחוץ שוב מחר, והקישור בתוקף 7 ימים.',
          'התקרה: ' + dayCap(data.daily_cap), null);
        break;
      case 'no_link':
        show('bad', 'אין קישור תקין לפוסט הזה',
          'לכן לא סימנתי "אני פונה". אפשר לפתוח את הביקוש הפתוח ב-CRM.', '', null);
        break;
      case 'not_found':
      case 'unauthorized':
        show('bad', 'הקישור פג תוקף או שכבר אינו תקין', 'בקשו מגבריאלה קישור חדש.', '', null);
        break;
      default:
        show('bad', 'תקלה זמנית', 'לא סימנתי "אני פונה". אפשר לנסות שוב.', '',
          { text: 'ניסיון נוסף', onClick: run });
    }
  }
  run();
})();
</script>
